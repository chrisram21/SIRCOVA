      tags: [Catálogos]
      summary: Desactivar una vacuna
      description: |
        Desactivación lógica: la vacuna y sus dosis no se borran y los reportes anteriores la conservan. Solo
        cambia `activa` de la vacuna; sus dosis quedan como están. Una vacuna ya inactiva responde 200 sin
