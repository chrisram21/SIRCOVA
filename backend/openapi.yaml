openapi: 3.0.3
info:
  title: API del sistema web de producción de vacunación (DDRISS San Marcos)
  version: 0.1.0
  description: |
    Versión preliminar. Endpoints principales para que el sistema funcione de punta a punta:
    acceso, catálogos, configuración de formularios, registro de producción, revisión y cierre,
    indicadores, alertas y auditoría.

    El modelo de datos está descrito en `05_contexto_base_de_datos.md`.
    El sistema maneja solo datos agregados: ningún endpoint recibe ni devuelve datos de pacientes.

    Todas las rutas, salvo `/salud`, `/auth/login` y `/auth/refrescar`, exigen el encabezado
    `Authorization: Bearer <token>`. En cada petición se revisa además la cuenta del token: si la cuenta
    o su empleado están desactivados responde 401 `CUENTA_DESACTIVADA`, y si el rol, el establecimiento
    o el municipio ya no son los del token responde 401 `SESION_DESACTUALIZADA`. En los dos casos hay que
    iniciar sesión de nuevo.

    **Sesiones.** El servidor guarda cada sesión, y un usuario solo tiene una abierta: un inicio de sesión
    nuevo cierra la anterior. El JWT dura `JWT_EXPIRACION` (2 h) y lleva el id de su sesión (`sid`); en cada
    petición se revisa que esa sesión siga abierta. El JWT se renueva con `POST /auth/refrescar` y la cookie
    `sircova_refresh` (`HttpOnly`) hasta el fin de la jornada, `SESION_DURACION_MAXIMA` (8 h) desde el
    inicio de sesión. Una sesión sin peticiones durante `SESION_INACTIVIDAD` (30 min) deja de servir.
    Los 401 de la sesión están en la respuesta `NoAutenticado`.

    **Cambio obligatorio de contraseña.** Mientras la cuenta tenga `debeCambiarContrasena` (por ejemplo,
    con la contraseña temporal que le dio el administrador), todo endpoint protegido responde
    403 `CAMBIO_CONTRASENA_REQUERIDO` (respuesta `CambioContrasenaRequerido`), salvo `POST /auth/contrasena`,
    `POST /auth/logout` y `GET /auth/yo`. Ese 403 no se registra en la bitácora.

    **Permisos.** Cada función exige su propio permiso, con la forma `ENTIDAD_ACCION` (por ejemplo,
    `USUARIO_CREAR`). Cada operación protegida declara el suyo con la extensión `x-permiso: CODIGO` y
    documenta la respuesta `"403": { $ref: "#/components/responses/SinPermiso" }`. El rol `AUTORIDAD`
    es de solo consulta: recibe 403 en cualquier método distinto de `GET` aunque tenga el permiso.
    `/salud`, `POST /auth/login`, `POST /auth/logout`, `POST /auth/contrasena` y `GET /auth/yo` no llevan permiso.
    Un recurso fuera del ámbito del usuario (su establecimiento o su DDRISS) responde 404, igual que
    uno que no existe.

    **Bitácora.** Toda escritura, cada exportación y cada acceso denegado quedan en la bitácora, que no se puede modificar ni borrar.

    **Cuerpo de la solicitud.** Ningún endpoint acepta cuerpos comprimidos: un `Content-Encoding` distinto de
    `identity` responde 415 `CODIFICACION_NO_ADMITIDA` (respuesta `CodificacionNoAdmitida`). El cuerpo no puede
    pasar de 1 MB: uno más grande responde 413 `CUERPO_DEMASIADO_GRANDE` (respuesta `CuerpoDemasiadoGrande`).
    Los dos se responden antes de llegar al endpoint, sin revisar el token, y no van a la bitácora.
servers:
  - url: http://localhost:3000/api/v1
    description: Desarrollo local

tags:
  - name: Sistema
  - name: Autenticación
  - name: Usuarios
  - name: Catálogos
  - name: Configuración
  - name: Producción
  - name: Revisión
  - name: Indicadores
  - name: Alertas y auditoría

security:
  - bearerAuth: []

paths:
  /salud:
    get:
      tags: [Sistema]
      summary: Estado de la API y de las conexiones a MySQL y MongoDB
      description: |
        Comprueba cada base con un tiempo límite de 5 segundos. Solo informa `ok` o `error`;
        el detalle técnico de la falla queda en el registro del servidor, nunca en la respuesta.
      security: []
      responses:
        "200":
          description: La API y las bases de datos responden
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado: { type: string, example: ok }
                  mysql: { type: string, enum: [ok, error], example: ok }
                  mongo: { type: string, enum: [ok, error], example: ok }
        "503":
          description: Una o ambas bases de datos no responden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  codigo: BD_NO_DISPONIBLE
                  mensaje: Una o más bases de datos no responden.
                  detalles:
                    - { mysql: ok, mongo: error }

  # ---------------------------------------------------------------- Autenticación
  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      description: |
        Devuelve un JWT (HS256) que vence según `JWT_EXPIRACION` y contiene `sub`, `sid` (el id de la sesión),
        `rol`, `permisos`, `ddrissId`, `establecimientoId` y `municipioId`.

        Abre una sesión nueva y cierra la que el usuario tuviera abierta: esa recibe después
        401 `SESION_REEMPLAZADA`. Pone la cookie `sircova_refresh` con el refresh token de la sesión.

        Al 5.º intento fallido seguido la cuenta se bloquea 15 minutos; ese mismo intento ya responde 423.
        Un usuario inexistente y una contraseña incorrecta responden el mismo 401.
        Los 403 solo se devuelven si la contraseña es correcta.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombreUsuario, contrasena]
              properties:
                nombreUsuario: { type: string, example: jperez }
                contrasena: { type: string, format: password }
      responses:
        "200":
          description: Sesión iniciada
          headers:
            Set-Cookie: { $ref: "#/components/headers/CookieRefresh" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespuestaLogin" }
        "400":
          description: Falta el nombre de usuario o la contraseña
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: Debe indicar el nombre de usuario y la contraseña. }
        "401":
          description: Usuario inexistente o contraseña incorrecta (mismo cuerpo en ambos casos)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: CREDENCIALES_INVALIDAS, mensaje: Usuario o contraseña incorrectos. }
        "403":
          description: Contraseña correcta, pero la cuenta está desactivada o no tiene alcance asignado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                desactivada:
                  value:
                    error: { codigo: CUENTA_DESACTIVADA, mensaje: Su cuenta está desactivada; contacte al administrador. }
                sinAlcance:
                  value:
                    error: { codigo: CUENTA_SIN_ALCANCE, mensaje: Su cuenta no tiene una DDRISS o un establecimiento asignado; contacte al administrador. }
        "423":
          description: Cuenta bloqueada por intentos fallidos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: CUENTA_BLOQUEADA, mensaje: Su usuario ha sido bloqueado. Contáctese con su administrador de DDRISS o intente de nuevo en 15 minutos. }

  /auth/refrescar:
    post:
      tags: [Autenticación]
      summary: Renovar el JWT con la cookie de la sesión
      description: |
        No lleva Bearer: la sesión se identifica con la cookie `sircova_refresh`. Devuelve un JWT nuevo con
        los permisos y datos actuales de la cuenta, en la misma forma que el login, hasta el fin de la jornada.

        Cambia el refresh token y manda la cookie nueva. El refresh anterior se acepta 30 segundos más
        (varias pestañas que renuevan a la vez): en ese caso responde el JWT sin cambiar la cookie.
        Funciona aunque la cuenta deba cambiar la contraseña (`debeCambiarContrasena: true`).

        No va a la bitácora. Cualquier 401 borra la cookie.
      security:
        - cookieRefresh: []
      responses:
        "200":
          description: JWT renovado
          headers:
            Set-Cookie:
              description: La cookie nueva; no viene si se usó el refresh anterior dentro del margen de 30 s
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespuestaLogin" }
        "401":
          description: |
            Sin cookie, con un refresh desconocido o usado fuera del margen (NO_AUTENTICADO), o con la sesión
            cerrada (SESION_CERRADA, SESION_REEMPLAZADA, CONTRASENA_RESTABLECIDA, CUENTA_DESACTIVADA,
            SESION_DESACTUALIZADA), inactiva (SESION_INACTIVA) o con la jornada terminada (JORNADA_TERMINADA).
            Borra la cookie.
          headers:
            Set-Cookie: { $ref: "#/components/headers/CookieRefreshBorrada" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                noAutenticado:
                  value:
                    error: { codigo: NO_AUTENTICADO, mensaje: Debe iniciar sesión. }
                jornadaTerminada:
                  value:
                    error: { codigo: JORNADA_TERMINADA, mensaje: Su jornada de 8 horas terminó; inicie sesión de nuevo. }

  /auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar sesión
      description: |
        Cierra la sesión en el servidor: después, el token responde 401 `SESION_CERRADA` y la cookie ya no
        renueva. Registra el cierre en la bitácora (acción `LOGOUT` con el motivo).

        La sesión se toma del Bearer si es válido y no venció; si no, de la cookie `sircova_refresh`.
        Sin ninguno de los dos responde 401. Si la sesión ya estaba cerrada (por ejemplo, reemplazada)
        o la cookie no corresponde a ninguna, responde 204 sin escribir en la bitácora.
        Siempre borra la cookie.

        El cuerpo es opcional; sin `motivo` se registra `MANUAL`.
      security:
        - bearerAuth: []
        - cookieRefresh: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CierreSesionEntrada" }
      responses:
        "204":
          description: Sesión cerrada, o ya estaba cerrada
          headers:
            Set-Cookie: { $ref: "#/components/headers/CookieRefreshBorrada" }
        "400":
          description: El motivo no es MANUAL ni INACTIVIDAD
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: El motivo del cierre de sesión no es válido. }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /auth/contrasena:
    post:
      tags: [Autenticación]
      summary: Cambiar la contraseña propia
      description: |
        Exige la contraseña actual. La nueva debe tener al menos 12 caracteres y como máximo 72 bytes
        en UTF-8 (límite de bcrypt), obtener 3 o más (de 0 a 4) en zxcvbn y no contener ninguna palabra
        de 3 letras o más del nombre de usuario, los nombres o los apellidos (sin importar mayúsculas
        ni tildes). No se exigen mayúsculas, números ni símbolos.

        Se revisa en este orden: formato, contraseña actual, nueva igual a la actual y política.
        Una contraseña actual incorrecta no suma a los intentos fallidos ni se registra en la bitácora.

        El cambio deja `debeCambiarContrasena` en `false` y queda en la bitácora (acción `CAMBIO_CONTRASENA`)
        sin las contraseñas. La sesión sigue abierta.
        Es una de las rutas que se pueden usar mientras la cuenta deba cambiar la contraseña.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CambioContrasenaEntrada" }
      responses:
        "204": { description: Contraseña cambiada }
        "400":
          description: Falta un campo, no es texto o viene un campo que no se acepta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: Debe indicar la contraseña actual y la nueva. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "422":
          description: La contraseña actual no coincide, la nueva es igual a la actual o no cumple la política
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                actualIncorrecta:
                  value:
                    error: { codigo: CONTRASENA_ACTUAL_INCORRECTA, mensaje: La contraseña actual no es correcta. }
                repetida:
                  value:
                    error: { codigo: CONTRASENA_REPETIDA, mensaje: La contraseña nueva debe ser distinta de la actual. }
                debil:
                  value:
                    error: { codigo: CONTRASENA_DEBIL, mensaje: Debe tener al menos 12 caracteres. }

  /auth/yo:
    get:
      tags: [Autenticación]
      summary: Datos de la cuenta y del empleado de la sesión actual (pantalla «Mi perfil»)
      description: |
        Siempre de la propia cuenta y sin permiso propio; también responde si la cuenta debe cambiar su
        contraseña. Los permisos son los del token (los cambios aplican desde el siguiente inicio de sesión).
        Nunca trae el CUI ni su huella, la contraseña, los intentos fallidos ni la fecha del bloqueo.
      responses:
        "200":
          description: La cuenta de la sesión actual
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Perfil" }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  # ---------------------------------------------------------------- Usuarios
  /empleados:
    get:
      tags: [Usuarios]
      summary: Listar empleados
      parameters:
        - { $ref: "#/components/parameters/Pagina" }
        - { $ref: "#/components/parameters/PorPagina" }
      responses:
        "200": { description: Lista paginada de empleados }
    post:
      tags: [Usuarios]
      summary: Registrar un empleado de la DDRISS del administrador (puede existir sin cuenta)
      description: |
        La DDRISS del empleado es siempre la del usuario que lo registra; no viene en el cuerpo.
        Con establecimiento, el municipio se toma del establecimiento; `municipioId` solo se acepta
        sin establecimiento y debe ser del departamento sede de la DDRISS. `cui` y `correo` son obligatorios;
        los textos opcionales vacíos se guardan como `null`. Cada texto se limpia (espacios de los extremos
        fuera, espacios dobles reducidos a uno) antes de validarlo; un formato inválido responde 400
        `ENTRADA_INVALIDA` con un mensaje que nombra el campo. El CUI nunca se guarda ni se devuelve: se
        guarda solo su huella HMAC-SHA256 y la respuesta indica `cuiRegistrado`.
      x-permiso: EMPLEADO_CREAR
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmpleadoEntrada" }
      responses:
        "201":
          description: Empleado creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Empleado" }
        "400": { $ref: "#/components/responses/EntradaInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "409":
          description: Correo o CUI repetido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                correo:
                  value:
                    error: { codigo: CORREO_DUPLICADO, mensaje: Ya hay un empleado con ese correo. }
                cui:
                  value:
                    error: { codigo: CUI_DUPLICADO, mensaje: Ya hay un empleado registrado con ese CUI. }
        "422":
          description: Establecimiento o municipio fuera del ámbito, inexistente o inactivo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                establecimiento:
                  value:
                    error: { codigo: ESTABLECIMIENTO_INVALIDO, mensaje: El establecimiento no existe, está inactivo o no es de su DDRISS. }
                municipio:
                  value:
                    error: { codigo: MUNICIPIO_INVALIDO, mensaje: El municipio no existe, está inactivo o no es del departamento de su DDRISS. }

  /empleados/{id}:
    patch:
      tags: [Usuarios]
      summary: Editar los datos de un empleado de la DDRISS del administrador
      description: |
        Cambio parcial: solo se envían los campos que cambian, y al menos uno. Solo se validan los campos que
        llegan, así que un dato viejo que no cumple el formato no impide editar otro campo. `null` o un texto
        vacío borran un campo opcional; `correo` y `cui` no se pueden borrar (400). `cui` registra el CUI o
        reemplaza el que había. Las reglas de establecimiento y municipio se aplican al resultado (lo guardado más
        lo que llega): con establecimiento, el municipio se toma de él. Si la cuenta del empleado tiene rol
        `ESTABLECIMIENTO`, no se le puede quitar el establecimiento. Si la cuenta del empleado está
        desactivada, primero hay que restaurarla. Una petición que no cambia nada responde 200 sin
        registrar nada en la bitácora.
      x-permiso: EMPLEADO_EDITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmpleadoCambios" }
      responses:
        "200":
          description: Empleado actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Empleado" }
        "400": { $ref: "#/components/responses/EntradaInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: Correo o CUI repetido, o la cuenta del empleado está desactivada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                correo:
                  value:
                    error: { codigo: CORREO_DUPLICADO, mensaje: Ya hay un empleado con ese correo. }
                cui:
                  value:
                    error: { codigo: CUI_DUPLICADO, mensaje: Ya hay un empleado registrado con ese CUI. }
                cuentaDesactivada:
                  value:
                    error: { codigo: CUENTA_DESACTIVADA, mensaje: La cuenta está desactivada; restáurela para editarla. }
        "422":
          description: Establecimiento o municipio inválido, o se quita el establecimiento a una cuenta ESTABLECIMIENTO
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                establecimiento:
                  value:
                    error: { codigo: ESTABLECIMIENTO_INVALIDO, mensaje: El establecimiento no existe, está inactivo o no es de su DDRISS. }
                municipio:
                  value:
                    error: { codigo: MUNICIPIO_INVALIDO, mensaje: El municipio no existe, está inactivo o no es del departamento de su DDRISS. }
                sinEstablecimiento:
                  value:
                    error: { codigo: EMPLEADO_SIN_ESTABLECIMIENTO, mensaje: Para el rol de personal del establecimiento, el empleado debe tener un establecimiento. }

  /usuarios:
    get:
      tags: [Usuarios]
      summary: Buscar y filtrar las cuentas de la DDRISS del usuario, paginadas
      description: |
        Siempre dentro de la DDRISS del usuario (la autoridad nacional ve todas); los filtros se combinan entre sí.
        Ordenadas por apellidos, nombres e id del empleado. Nunca devuelve la contraseña, su hash, los intentos
        fallidos ni la fecha del bloqueo; solo `bloqueada`.

        - `busqueda` busca por coincidencia parcial en el nombre completo (`nombres apellidos`) y en el nombre de
          usuario, sin distinguir mayúsculas ni tildes. `%`, `_` y `\` se buscan como texto, no como comodines.
        - `estado=BLOQUEADA` son las cuentas activas con el bloqueo por intentos vigente; también aparecen con
          `estado=ACTIVA`, porque una cuenta bloqueada sigue activa.
        - Un `rolId` o `establecimientoId` que no existe o es de otra DDRISS devuelve una lista vacía, no un error.
        - Una `pagina` mayor que la última responde 200 con `elementos` vacío y el `total` real.
        - Un parámetro inválido, desconocido o repetido responde 400 `ENTRADA_INVALIDA`.
      x-permiso: USUARIO_CONSULTAR
      parameters:
        - name: busqueda
          in: query
          description: Parte del nombre completo o del nombre de usuario; se limpian los espacios y vacío equivale a no enviarlo
          schema: { type: string, maxLength: 100, example: ana lopez }
        - name: rolId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: establecimientoId
          in: query
          description: Id del establecimiento, o `ninguno` para las cuentas sin establecimiento (sede de la DDRISS)
          schema:
            oneOf:
              - { type: integer, minimum: 1 }
              - { type: string, enum: [ninguno] }
        - name: estado
          in: query
          schema: { type: string, enum: [ACTIVA, DESACTIVADA, BLOQUEADA] }
        - { $ref: "#/components/parameters/Pagina" }
        - { $ref: "#/components/parameters/PorPagina" }
      responses:
        "200":
          description: Página de cuentas del ámbito del usuario que cumplen los filtros
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginaUsuarios" }
        "400":
          description: Un parámetro inválido, desconocido o repetido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                pagina:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: pagina debe ser un número entero mayor o igual a 1. }
                porPagina:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: porPagina debe ser un número entero entre 1 y 100. }
                rolId:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: rolId debe ser un número entero positivo. }
                establecimientoId:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "establecimientoId debe ser un número entero positivo o 'ninguno'." }
                estado:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: estado debe ser ACTIVA, DESACTIVADA o BLOQUEADA. }
                busqueda:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "busqueda: como máximo 100 caracteres." }
                desconocido:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: orden." }
                repetido:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: estado no se puede repetir. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
    post:
      tags: [Usuarios]
      summary: Crear la cuenta de acceso de un empleado (solo Administrador)
      description: |
        El sistema genera la contraseña temporal (12 caracteres que cumplen la política de contraseñas),
        la guarda con bcrypt y la devuelve una sola vez en la respuesta. La cuenta queda con
        `debeCambiarContrasena: true`. La bitácora no guarda la contraseña.
        El empleado debe estar activo, ser de la DDRISS del administrador y no tener cuenta.
        El rol `ESTABLECIMIENTO` exige que el empleado tenga establecimiento.
      x-permiso: USUARIO_CREAR
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsuarioEntrada" }
      responses:
        "201":
          description: Cuenta creada, con la contraseña temporal generada; nunca devuelve su hash
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioCreado" }
        "400":
          description: La solicitud no cumple el formato esperado, o trae `contrasenaTemporal`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: La contraseña temporal la genera el sistema; no la envíe. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: El empleado ya tiene cuenta o el nombre de usuario ya existe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                empleadoConCuenta:
                  value:
                    error: { codigo: EMPLEADO_CON_CUENTA, mensaje: El empleado ya tiene una cuenta. }
                nombreUsuario:
                  value:
                    error: { codigo: NOMBRE_USUARIO_DUPLICADO, mensaje: Ya existe ese nombre de usuario. }
        "422":
          description: Rol inexistente o rol ESTABLECIMIENTO para un empleado sin establecimiento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                rol:
                  value:
                    error: { codigo: ROL_INVALIDO, mensaje: El rol no existe. }
                sinEstablecimiento:
                  value:
                    error: { codigo: EMPLEADO_SIN_ESTABLECIMIENTO, mensaje: Para el rol de personal del establecimiento, el empleado debe tener un establecimiento. }

  /roles:
    get:
      tags: [Usuarios]
      summary: Listar los roles
      x-permiso: ROL_CONSULTAR
      responses:
        "200":
          description: Los cinco roles
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    codigo: { type: string, example: REVISOR }
                    nombre: { type: string, example: Estadígrafa / revisor DDRISS }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /usuarios/{id}:
    get:
      tags: [Usuarios]
      summary: Consultar una cuenta de la DDRISS del usuario
      x-permiso: USUARIO_CONSULTAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: La cuenta con los datos de su empleado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioDetalle" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
    patch:
      tags: [Usuarios]
      summary: Cambiar el rol de una cuenta
      description: |
        Solo cambia el rol; para desactivar o restaurar se usan `/desactivar` y `/restaurar`.
        No se puede cambiar el rol propio ni el de una cuenta desactivada. El rol `ESTABLECIMIENTO` exige
        que el empleado tenga establecimiento. Se revisa en este orden: cuenta (404), cuenta desactivada (409),
        cuenta propia (422), rol (422) y establecimiento (422). El mismo rol responde 200 sin registrar nada
        en la bitácora.
      x-permiso: USUARIO_EDITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rolId]
              additionalProperties: false
              properties:
                rolId: { type: integer }
      responses:
        "200":
          description: Cuenta actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioDetalle" }
        "400": { $ref: "#/components/responses/EntradaInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: La cuenta está desactivada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: CUENTA_DESACTIVADA, mensaje: La cuenta está desactivada; restáurela para editarla. }
        "422":
          description: Cuenta propia, rol inexistente o rol ESTABLECIMIENTO para un empleado sin establecimiento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                cuentaPropia:
                  value:
                    error: { codigo: CUENTA_PROPIA, mensaje: No puede cambiar su propio rol. }
                rol:
                  value:
                    error: { codigo: ROL_INVALIDO, mensaje: El rol no existe. }
                sinEstablecimiento:
                  value:
                    error: { codigo: EMPLEADO_SIN_ESTABLECIMIENTO, mensaje: Para el rol de personal del establecimiento, el empleado debe tener un establecimiento. }

  /usuarios/{id}/desactivar:
    post:
      tags: [Usuarios]
      summary: Desactivar una cuenta (desactivación lógica; el empleado y su historial no cambian)
      description: |
        Pone `activo: false` y la fecha de desactivación. La cuenta ya no puede iniciar sesión, y su sesión
        abierta recibe 401 `CUENTA_DESACTIVADA` en la siguiente petición. No se puede desactivar la cuenta
        propia. Una cuenta ya desactivada responde 200 sin registrar nada en la bitácora.
      x-permiso: USUARIO_DESACTIVAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Cuenta desactivada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioDetalle" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "422":
          description: Es la cuenta propia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: CUENTA_PROPIA, mensaje: No puede desactivar su propia cuenta. }

  /usuarios/{id}/restaurar:
    post:
      tags: [Usuarios]
      summary: Restaurar una cuenta desactivada
      description: |
        Pone `activo: true` y limpia la fecha de desactivación, los intentos fallidos y el bloqueo.
        Una cuenta ya activa responde 200 sin registrar nada en la bitácora.
      x-permiso: USUARIO_DESACTIVAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Cuenta restaurada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioDetalle" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: El empleado de la cuenta está inactivo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: EMPLEADO_INACTIVO, mensaje: El empleado de esta cuenta está inactivo. }

  /usuarios/{id}/desbloquear:
    post:
      tags: [Usuarios]
      summary: Quitar el bloqueo por intentos fallidos de una cuenta (HU-62)
      description: |
        Pone los intentos fallidos en 0 y quita el bloqueo, para que la persona entre sin esperar a que venza.
        Se permite desbloquear la cuenta propia. Se revisa en este orden: cuenta (404), cuenta desactivada (409)
        y cuenta no bloqueada (409). Cada desbloqueo queda en la bitácora (`DESBLOQUEAR`).
      x-permiso: USUARIO_DESBLOQUEAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Cuenta desbloqueada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioDetalle" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: La cuenta está desactivada o no está bloqueada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                desactivada:
                  value:
                    error: { codigo: CUENTA_DESACTIVADA, mensaje: La cuenta está desactivada; al restaurarla se quita el bloqueo. }
                noBloqueada:
                  value:
                    error: { codigo: CUENTA_NO_BLOQUEADA, mensaje: La cuenta no está bloqueada. }

  /usuarios/{id}/restablecer-contrasena:
    post:
      tags: [Usuarios]
      summary: Restablecer la contraseña de una cuenta con una temporal generada por el sistema (HU-63)
      description: |
        Genera una contraseña temporal (12 caracteres que cumplen la política de contraseñas), guarda su hash,
        deja la cuenta con `debeCambiarContrasena: true` y quita el bloqueo si lo hay. La contraseña se
        devuelve una sola vez y la anterior deja de servir. La sesión abierta de esa cuenta recibe 403
        `CAMBIO_CONTRASENA_REQUERIDO` en la siguiente petición. Se revisa en este orden: cuenta (404), cuenta
        desactivada (409) y cuenta propia (422). Cada restablecimiento queda en la bitácora
        (`RESTABLECER_CONTRASENA`), sin la contraseña, aunque no cambie ningún otro dato.
      x-permiso: USUARIO_RESTABLECER_CONTRASENA
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Contraseña restablecida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestablecimientoContrasena" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: La cuenta está desactivada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: CUENTA_DESACTIVADA, mensaje: La cuenta está desactivada; restáurela antes de restablecer su contraseña. }
        "422":
          description: Es la cuenta propia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: CUENTA_PROPIA, mensaje: Para cambiar su propia contraseña use «Cambiar contraseña». }

  # ---------------------------------------------------------------- Catálogos
  /ddriss:
    get:
      tags: [Catálogos]
      summary: Listar las DDRISS activas del ámbito del usuario
      description: Devuelve la DDRISS del usuario; la autoridad nacional (sin DDRISS) recibe todas.
      x-permiso: DDRISS_CONSULTAR
      responses:
        "200":
          description: Lista de DDRISS
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    codigo: { type: string, example: DDRISS_SM }
                    nombre: { type: string }
                    departamentoId: { type: integer }
                    departamentoNombre: { type: string, example: San Marcos }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /municipios:
    get:
      tags: [Catálogos]
      summary: Listar los municipios del ámbito del usuario (codigo_ine es la llave del GeoJSON)
      description: |
        Solo consulta: los municipios son el catálogo INE y no se crean, editan ni borran desde la API.

        - `alcance=departamento` (por defecto): los municipios del departamento sede de la DDRISS del usuario,
          ordenados por nombre.
        - `alcance=procedencia`: además, el `9999` «Migrantes / fuera de San Marcos» y los municipios fuera del
          departamento donde la DDRISS tiene un establecimiento (p. ej. Coatepeque); por nombre, con el `9999` al final.
        - `alcance=todos`: todos los municipios de la tabla, de cualquier departamento, incluido el `9999`; por nombre
          del departamento y del municipio, con el `9999` al final. Lo usa el formulario de establecimientos para
          registrar uno externo.
        - La autoridad nacional (sin DDRISS) recibe todos los municipios con `departamento` y `procedencia`.
        - Sin `incluirInactivos=true` solo devuelve los activos.
        - Un parámetro inválido, desconocido o repetido responde 400 `ENTRADA_INVALIDA`.
      x-permiso: MUNICIPIO_CONSULTAR
      parameters:
        - name: alcance
          in: query
          schema: { type: string, enum: [departamento, procedencia, todos], default: departamento }
        - name: incluirInactivos
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Lista de municipios
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    departamentoId: { type: integer }
                    departamentoNombre: { type: string, example: San Marcos }
                    codigoIne: { type: string, example: "1207" }
                    nombre: { type: string, example: Tacaná }
                    activo: { type: boolean }
        "400":
          description: Un parámetro inválido, desconocido o repetido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                alcance:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: alcance debe ser departamento, procedencia o todos. }
                incluirInactivos:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: incluirInactivos debe ser true o false. }
                desconocido:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: orden." }
                repetido:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: alcance no se puede repetir. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /distritos:
    get:
      tags: [Catálogos]
      summary: Listar los distritos de salud del ámbito del usuario
      description: |
        Los distritos de la DDRISS del usuario (la autoridad nacional ve todos), activos e inactivos salvo que
        se filtre por `activo`. Ordenados por nombre del municipio y código. Sin paginar.
        Un parámetro inválido, desconocido o repetido responde 400 `ENTRADA_INVALIDA`.
      x-permiso: DISTRITO_CONSULTAR
      parameters:
        - name: municipioId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: activo
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Lista de distritos de salud
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DistritoSalud" }
        "400":
          description: Un parámetro inválido, desconocido o repetido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                municipioId:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: municipioId debe ser un número entero positivo. }
                activo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: activo debe ser true o false. }
                desconocido:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: orden." }
                repetido:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: activo no se puede repetir. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
    post:
      tags: [Catálogos]
      summary: Registrar un distrito de salud en la DDRISS del usuario
      description: |
        La DDRISS sale del token. El municipio debe estar activo y ser del departamento sede de la DDRISS
        (el `9999` y los municipios de establecimientos externos no se aceptan). El nombre no puede repetirse
        en el mismo municipio, sin distinguir mayúsculas ni tildes.

        El código lo genera el sistema: `DS-{código INE del municipio}-{NN}`, donde `NN` es el mayor consecutivo
        de los códigos de ese municipio (activos e inactivos) más uno, con al menos dos dígitos. Un código sin
        consecutivo (`DS-1201`, de los datos de prueba) cuenta como `01`. El código no se puede cambiar después.
      x-permiso: DISTRITO_CREAR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [municipioId, nombre]
              additionalProperties: false
              properties:
                municipioId: { type: integer, minimum: 1, example: 7 }
                nombre: { $ref: "#/components/schemas/TextoNombreDistrito" }
      responses:
        "201":
          description: Distrito registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistritoSalud" }
        "400":
          description: Nombre inválido o campo no permitido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                nombre:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El nombre del distrito debe tener entre 3 y 120 caracteres. }
                campo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: codigo." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "409":
          description: Ya hay un distrito con ese nombre en el municipio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: DISTRITO_DUPLICADO, mensaje: Ya hay un distrito con ese nombre en el municipio. }
        "422":
          description: El municipio no existe, está inactivo o no es del departamento sede de la DDRISS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: MUNICIPIO_INVALIDO, mensaje: El municipio no existe, está inactivo o no es del departamento de su DDRISS. }

  /distritos/{id}:
    patch:
      tags: [Catálogos]
      summary: Cambiar el nombre de un distrito de salud
      description: |
        Solo cambia el nombre, también de un distrito inactivo. El código y el municipio no se pueden cambiar;
        para otro municipio se desactiva el distrito y se registra otro. El mismo nombre responde 200 sin
        registrar nada en la bitácora.
      x-permiso: DISTRITO_EDITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              additionalProperties: false
              properties:
                nombre: { $ref: "#/components/schemas/TextoNombreDistrito" }
      responses:
        "200":
          description: Distrito actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistritoSalud" }
        "400":
          description: Nombre inválido o ausente, campo que no se puede cambiar o campo no permitido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                nombre:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El nombre del distrito debe tener entre 3 y 120 caracteres. }
                sinNombre:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El nombre del distrito es obligatorio. }
                municipio:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: municipioId no se puede cambiar. }
                codigo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: codigo no se puede cambiar. }
                campo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: activo." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/DistritoNoEncontrado" }
        "409":
          description: Ya hay otro distrito con ese nombre en el municipio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: DISTRITO_DUPLICADO, mensaje: Ya hay un distrito con ese nombre en el municipio. }

  /distritos/{id}/desactivar:
    post:
      tags: [Catálogos]
      summary: Desactivar un distrito de salud
      description: |
        Desactivación lógica: el distrito no se borra. No se puede desactivar mientras tenga establecimientos
        activos. Un distrito ya inactivo responde 200 sin registrar nada en la bitácora.
      x-permiso: DISTRITO_EDITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Distrito desactivado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistritoSalud" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/DistritoNoEncontrado" }
        "409":
          description: El distrito tiene establecimientos activos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: DISTRITO_CON_ESTABLECIMIENTOS, mensaje: El distrito tiene 3 establecimientos activos; muévalos o desactívelos primero. }

  /distritos/{id}/reactivar:
    post:
      tags: [Catálogos]
      summary: Reactivar un distrito de salud
      description: |
        Exige que el municipio del distrito siga activo. Un distrito ya activo responde 200 sin registrar nada
        en la bitácora.
      x-permiso: DISTRITO_EDITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Distrito reactivado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistritoSalud" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/DistritoNoEncontrado" }
        "422":
          description: El municipio del distrito está inactivo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: MUNICIPIO_INVALIDO, mensaje: El municipio no existe, está inactivo o no es del departamento de su DDRISS. }


  /redes:
    get:
      tags: [Catálogos]
      summary: Listar las redes de municipios del ámbito del usuario
      description: |
        Las redes de la DDRISS del usuario, activas e inactivas salvo que se filtre por `activo`, ordenadas por
        nombre. Sin paginar. La Autoridad nacional (sin DDRISS) ve las de todo el país, o las de `ddrissId`; a los
        demás roles `ddrissId` les responde 400. Una red inactiva no tiene municipios.
        Un parámetro inválido, desconocido o repetido responde 400 `ENTRADA_INVALIDA`.
      x-permiso: RED_CONSULTAR
      parameters:
        - name: activo
          in: query
          schema: { type: boolean }
        - name: ddrissId
          in: query
          description: Solo la Autoridad nacional; opcional
          schema: { type: integer, minimum: 1, example: 1 }
      responses:
        "200":
          description: Lista de redes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Red" }
        "400":
          description: Un parámetro inválido, desconocido o repetido, o `ddrissId` de un rol que no es la Autoridad nacional
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                activo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: activo debe ser true o false. }
                ddrissId:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: ddrissId." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
    post:
      tags: [Catálogos]
      summary: Registrar una red de municipios en la DDRISS del usuario
      description: |
        La DDRISS sale del token. El código lo genera el sistema: `RED_{NN}`, donde `NN` es el mayor consecutivo de
        las redes de la DDRISS (activas e inactivas) más uno, con al menos dos dígitos; no se puede cambiar después.

        Los municipios deben estar activos, ser del departamento sede de la DDRISS, no ser el `9999` y no estar en
        otra red. Las trazadoras son las dosis activas con `esTrazadora` de las vacunas activas; se cambian después
        con `PATCH`. El nombre no puede repetirse en la DDRISS, sin distinguir mayúsculas ni tildes.
      x-permiso: RED_CREAR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, municipioIds]
              additionalProperties: false
              properties:
                nombre: { $ref: "#/components/schemas/TextoNombreRed" }
                municipioIds: { $ref: "#/components/schemas/IdsMunicipiosRed" }
      responses:
        "201":
          description: Red registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Red" }
        "400": { $ref: "#/components/responses/RedEntradaInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "409": { $ref: "#/components/responses/RedConflicto" }
        "422": { $ref: "#/components/responses/RedInvalida" }

  /redes/opciones:
    get:
      tags: [Catálogos]
      summary: Lo que necesita el formulario de redes (municipios y dosis)
      description: |
        Los municipios que puede tener una red de la DDRISS del usuario (activos, del departamento sede, sin el
        `9999`), por nombre, cada uno con la red activa en la que está o `null`; y las vacunas activas con sus dosis
        activas, por `ordenInforme` y nombre (las dosis por `orden`). Sin parámetros (uno desconocido responde
        400). La Autoridad no tiene `RED_EDITAR`.
      x-permiso: RED_EDITAR
      responses:
        "200":
          description: Las opciones del formulario
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpcionesRed" }
        "400":
          description: Parámetro no permitido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: activo." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /redes/{id}:
    get:
      tags: [Catálogos]
      summary: Consultar una red de municipios
      x-permiso: RED_CONSULTAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: La red
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Red" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/RedNoEncontrada" }
    patch:
      tags: [Catálogos]
      summary: Cambiar el nombre, los municipios o las trazadoras de una red activa
      description: |
        Cada lista reemplaza por completo la anterior; un campo que no viene no cambia. Las mismas reglas del alta
        para el nombre y los municipios. Las trazadoras nuevas deben ser dosis activas de vacunas activas; una ya
        guardada se puede conservar aunque se haya desactivado. Una red activa queda siempre con al menos un
        municipio y una trazadora. Sin cambios responde 200 sin registrar nada en la bitácora. Una red inactiva
        se cambia al reactivarla.
      x-permiso: RED_EDITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                nombre: { $ref: "#/components/schemas/TextoNombreRed" }
                municipioIds: { $ref: "#/components/schemas/IdsMunicipiosRed" }
                dosisIds: { $ref: "#/components/schemas/IdsDosisRed" }
      responses:
        "200":
          description: Red actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Red" }
        "400": { $ref: "#/components/responses/RedEntradaInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/RedNoEncontrada" }
        "409": { $ref: "#/components/responses/RedConflicto" }
        "422": { $ref: "#/components/responses/RedInvalida" }

  /redes/{id}/desactivar:
    post:
      tags: [Catálogos]
      summary: Desactivar una red de municipios
      description: |
        Desactivación lógica: la red no se borra. Sus municipios quedan libres (se quitan de la red) y sus
        trazadoras se conservan. Una red ya inactiva responde 200 sin registrar nada en la bitácora.
      x-permiso: RED_EDITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Red desactivada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Red" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/RedNoEncontrada" }

  /redes/{id}/reactivar:
    post:
      tags: [Catálogos]
      summary: Reactivar una red de municipios con sus municipios
      description: |
        Una red inactiva no tiene municipios, así que se reactiva con al menos uno, con las mismas reglas del
        alta. En la misma operación se pueden cambiar el nombre y las trazadoras, como en `PATCH`.
      x-permiso: RED_EDITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [municipioIds]
              additionalProperties: false
              properties:
                municipioIds: { $ref: "#/components/schemas/IdsMunicipiosRed" }
                nombre: { $ref: "#/components/schemas/TextoNombreRed" }
                dosisIds: { $ref: "#/components/schemas/IdsDosisRed" }
      responses:
        "200":
          description: Red reactivada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Red" }
        "400": { $ref: "#/components/responses/RedEntradaInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/RedNoEncontrada" }
        "409": { $ref: "#/components/responses/RedConflicto" }
        "422": { $ref: "#/components/responses/RedInvalida" }

  /tipos-establecimiento:
    get:
      tags: [Catálogos]
      summary: Listar los tipos de establecimiento
      description: |
        Solo consulta: el catálogo de tipos viene del script 01. Ordenados por nombre. No acepta parámetros;
        cualquiera responde 400 `ENTRADA_INVALIDA`.
      x-permiso: TIPO_ESTABLECIMIENTO_CONSULTAR
      responses:
        "200":
          description: Lista de tipos de establecimiento
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, codigo, nombre]
                  properties:
                    id: { type: integer, example: 4 }
                    codigo: { type: string, example: PS }
                    nombre: { type: string, example: Puesto de Salud }
        "400":
          description: Un parámetro no permitido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: activo." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /establecimientos:
    get:
      tags: [Catálogos]
      summary: Listar establecimientos e instituciones del ámbito del usuario
      description: |
        Ordenados por nombre, activos e inactivos salvo que se filtre por `activo`. Sin paginar. El personal de
        establecimiento solo recibe el suyo; los demás roles, los de su DDRISS; la autoridad nacional, todos.
        Un parámetro inválido, desconocido o repetido responde 400 `ENTRADA_INVALIDA`.
      x-permiso: ESTABLECIMIENTO_CONSULTAR
      parameters:
        - { name: municipioId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: tipoEstablecimientoId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: activo, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Lista de establecimientos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Establecimiento" }
        "400":
          description: Un parámetro inválido, desconocido o repetido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                municipioId:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El parámetro municipioId no es válido. }
                tipoEstablecimientoId:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El parámetro tipoEstablecimientoId no es válido. }
                activo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El parámetro activo debe ser true o false. }
                desconocido:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: orden." }
                repetido:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: activo no se puede repetir. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
    post:
      tags: [Catálogos]
      summary: Registrar un establecimiento en la DDRISS del usuario
      description: |
        La DDRISS sale del token. El municipio debe existir, estar activo y no ser el `9999`.

        - Si el municipio es del departamento sede de la DDRISS, el establecimiento no es externo y el distrito es
          obligatorio: activo, de la misma DDRISS y del mismo municipio.
        - Si es de otro departamento, el establecimiento es externo (`esExterno = true`) y no lleva distrito.

        `reporta5c` o `soloCobertura` exigen `reportaProduccion`. El nombre no puede repetirse en el mismo municipio,
        sin distinguir mayúsculas ni tildes.

        El código lo genera el sistema: `{código del tipo}-{código INE del municipio}-{NN}`, donde `NN` es el mayor
        consecutivo de los códigos con ese prefijo (activos e inactivos) más uno, con al menos dos dígitos. Un código
        sin consecutivo (`CS-1201`, de los datos de prueba) cuenta como `01`; los que no siguen el formato
        (`HOSP-SM`) no cuentan. El código no se puede cambiar después.
      x-permiso: ESTABLECIMIENTO_CREAR
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstablecimientoNuevo" }
      responses:
        "201":
          description: Establecimiento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Establecimiento" }
        "400":
          description: Campo inválido, faltante o no permitido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                nombre:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El nombre del establecimiento debe tener entre 3 y 150 caracteres. }
                telefono:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El teléfono debe tener 8 dígitos y empezar con 2 a 7. }
                campo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: codigo." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "409":
          description: Ya hay un establecimiento con ese nombre en el municipio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ESTABLECIMIENTO_DUPLICADO, mensaje: Ya hay un establecimiento con ese nombre en el municipio. }
        "422":
          description: Tipo, municipio o distrito inválidos, o marcas incoherentes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                tipo:
                  value:
                    error: { codigo: TIPO_INVALIDO, mensaje: El tipo de establecimiento no existe. }
                municipio:
                  value:
                    error: { codigo: MUNICIPIO_INVALIDO, mensaje: El municipio no existe, está inactivo o no admite establecimientos. }
                distrito:
                  value:
                    error: { codigo: DISTRITO_INVALIDO, mensaje: El distrito de salud no existe, está inactivo o no es del municipio. }
                distritoExterno:
                  value:
                    error: { codigo: DISTRITO_INVALIDO, mensaje: Un establecimiento externo no lleva distrito de salud. }
                marcas:
                  value:
                    error: { codigo: MARCAS_INVALIDAS, mensaje: Un establecimiento que envía el 5C o solo cuenta para cobertura debe reportar producción. }

  /establecimientos/{id}:
    get:
      tags: [Catálogos]
      summary: Consultar un establecimiento del ámbito del usuario
      x-permiso: ESTABLECIMIENTO_CONSULTAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: El establecimiento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Establecimiento" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/EstablecimientoNoEncontrado" }
    patch:
      tags: [Catálogos]
      summary: Editar el nombre, la dirección, el contacto o las marcas de un establecimiento
      description: |
        Cambio parcial, también de un establecimiento inactivo. El código, el tipo, el municipio y el distrito no se
        pueden cambiar; para eso se desactiva el establecimiento y se registra otro. Solo se validan los campos que
        cambian. Las reglas de marcas se revisan sobre el estado final. Si nada cambia, responde 200 sin registrar
        nada en la bitácora. Para desactivar o reactivar se usan `/desactivar` y `/reactivar`.
      x-permiso: ESTABLECIMIENTO_EDITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstablecimientoCambios" }
      responses:
        "200":
          description: Establecimiento actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Establecimiento" }
        "400":
          description: Campo inválido, que no se puede cambiar o no permitido, o cuerpo vacío
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                nombre:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El nombre del establecimiento debe tener entre 3 y 150 caracteres. }
                municipio:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: municipioId no se puede cambiar. }
                codigo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: codigo no se puede cambiar. }
                campo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: activo." }
                vacio:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: Indique al menos un dato del establecimiento. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/EstablecimientoNoEncontrado" }
        "409":
          description: Ya hay otro establecimiento con ese nombre en el municipio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ESTABLECIMIENTO_DUPLICADO, mensaje: Ya hay un establecimiento con ese nombre en el municipio. }
        "422":
          description: Marcas incoherentes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: MARCAS_INVALIDAS, mensaje: Un establecimiento que envía el 5C o solo cuenta para cobertura debe reportar producción. }

  /establecimientos/{id}/desactivar:
    post:
      tags: [Catálogos]
      summary: Desactivar un establecimiento
      description: |
        Desactivación lógica: el establecimiento no se borra. No se puede desactivar mientras tenga cuentas activas
        de su personal. Uno ya inactivo responde 200 sin registrar nada en la bitácora.
      x-permiso: ESTABLECIMIENTO_EDITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Establecimiento desactivado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Establecimiento" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/EstablecimientoNoEncontrado" }
        "409":
          description: El establecimiento tiene cuentas activas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ESTABLECIMIENTO_CON_CUENTAS, mensaje: El establecimiento tiene 2 cuentas activas; muévalas o desactívelas en Usuarios primero. }

  /establecimientos/{id}/reactivar:
    post:
      tags: [Catálogos]
      summary: Reactivar un establecimiento
      description: |
        Exige que el municipio siga activo y, si no es externo, también su distrito. Uno ya activo responde 200
        sin registrar nada en la bitácora.
      x-permiso: ESTABLECIMIENTO_EDITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Establecimiento reactivado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Establecimiento" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/EstablecimientoNoEncontrado" }
        "422":
          description: El municipio o el distrito están inactivos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                municipio:
                  value:
                    error: { codigo: MUNICIPIO_INVALIDO, mensaje: El municipio no existe, está inactivo o no admite establecimientos. }
                distrito:
                  value:
                    error: { codigo: DISTRITO_INVALIDO, mensaje: El distrito de salud no existe, está inactivo o no es del municipio. }

  /vacunas:
    get:
      tags: [Catálogos]
      summary: Listar las vacunas del catálogo nacional con sus dosis
      description: |
        El catálogo de vacunas es nacional: no se filtra por DDRISS. Activas e inactivas salvo que se filtre por
        `activa`; cada vacuna trae todas sus dosis (también las inactivas), ordenadas por `orden`. Las vacunas se
        ordenan por `ordenInforme` y nombre. Sin paginar. Un parámetro inválido, desconocido o repetido responde
        400 `ENTRADA_INVALIDA`.
      x-permiso: VACUNA_CONSULTAR
      parameters:
        - name: activa
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Lista de vacunas con sus dosis
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Vacuna" }
        "400":
          description: Un parámetro inválido, desconocido o repetido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                activa:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: activa debe ser true o false. }
                desconocido:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: orden." }
                repetido:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: activa no se puede repetir. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
    post:
      tags: [Catálogos]
      summary: Registrar una vacuna con sus dosis
      description: |
        El catálogo es nacional: la vacuna queda para todas las DDRISS. El código de la vacuna lo escribe el
        usuario y no cambia después. El código y el `orden` de cada dosis los genera el sistema según su `tipo`
        y su lugar en la lista (`UNICA`, `D1`, `D2`…, `R1`, `R2`…), y también calcula `completaEsquema`.

        Reglas de la secuencia (422 `SECUENCIA_INVALIDA`): como máximo una dosis `UNICA`, que no se combina con
        dosis `DOSIS` pero sí con refuerzos; los refuerzos van después de las dosis `UNICA` o `DOSIS`.

        El código y el nombre de la vacuna no pueden repetirse (el nombre, sin distinguir mayúsculas ni tildes), ni
        el nombre de una dosis dentro de la lista. Sin `ordenInforme`, la vacuna va al final del informe.

        La vacuna, sus dosis y el cálculo de `completaEsquema` van en una sola transacción, con una sola fila en
        la bitácora. La vacuna queda sin esquema de captura: se crea aparte (HU-16).
      x-permiso: VACUNA_CREAR
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VacunaNueva" }
      responses:
        "201":
          description: Vacuna registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vacuna" }
        "400":
          description: Campo inválido, faltante o no permitido, tipo inválido o vacuna sin dosis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                codigo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El código de la vacuna debe empezar con una letra y solo puede tener letras sin tildes, números y guion bajo. }
                nombre:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El nombre de la vacuna debe tener entre 3 y 120 caracteres. }
                ordenInforme:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: ordenInforme debe ser un número entero entre 0 y 65535. }
                sinDosis:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: Indique al menos una dosis. }
                tipo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El tipo de la dosis debe ser UNICA, DOSIS o REFUERZO. }
                nombreDosis:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El nombre de la dosis debe tener entre 3 y 60 caracteres. }
                campo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: activa." }
                campoDosis:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: completaEsquema." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "409":
          description: Código o nombre de vacuna repetido, o dos dosis con el mismo nombre
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                codigo:
                  value:
                    error: { codigo: VACUNA_DUPLICADA, mensaje: Ya hay una vacuna con ese código. }
                nombre:
                  value:
                    error: { codigo: VACUNA_DUPLICADA, mensaje: Ya hay una vacuna con ese nombre. }
                dosis:
                  value:
                    error: { codigo: DOSIS_DUPLICADA, mensaje: La vacuna ya tiene una dosis con ese nombre. }
        "422": { $ref: "#/components/responses/SecuenciaInvalida" }

  /vacunas/{id}:
    get:
      tags: [Catálogos]
      summary: Consultar una vacuna con sus dosis
      x-permiso: VACUNA_CONSULTAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: La vacuna, con todas sus dosis ordenadas por `orden`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vacuna" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/VacunaNoEncontrada" }
    patch:
      tags: [Catálogos]
      summary: Editar el nombre, la descripción o el orden en el informe de una vacuna
      description: |
        Cambio parcial, también de una vacuna inactiva. El código no se puede cambiar. Las dosis se cambian con
        sus propias rutas, y para desactivar o reactivar se usan `/desactivar` y `/reactivar`. Solo se validan
        los campos que cambian. Si nada cambia, responde 200 sin registrar nada en la bitácora.
      x-permiso: VACUNA_EDITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VacunaCambios" }
      responses:
        "200":
          description: Vacuna actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vacuna" }
        "400":
          description: Campo inválido, que no se puede cambiar o no permitido, o cuerpo vacío
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                nombre:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El nombre de la vacuna debe tener entre 3 y 120 caracteres. }
                codigo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: codigo no se puede cambiar. }
                campo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: dosis." }
                vacio:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: Indique al menos un dato de la vacuna. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/VacunaNoEncontrada" }
        "409":
          description: Ya hay otra vacuna con ese nombre
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: VACUNA_DUPLICADA, mensaje: Ya hay una vacuna con ese nombre. }

  /vacunas/{id}/desactivar:
    post:
      tags: [Catálogos]
      summary: Desactivar una vacuna
      description: |
        Desactivación lógica: la vacuna y sus dosis no se borran y los reportes anteriores la conservan. Solo
        cambia `activa` de la vacuna; sus dosis quedan como están. Una vacuna ya inactiva responde 200 sin
        registrar nada en la bitácora.
      x-permiso: VACUNA_EDITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Vacuna desactivada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vacuna" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/VacunaNoEncontrada" }

  /vacunas/{id}/reactivar:
    post:
      tags: [Catálogos]
      summary: Reactivar una vacuna
      description: |
        La vacuna vuelve con las mismas dosis activas e inactivas que tenía. Una vacuna ya activa responde 200
        sin registrar nada en la bitácora.
      x-permiso: VACUNA_EDITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Vacuna reactivada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vacuna" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/VacunaNoEncontrada" }

  /vacunas/{id}/dosis:
    post:
      tags: [Catálogos]
      summary: Agregar una dosis a una vacuna
      description: |
        También en una vacuna inactiva. La dosis va al final: su código es el siguiente de su tipo (`D{n}`,
        `R{n}`, contando las activas y las inactivas, sin reutilizar) y su `orden` es el mayor de la vacuna más
        uno. Después se recalcula `completaEsquema` de todas las dosis de la vacuna.

        Una `UNICA` en una vacuna que ya tiene una `UNICA` o dosis `DOSIS`, o una `DOSIS` en una que tiene
        `UNICA`, responde 422 `SECUENCIA_INVALIDA`.

        Bitácora: una fila `CREAR` de la dosis y una `ACTUALIZAR` por cada otra dosis cuyo `completaEsquema`
        cambió.
      x-permiso: VACUNA_EDITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DosisNueva" }
      responses:
        "201":
          description: Dosis agregada; devuelve la vacuna completa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vacuna" }
        "400":
          description: Campo inválido, faltante o no permitido, o tipo inválido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                tipo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El tipo de la dosis debe ser UNICA, DOSIS o REFUERZO. }
                nombre:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El nombre de la dosis debe tener entre 3 y 60 caracteres. }
                campo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: orden." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/VacunaNoEncontrada" }
        "409": { $ref: "#/components/responses/DosisDuplicada" }
        "422": { $ref: "#/components/responses/SecuenciaInvalida" }

  /vacunas/{id}/dosis/{dosisId}:
    patch:
      tags: [Catálogos]
      summary: Editar el nombre o la marca de trazadora de una dosis
      description: |
        Cambio parcial, también de una dosis o una vacuna inactivas. El código, el tipo, el orden y
        `completaEsquema` no se pueden cambiar. Si nada cambia, responde 200 sin registrar nada en la bitácora.
      x-permiso: VACUNA_EDITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/DosisId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DosisCambios" }
      responses:
        "200":
          description: Dosis actualizada; devuelve la vacuna completa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vacuna" }
        "400":
          description: Campo inválido, que no se puede cambiar o no permitido, o cuerpo vacío
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                nombre:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El nombre de la dosis debe tener entre 3 y 60 caracteres. }
                esTrazadora:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: esTrazadora debe ser true o false. }
                completaEsquema:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: completaEsquema no se puede cambiar. }
                campo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: activa." }
                vacio:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: Indique al menos un dato de la dosis. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/VacunaODosisNoEncontrada" }
        "409": { $ref: "#/components/responses/DosisDuplicada" }

  /vacunas/{id}/dosis/{dosisId}/desactivar:
    post:
      tags: [Catálogos]
      summary: Desactivar una dosis
      description: |
        Desactivación lógica: la dosis no se borra y su código no se reutiliza. La vacuna debe conservar al
        menos una dosis activa, aunque esté inactiva. Después se recalcula `completaEsquema`. Una dosis ya
        inactiva responde 200 sin registrar nada en la bitácora.

        Bitácora: una fila `DESACTIVAR` de la dosis y una `ACTUALIZAR` por cada otra dosis cuyo
        `completaEsquema` cambió.
      x-permiso: VACUNA_EDITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/DosisId" }
      responses:
        "200":
          description: Dosis desactivada; devuelve la vacuna completa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vacuna" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/VacunaODosisNoEncontrada" }
        "409":
          description: Es la última dosis activa de la vacuna
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: VACUNA_SIN_DOSIS_ACTIVAS, mensaje: La vacuna debe conservar al menos una dosis activa; desactive la vacuna si ya no se aplica. }

  /vacunas/{id}/dosis/{dosisId}/reactivar:
    post:
      tags: [Catálogos]
      summary: Reactivar una dosis
      description: |
        Después se recalcula `completaEsquema`. Una dosis ya activa responde 200 sin registrar nada en la
        bitácora.

        Bitácora: una fila `REACTIVAR` de la dosis y una `ACTUALIZAR` por cada otra dosis cuyo
        `completaEsquema` cambió.
      x-permiso: VACUNA_EDITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/DosisId" }
      responses:
        "200":
          description: Dosis reactivada; devuelve la vacuna completa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vacuna" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/VacunaODosisNoEncontrada" }

  /periodos:
    get:
      tags: [Catálogos]
      summary: Listar los meses del calendario con su estado en la DDRISS del usuario
      description: |
        El calendario (`periodo`) es común para todo el país. `estado`, `fechaLimiteEnvio` y `cerradoEn` salen de
        la fila de `cierre_periodo` de la DDRISS del usuario; si el mes no está abierto en esa DDRISS, los tres
        valen `null`. Ordenados por año y mes, sin paginar. Un parámetro inválido, desconocido o repetido responde
        400 `ENTRADA_INVALIDA`.
      x-permiso: PERIODO_CONSULTAR
      parameters:
        - name: anio
          in: query
          schema: { type: integer, example: 2026 }
        - name: estado
          in: query
          description: Solo los meses con ese estado en la DDRISS del usuario
          schema: { $ref: "#/components/schemas/EstadoPeriodo" }
      responses:
        "200":
          description: Meses del calendario
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Periodo" }
        "400":
          description: Un parámetro inválido, desconocido o repetido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                anio:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: anio debe ser un número entero. }
                estado:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "estado debe ser ABIERTO, EN_CIERRE o CERRADO." }
                desconocido:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: mes." }
                repetido:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: anio no se puede repetir. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
    post:
      tags: [Catálogos]
      summary: Agregar al calendario los meses que falten de un año
      description: |
        Crea en el calendario común los meses del año que todavía no están, con `fechaInicio` el día 1 y
        `fechaFin` el último día del mes. **No abre ninguno**: cada mes se abre aparte para la DDRISS con
        `POST /periodos/{id}/abrir`. El año debe estar entre 2020 y el siguiente al actual (fecha de Guatemala).
        Si ya están los 12 meses, responde 409. Deja una fila `CREAR` en la bitácora por cada mes creado.
      x-permiso: PERIODO_CREAR
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PeriodoAnioNuevo" }
      responses:
        "201":
          description: Los 12 meses del año
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Periodo" }
        "400":
          description: anio no es entero, o hay un campo no permitido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                anio:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: anio debe ser un número entero. }
                campo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: mes." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "409":
          description: El año ya tiene sus 12 meses en el calendario
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: PERIODO_ANIO_EXISTENTE, mensaje: El año 2026 ya tiene sus 12 meses en el calendario. }
        "422":
          description: El año está fuera del rango permitido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ANIO_FUERA_DE_RANGO, mensaje: El año debe estar entre 2020 y 2027. }

  /periodos/{id}:
    patch:
      tags: [Catálogos]
      summary: Cambiar la fecha límite de envío de un mes en la DDRISS del usuario
      description: |
        Solo en un mes `ABIERTO` o `EN_CIERRE` en la DDRISS del usuario. En `ABIERTO`, el mes sigue `ABIERTO`
        aunque la fecha nueva ya haya pasado. En `EN_CIERRE`, una fecha de hoy o posterior (fecha de Guatemala)
        devuelve el mes a `ABIERTO` en la misma transacción; una fecha anterior solo cambia la fecha. La misma
        fecha responde 200 sin registrar nada en la bitácora.
      x-permiso: PERIODO_EDITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FechaLimite" }
      responses:
        "200":
          description: Mes con la fecha límite nueva
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Periodo" }
        "400": { $ref: "#/components/responses/FechaLimiteInvalidaFormato" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/PeriodoNoEncontrado" }
        "409":
          description: El mes no está abierto en la DDRISS, o ya está cerrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                noAbierto:
                  value:
                    error: { codigo: PERIODO_NO_ABIERTO, mensaje: El mes no está abierto en su DDRISS. }
                cerrado:
                  value:
                    error: { codigo: PERIODO_CERRADO, mensaje: El mes está cerrado; solo admite rectificaciones. }
        "422": { $ref: "#/components/responses/FechaLimiteInvalida" }

  /periodos/{id}/abrir:
    post:
      tags: [Catálogos]
      summary: Abrir un mes para la DDRISS del usuario
      description: |
        Crea la fila de `cierre_periodo` de la DDRISS del usuario, y solo la de esa DDRISS, con estado `ABIERTO`.
        Se puede abrir cualquier mes del calendario, sin orden y aunque todavía no haya empezado. La fecha límite
        debe ser posterior al fin del mes. Un mes que ya tiene fila en la DDRISS, en cualquier estado, responde
        409. Deja una fila `CREAR` en la bitácora.
      x-permiso: PERIODO_EDITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FechaLimite" }
      responses:
        "201":
          description: Mes abierto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Periodo" }
        "400": { $ref: "#/components/responses/FechaLimiteInvalidaFormato" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/PeriodoNoEncontrado" }
        "409":
          description: El mes ya tiene fila en la DDRISS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: PERIODO_YA_ABIERTO, mensaje: El mes ya fue abierto en su DDRISS. }
        "422": { $ref: "#/components/responses/FechaLimiteInvalida" }

  /poblaciones-objetivo:
    get:
      tags: [Catálogos]
      summary: Consultar la población de un año por municipio y grupo de edad
      description: |
        Devuelve los 7 grupos de `clasificacion_poblacion` (ordenados por id) y los municipios activos del
        departamento sede de la DDRISS del usuario, sin el `9999`, ordenados por nombre y aunque no tengan
        población. Un grupo sin registrar no aparece en `poblacion`. El año debe tener al menos un mes en el
        calendario de periodos. `anio` es obligatorio; un parámetro inválido, desconocido o repetido responde
        400 `ENTRADA_INVALIDA`.
      x-permiso: POBLACION_CONSULTAR
      parameters:
        - name: anio
          in: query
          required: true
          schema: { type: integer, example: 2026 }
      responses:
        "200":
          description: Población del año
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PoblacionAnio" }
        "400":
          description: anio ausente o no entero, o un parámetro desconocido o repetido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                anio:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: anio debe ser un número entero. }
                desconocido:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: municipioId." }
                repetido:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: anio no se puede repetir. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "422": { $ref: "#/components/responses/AnioSinPeriodos" }

  /poblaciones-objetivo/{municipioId}/{anio}:
    put:
      tags: [Catálogos]
      summary: Registrar o corregir la población de un municipio y un año
      description: |
        Crea o corrige, en una sola transacción, los grupos que vienen en `grupos`. Los que no vienen no cambian
        y nunca se borra una fila, así que hay una sola por municipio, año y grupo. `fuente` se aplica a los
        grupos del cuerpo; si no viene, una fila nueva queda sin fuente y una existente conserva la suya.

        Se valida en este orden: `municipioId` o `anio` no enteros (400); municipio inexistente, inactivo o fuera
        del departamento sede de la DDRISS (404); año sin meses en el calendario (422); grupo inexistente (400).

        Bitácora (`entidad = poblacion_objetivo`): una fila `CREAR` por grupo creado y una `ACTUALIZAR` por grupo
        cuya cantidad o fuente cambió. Un guardado sin cambios responde 200 sin registrar nada.
      x-permiso: POBLACION_REGISTRAR
      parameters:
        - name: municipioId
          in: path
          required: true
          schema: { type: integer, example: 1 }
        - name: anio
          in: path
          required: true
          schema: { type: integer, example: 2026 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PoblacionGuardar" }
      responses:
        "200":
          description: El municipio con su población del año
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PoblacionMunicipio" }
        "400":
          description: Ruta, campo, cantidad, fuente o grupo inválidos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                ruta:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: anio debe ser un número entero. }
                campo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: anio." }
                sinGrupos:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: Debe registrar al menos un grupo. }
                cantidad:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "La cantidad debe ser un número entero entre 0 y 9,999,999." }
                fuente:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: La fuente admite hasta 150 caracteres. }
                grupo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El grupo MENOR_5 no existe. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: Otro guardado del mismo grupo ocurrió al mismo tiempo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: POBLACION_EN_CONFLICTO, mensaje: Otra persona guardó esta población al mismo tiempo. Vuelva a intentarlo. }
        "422": { $ref: "#/components/responses/AnioSinPeriodos" }

  # ---------------------------------------------------------------- Configuración (MongoDB)
  /dimensiones:
    get:
      tags: [Configuración]
      summary: Listar las dimensiones de desagregación con sus valores
      description: |
        El catálogo de dimensiones (`catalogo_dimensiones` en MongoDB) es nacional: no se filtra por DDRISS.
        Activas e inactivas salvo que se filtre por `activa`; cada dimensión trae todos sus valores (también los
        inactivos), ordenados por `orden`. Las dimensiones se ordenan por `nombre`. Sin paginar. Un parámetro
        inválido, desconocido o repetido responde 400 `ENTRADA_INVALIDA`.
      x-permiso: DIMENSION_CONSULTAR
      parameters:
        - name: activa
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Lista de dimensiones con sus valores
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Dimension" }
        "400":
          description: Un parámetro inválido, desconocido o repetido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                activa:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: activa debe ser true o false. }
                desconocido:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: tipo." }
                repetido:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: activa no se puede repetir. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
    post:
      tags: [Configuración]
      summary: Registrar una dimensión categórica con sus valores
      description: |
        El catálogo es nacional: la dimensión queda para todas las DDRISS. Las dimensiones nuevas son siempre
        `CATEGORICA`; `grupo_edad` es la única `RANGO_EDAD` y a ella solo se le agregan valores. Los códigos los
        escribe el usuario y no cambian después. Cada valor queda activo, con `orden` según su posición en la
        lista (1, 2, 3…).

        Bitácora: una fila `CREAR` (entidad `catalogo_dimensiones`, `entidadId` el ObjectId) con el documento
        completo.
      x-permiso: DIMENSION_CREAR
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DimensionCrear" }
      responses:
        "201":
          description: Dimensión registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dimension" }
        "400":
          description: Campo inválido, faltante o no permitido, dimensión sin valores o valor repetido en la lista
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                codigo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El código debe empezar con una letra minúscula y usar solo minúsculas, números y guion bajo (hasta 30). }
                nombre:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El nombre debe tener entre 2 y 60 caracteres. }
                sinValores:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: Indique al menos un valor. }
                codigoValor:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El código del valor usa solo mayúsculas, números y guion bajo (hasta 30). }
                etiqueta:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: La etiqueta debe tener entre 1 y 60 caracteres. }
                valorRepetido:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El valor IM está repetido. }
                campo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: tipo." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "409":
          description: Ya hay una dimensión con ese código
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: DIMENSION_DUPLICADA, mensaje: Ya existe una dimensión con el código via. }

  /dimensiones/{codigo}:
    get:
      tags: [Configuración]
      summary: Consultar una dimensión con sus valores
      description: |
        En una dimensión `RANGO_EDAD` agrega `gruposPoblacionDisponibles`: los grupos de
        `clasificacion_poblacion` que la dimensión todavía no tiene, ordenados por `id`.
      x-permiso: DIMENSION_CONSULTAR
      parameters:
        - { $ref: "#/components/parameters/CodigoDimension" }
      responses:
        "200":
          description: La dimensión, con todos sus valores ordenados por `orden`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dimension" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
    patch:
      tags: [Configuración]
      summary: Editar el nombre o la descripción de una dimensión
      description: |
        Cambio parcial, también de una dimensión inactiva. El código y el tipo no se pueden cambiar; los valores
        se cambian con sus propias rutas. Si nada cambia, responde 200 sin escribir ni registrar nada en la
        bitácora. Si cambia, registra `ACTUALIZAR` con los campos que cambiaron.
      x-permiso: DIMENSION_EDITAR
      parameters:
        - { $ref: "#/components/parameters/CodigoDimension" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DimensionEditar" }
      responses:
        "200":
          description: Dimensión actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dimension" }
        "400":
          description: Campo inválido, que no se puede cambiar o no permitido, o cuerpo vacío
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                nombre:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El nombre debe tener entre 2 y 60 caracteres. }
                descripcion:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: La descripción admite hasta 255 caracteres. }
                codigo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: codigo." }
                vacio:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: Indique al menos un dato de la dimensión. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /dimensiones/{codigo}/desactivar:
    post:
      tags: [Configuración]
      summary: Desactivar una dimensión
      description: |
        Desactivación lógica: la dimensión no se borra y los códigos guardados en `detalle_dimension` siguen
        siendo válidos. Sus valores quedan como están. No se desactiva si la usa un esquema de captura `VIGENTE`
        o `BORRADOR` de cualquier territorio (en su desagregación general o por dosis). Bitácora: `DESACTIVAR`.
      x-permiso: DIMENSION_EDITAR
      parameters:
        - { $ref: "#/components/parameters/CodigoDimension" }
      responses:
        "200":
          description: Dimensión desactivada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dimension" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: La usa un esquema vigente o en borrador, o ya está inactiva
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                enUso:
                  value:
                    error: { codigo: DIMENSION_EN_USO, mensaje: La dimensión sexo la usa un esquema de captura vigente o en borrador. }
                yaInactiva:
                  value:
                    error: { codigo: DIMENSION_YA_INACTIVA, mensaje: La dimensión ya está inactiva. }

  /dimensiones/{codigo}/reactivar:
    post:
      tags: [Configuración]
      summary: Reactivar una dimensión
      description: La dimensión vuelve con los mismos valores activos e inactivos que tenía. Bitácora `REACTIVAR`.
      x-permiso: DIMENSION_EDITAR
      parameters:
        - { $ref: "#/components/parameters/CodigoDimension" }
      responses:
        "200":
          description: Dimensión reactivada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dimension" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: Ya está activa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: DIMENSION_YA_ACTIVA, mensaje: La dimensión ya está activa. }

  /dimensiones/{codigo}/valores:
    post:
      tags: [Configuración]
      summary: Agregar un valor a una dimensión
      description: |
        También en una dimensión inactiva. El valor queda activo, al final: su `orden` es el mayor de la
        dimensión más uno. Un código que la dimensión ya tiene, activo o inactivo, responde 409.

        En una dimensión `CATEGORICA` solo van `codigo` y `etiqueta`; `edadMinMeses` o `edadMaxMeses` responden
        400. En una `RANGO_EDAD` (`grupo_edad`), `edadMinMeses` y `edadMaxMeses` son obligatorios, el mínimo debe
        ser menor que el máximo, y el código debe existir en `clasificacion_poblacion`.

        Bitácora: `ACTUALIZAR` con `valoresAnteriores` null y `valoresNuevos` `{ valor: {…} }`.
      x-permiso: DIMENSION_EDITAR
      parameters:
        - { $ref: "#/components/parameters/CodigoDimension" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValorDimensionCrear" }
      responses:
        "201":
          description: Valor agregado; devuelve la dimensión completa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dimension" }
        "400":
          description: Campo inválido, faltante o no permitido, rango inválido o grupo fuera de la clasificación de población
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                codigo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El código del valor usa solo mayúsculas, números y guion bajo (hasta 30). }
                etiqueta:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: La etiqueta debe tener entre 1 y 60 caracteres. }
                edad:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "La edad debe ser un número entero de meses entre 0 y 1,200." }
                rango:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: La edad mínima debe ser menor que la máxima. }
                grupo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El grupo 2_A_3 no existe en la clasificación de población. }
                edadEnCategorica:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: edadMinMeses." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: La dimensión ya tiene un valor con ese código
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: VALOR_DUPLICADO, mensaje: La dimensión ya tiene el valor SC. }

  /dimensiones/{codigo}/valores/orden:
    put:
      tags: [Configuración]
      summary: Cambiar el orden de los valores de una dimensión
      description: |
        La lista trae todos los valores de la dimensión (activos e inactivos), cada uno una vez, en el orden
        nuevo; se les asigna `orden` 1…n. Si el orden no cambia, responde 200 sin registrar nada. Si cambia,
        registra `ACTUALIZAR` con `{ orden: [códigos] }` antes y después.
      x-permiso: DIMENSION_EDITAR
      parameters:
        - { $ref: "#/components/parameters/CodigoDimension" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrdenValores" }
      responses:
        "200":
          description: Orden actualizado; devuelve la dimensión completa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dimension" }
        "400":
          description: La lista no trae cada valor una sola vez, o hay un campo no permitido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                lista:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: La lista debe traer cada valor de la dimensión una sola vez. }
                campo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: valores." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /dimensiones/{codigo}/valores/{valor}:
    patch:
      tags: [Configuración]
      summary: Editar la etiqueta de un valor
      description: |
        También de un valor o una dimensión inactivos. El código, el orden y el rango de edad no se cambian por
        aquí. Si la etiqueta no cambia, responde 200 sin registrar nada. Si cambia, registra `ACTUALIZAR` con la
        etiqueta antes y después.
      x-permiso: DIMENSION_EDITAR
      parameters:
        - { $ref: "#/components/parameters/CodigoDimension" }
        - { $ref: "#/components/parameters/CodigoValor" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValorDimensionEditar" }
      responses:
        "200":
          description: Valor actualizado; devuelve la dimensión completa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dimension" }
        "400":
          description: Etiqueta inválida o faltante, o campo no permitido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                etiqueta:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: La etiqueta debe tener entre 1 y 60 caracteres. }
                campo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: edadMinMeses." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /dimensiones/{codigo}/valores/{valor}/desactivar:
    post:
      tags: [Configuración]
      summary: Desactivar un valor de una dimensión
      description: |
        Desactivación lógica: el valor no se borra y su código no se reutiliza. No se desactiva si lo usa un
        esquema de captura `VIGENTE` o `BORRADOR` de cualquier territorio (desagregación general, por dosis o
        `secciones[].grupo_edad`), ni si es el último valor activo de la dimensión. Bitácora: `DESACTIVAR` con
        `{ valor: código }`.
      x-permiso: DIMENSION_EDITAR
      parameters:
        - { $ref: "#/components/parameters/CodigoDimension" }
        - { $ref: "#/components/parameters/CodigoValor" }
      responses:
        "200":
          description: Valor desactivado; devuelve la dimensión completa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dimension" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: Lo usa un esquema vigente o en borrador, es el último valor activo o ya está inactivo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                enUso:
                  value:
                    error: { codigo: VALOR_EN_USO, mensaje: El valor MENOR_1 lo usa un esquema de captura vigente o en borrador. }
                ultimo:
                  value:
                    error: { codigo: ULTIMO_VALOR_ACTIVO, mensaje: La dimensión debe conservar al menos un valor activo. }
                yaInactivo:
                  value:
                    error: { codigo: VALOR_YA_INACTIVO, mensaje: El valor ya está inactivo. }

  /dimensiones/{codigo}/valores/{valor}/reactivar:
    post:
      tags: [Configuración]
      summary: Reactivar un valor de una dimensión
      description: 'Bitácora: `REACTIVAR` con `{ valor: código }`.'
      x-permiso: DIMENSION_EDITAR
      parameters:
        - { $ref: "#/components/parameters/CodigoDimension" }
        - { $ref: "#/components/parameters/CodigoValor" }
      responses:
        "200":
          description: Valor reactivado; devuelve la dimensión completa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dimension" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: Ya está activo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: VALOR_YA_ACTIVO, mensaje: El valor ya está activo. }

  /esquemas-captura:
    get:
      tags: [Configuración]
      summary: Listar las vacunas con su esquema vigente que aplica y el borrador de la DDRISS
      description: |
        Una fila por vacuna activa, más las inactivas que tengan un borrador de la DDRISS del usuario,
        ordenadas por `nombre`. `vigente` es el esquema `VIGENTE` de la DDRISS del usuario o, si no hay, el
        `VIGENTE` nacional (el que se usaría para capturar). `borrador` es el `BORRADOR` de la DDRISS del
        usuario. `vigente.vigenciaDesde` puede ser futura: una versión publicada para un mes posterior es la
        `VIGENTE` desde que se publica. Los esquemas de otras DDRISS no aparecen, ni los `HISTORICO`. Sin paginar. Un parámetro
        responde 400 `ENTRADA_INVALIDA`.
      x-permiso: ESQUEMA_CONSULTAR
      responses:
        "200":
          description: Una fila por vacuna
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EsquemaPorVacuna" }
        "400":
          description: Un parámetro no permitido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: estado." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
    post:
      tags: [Configuración]
      summary: Crear el borrador del esquema de captura de una vacuna para la DDRISS del usuario
      description: |
        Crea un esquema `BORRADOR` con el territorio de la DDRISS del usuario. Puede empezar vacío o como copia
        del vigente que aplica (`copiaDe`, el `id` de `vigente` en `GET /esquemas-captura`).

        El backend calcula:
        - `version`: la mayor versión de la vacuna en todo el país (todos los territorios y estados) + 1;
        - `versionAnteriorId`: el `VIGENTE` de la vacuna en la DDRISS, o null;
        - `basadoEn`: en una copia del nacional, ese esquema y su versión; en una copia del vigente de la
          DDRISS, el mismo `basadoEn` de ese vigente; vacío, null;
        - `reglas` y `camposAdicionales`: los de la base en una copia; en uno vacío, `CAMPOS_COMPLETOS`,
          `DIMENSIONES_VALIDAS` y `NO_NEGATIVO` en su versión vigente nacional, y sin campos adicionales;
        - `presentacion`: `filas: dosis` y `columnas` = `seccion` si hay más de una sección, más las dimensiones
          de la desagregación general sin `grupo_edad` (una copia conserva las demás claves de la base);
        - la etiqueta de cada dosis (`dosis.nombre` de MySQL), el código de cada sección (su `grupoEdad`, o
          `GENERAL`) y su `orden` (su posición en la lista);
        - una vigencia provisional que la API no devuelve (`vigencia: null`); la fija la publicación.

        Las dosis se guardan en el orden de MySQL y los valores en el orden del catálogo. Las reglas de
        coherencia responden 422 `ESQUEMA_INVALIDO` con el primer problema que se encuentra.

        Bitácora: una fila `CREAR` (módulo `CONFIGURACION`, entidad `esquemas_captura`, `entidadId` el
        ObjectId) con el documento completo.
      x-permiso: ESQUEMA_CREAR
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EsquemaCrear" }
      responses:
        "201":
          description: Borrador creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EsquemaCaptura" }
        "400": { $ref: "#/components/responses/EsquemaEntradaInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/VacunaNoEncontrada" }
        "409":
          description: La DDRISS ya tiene un borrador de la vacuna, o `copiaDe` ya no es el vigente que aplica
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                borradorExistente:
                  value:
                    error: { codigo: BORRADOR_EXISTENTE, mensaje: Ya existe un borrador del esquema de Hexavalente para su DDRISS. }
                altaSimultanea:
                  value:
                    error: { codigo: BORRADOR_EXISTENTE, mensaje: Se creó otra versión de Hexavalente al mismo tiempo; intente de nuevo. }
                baseDesactualizada:
                  value:
                    error: { codigo: BASE_DESACTUALIZADA, mensaje: El esquema vigente de Hexavalente cambió; vuelva a abrir la copia. }
        "422": { $ref: "#/components/responses/EsquemaInvalido" }

  /esquemas-captura/{id}:
    get:
      tags: [Configuración]
      summary: Consultar un esquema de captura completo
      description: |
        Un esquema `NACIONAL` o de la DDRISS del usuario, en cualquier estado. Uno de otra DDRISS, inexistente
        o con un `id` que no es un ObjectId responde 404. En un `BORRADOR`, `vigencia`, `publicadoPor`, `publicadoEn` y
        `motivoCambio` son null (un borrador puede traer un `motivoCambio` guardado, como el de la semilla). Una
        versión `HISTORICO` se sigue consultando completa.
      x-permiso: ESQUEMA_CONSULTAR
      parameters:
        - { $ref: "#/components/parameters/IdEsquema" }
      responses:
        "200":
          description: El esquema
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EsquemaCaptura" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
    put:
      tags: [Configuración]
      summary: Reemplazar el contenido de un borrador de la DDRISS
      description: |
        Solo un `BORRADOR` de la DDRISS del usuario. Reemplaza la procedencia, las dosis, la desagregación y
        las secciones, con las mismas reglas y cálculos que `POST`. `basadoEn`, `reglas`, `camposAdicionales`,
        la vigencia provisional y `auditoria` no cambian. Si nada cambia, responde 200 sin escribir ni
        registrar nada. Si cambia, registra `ACTUALIZAR` con los campos que cambiaron.

        La escritura lleva la condición `estado: BORRADOR`: si el borrador se publicó mientras se editaba,
        responde 409 `ESQUEMA_NO_EDITABLE`.
      x-permiso: ESQUEMA_EDITAR
      parameters:
        - { $ref: "#/components/parameters/IdEsquema" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EsquemaEditar" }
      responses:
        "200":
          description: Borrador actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EsquemaCaptura" }
        "400": { $ref: "#/components/responses/EsquemaEntradaInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/EsquemaNoEditable" }
        "422": { $ref: "#/components/responses/EsquemaInvalido" }
    delete:
      tags: [Configuración]
      summary: Descartar un borrador de la DDRISS
      description: |
        Solo un `BORRADOR` de la DDRISS del usuario. Borra el documento: un borrador nunca se publicó, así que
        la regla de versiones inmutables no aplica. La escritura lleva la condición `estado: BORRADOR`.

        Bitácora: una fila `ELIMINAR` con el documento completo en `valoresAnteriores`.
      x-permiso: ESQUEMA_EDITAR
      parameters:
        - { $ref: "#/components/parameters/IdEsquema" }
      responses:
        "204": { description: Borrador descartado }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/EsquemaNoEditable" }

  /esquemas-captura/historial:
    get:
      tags: [Configuración]
      summary: Historial de versiones del esquema de captura de una vacuna
      description: |
        Las versiones `NACIONAL` y las de la DDRISS del usuario, en los tres estados, ordenadas por `version` de
        mayor a menor. Las de otras DDRISS no aparecen. `reportes` es la cantidad de filas de `reporte_vacuna`
        que usan cada versión, de reportes de establecimientos de la DDRISS del usuario, en cualquier estado.
        No trae el contenido de cada versión: ese está en `GET /esquemas-captura/{id}`. Sin paginar.

        `vacunaId` es obligatorio; si falta, es inválido o está repetido, o hay otro parámetro, responde 400.
        Una vacuna inactiva sí responde, con `activa: false`.
      x-permiso: ESQUEMA_CONSULTAR
      parameters:
        - name: vacunaId
          in: query
          required: true
          description: Id de la vacuna en MySQL
          schema: { type: integer, minimum: 1, example: 2 }
      responses:
        "200":
          description: Las versiones de la vacuna
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistorialEsquemas" }
        "400":
          description: Falta `vacunaId`, es inválido o repetido, o hay un parámetro no permitido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                vacunaId:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: vacunaId debe ser un número entero positivo. }
                parametro:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: estado." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/VacunaNoEncontrada" }

  /esquemas-captura/{id}/publicar:
    post:
      tags: [Configuración]
      summary: Publicar un borrador de la DDRISS (pasa a VIGENTE y el vigente anterior de la DDRISS a HISTORICO)
      description: |
        Solo un `BORRADOR` de la DDRISS del usuario. Se revisa, en este orden: que el esquema sea visible (404),
        que sea un borrador de la DDRISS (409 `ESQUEMA_NO_EDITABLE`), el cuerpo (400), las reglas de coherencia
        de `POST /esquemas-captura` sobre el contenido guardado y el catálogo actual (422 `ESQUEMA_INVALIDO`) y
        las reglas de la vigencia (422 `VIGENCIA_INVALIDA`).

        Vigencia: `vigenciaDesde` es el día 1 de un mes que está en el calendario de periodos, no anterior al mes
        actual (hora de Guatemala) y posterior al `desde` del `VIGENTE` de la DDRISS, si hay uno. Puede ser
        futura: el borrador pasa a `VIGENTE` de inmediato y la versión anterior sigue aplicando hasta su `hasta`.

        Al publicar:
        - el borrador pasa a `VIGENTE` con `vigencia { desde: vigenciaDesde, hasta: null }`, `versionAnteriorId`
          = el `VIGENTE` de la DDRISS (o null), `publicadoPor`, `publicadoEn` y `motivoCambio`; el resto no cambia;
        - el `VIGENTE` anterior de la DDRISS, si existe, pasa a `HISTORICO` con `hasta` = el día anterior a
          `vigenciaDesde`; solo cambian su `estado` y su `vigencia.hasta`;
        - el `VIGENTE` nacional no cambia.

        Los dos documentos se escriben en una transacción de MongoDB. Si otra publicación ganó la carrera o el
        borrador se descartó mientras tanto, responde 409 y no cambia nada.

        Bitácora (módulo `CONFIGURACION`, entidad `esquemas_captura`, `entidadId` el ObjectId de cada documento):
        `PUBLICAR_ESQUEMA` del borrador y, si reemplaza a otra versión, `ACTUALIZAR` de esa versión.
      x-permiso: ESQUEMA_PUBLICAR
      parameters:
        - { $ref: "#/components/parameters/IdEsquema" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EsquemaPublicar" }
      responses:
        "200":
          description: Versión publicada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EsquemaCaptura" }
        "400":
          description: Campo faltante o no permitido, fecha con otro formato o que no es día 1, o motivo inválido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                campo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: estado." }
                formato:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: La vigencia debe ser una fecha AAAA-MM-DD. }
                diaUno:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: La vigencia debe empezar el día 1 de un mes. }
                motivo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El motivo del cambio debe tener entre 1 y 300 caracteres. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: No es un borrador de la DDRISS, o el borrador o el vigente de la DDRISS cambiaron mientras tanto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                noEditable:
                  value:
                    error: { codigo: ESQUEMA_NO_EDITABLE, mensaje: Solo se publica un borrador de su DDRISS. }
                baseDesactualizada:
                  value:
                    error: { codigo: BASE_DESACTUALIZADA, mensaje: El esquema vigente de Hexavalente cambió; vuelva a intentarlo. }
        "422":
          description: El borrador incumple una regla de coherencia (`ESQUEMA_INVALIDO`) o de la vigencia (`VIGENCIA_INVALIDA`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                coherencia:
                  value:
                    error: { codigo: ESQUEMA_INVALIDO, mensaje: La dosis D3 no es una dosis activa de HEXA. }
                sinPeriodo:
                  value:
                    error: { codigo: VIGENCIA_INVALIDA, mensaje: El mes 2027-01 no está en el calendario de periodos. }
                mesPasado:
                  value:
                    error: { codigo: VIGENCIA_INVALIDA, mensaje: La vigencia no puede empezar antes del mes actual. }
                anteriorVigente:
                  value:
                    error: { codigo: VIGENCIA_INVALIDA, mensaje: "La vigencia debe empezar después del 01/12/2026, cuando empezó la versión 4 de su DDRISS." }

  /reglas-validacion:
    get:
      tags: [Configuración]
      summary: Reglas de validación visibles para la DDRISS del usuario, una fila por código
      description: |
        Una fila por código que tenga al menos una versión `VIGENTE` o `HISTORICO` `NACIONAL` o de la DDRISS del
        usuario. Los códigos que solo tienen borradores y los de otras DDRISS no aparecen.

        - `aplica`: la versión que aplica a la DDRISS: su `VIGENTE` si existe; si no, el `VIGENTE` nacional del
          mismo código; si no, null (la regla está inactiva en la DDRISS).
        - `ultimaDdriss`: la versión más reciente de la DDRISS, `VIGENTE` o `HISTORICO`, o null.
        - `vigenteNacional`: la versión del `VIGENTE` nacional, o null.

        Ordenadas por el `nombre` de la primera que exista de `aplica`, `ultimaDdriss` o la última nacional.
        Sin parámetros (uno desconocido responde 400) y sin paginar.

        Estas son también las reglas que ejecuta la validación de un reporte (HU-25): las que aplican a la DDRISS
        del establecimiento en el momento de validar, cuyo `vacunas` contiene la vacuna o `*`.
        `esquemas_captura.reglas` ya no decide qué reglas se ejecutan.
      x-permiso: REGLA_CONSULTAR
      responses:
        "200":
          description: Las reglas de la DDRISS
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReglaPorCodigo" }
        "400":
          description: Parámetro no permitido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: tipo." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
    post:
      tags: [Configuración]
      summary: Crear una regla de validación de la DDRISS (código generado, versión 1)
      description: |
        Solo de los tipos con parámetros: `RANGO`, `SECUENCIA_DOSIS`, `VARIACION_HISTORICA` y `TOTAL_CUADRA`.
        El backend genera el código `{TIPO}_{NN}`: `NN` es el siguiente consecutivo del tipo en todo el país, con
        dos dígitos como mínimo, contando los códigos de ese tipo con ese formato en cualquier territorio y
        estado (los que no lo siguen, como `VARIACION_HISTORICA` o `RANGO_DOSIS_MES`, no cuentan). El ámbito
        lo fija el tipo.

        Guarda la versión 1 `VIGENTE` con el territorio de la DDRISS del usuario y `vigencia.desde` = el instante
        de la publicación. Se revisa, en este orden: el cuerpo (400) y las vacunas (422 `REGLA_INVALIDA`). Si
        dos altas chocan en el código, la segunda responde 409 `REGLA_DESACTUALIZADA`.

        Bitácora (módulo `CONFIGURACION`, entidad `reglas_validacion`, `entidadId` el ObjectId): `CREAR` con el
        documento completo.
      x-permiso: REGLA_CREAR
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReglaCrear" }
      responses:
        "201":
          description: Regla creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReglaValidacion" }
        "400": { $ref: "#/components/responses/ReglaEntradaInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "409": { $ref: "#/components/responses/ReglaDesactualizada" }
        "422": { $ref: "#/components/responses/ReglaInvalida" }

  /reglas-validacion/{codigo}/historial:
    get:
      tags: [Configuración]
      summary: Historial de versiones de una regla de validación
      description: |
        Las versiones `NACIONAL` y de la DDRISS del usuario del código, sin borradores, de la más reciente a la
        más antigua. `desactivacion` sale de la fila `DESACTIVAR` de la bitácora de esa versión, o es null.
        Sin parámetros (uno desconocido responde 400) y sin paginar.
      x-permiso: REGLA_CONSULTAR
      parameters:
        - { $ref: "#/components/parameters/CodigoRegla" }
      responses:
        "200":
          description: Las versiones de la regla
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReglaEnHistorial" }
        "400":
          description: Parámetro no permitido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: estado." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /reglas-validacion/{codigo}/versiones:
    post:
      tags: [Configuración]
      summary: Publicar una versión nueva de la regla para la DDRISS
      description: |
        Guarda una versión `VIGENTE` de la DDRISS del usuario con `version` = la mayor del código en todo el país
        + 1. El código, el tipo y el ámbito no cambian. Si la DDRISS tenía un `VIGENTE` del código, pasa a
        `HISTORICO` con `vigencia.hasta` = el instante de la publicación; solo cambian su `estado` y su
        `vigencia.hasta`. El `VIGENTE` nacional no cambia: la versión de la DDRISS lo reemplaza solo en ella.

        `versionBase` es la versión que cargó el editor: la de `aplica`, o si no hay, la de `ultimaDdriss`, o si
        no hay, la última nacional (la fila de `GET /reglas-validacion`). Se revisa, en este orden: que el código
        sea visible (404), el cuerpo (400), `versionBase` (409 `REGLA_DESACTUALIZADA`), las vacunas
        (422 `REGLA_INVALIDA`) y que el contenido cambie algo de la versión que aplica (422 `REGLA_SIN_CAMBIOS`).

        Los dos documentos se escriben en una transacción de MongoDB. Si otra escritura ganó la carrera,
        responde 409 `REGLA_DESACTUALIZADA` y no cambia nada.

        Bitácora: `CREAR` de la versión nueva y, si reemplaza a otra de la DDRISS, `ACTUALIZAR` de esa versión.
      x-permiso: REGLA_EDITAR
      parameters:
        - { $ref: "#/components/parameters/CodigoRegla" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReglaVersion" }
      responses:
        "201":
          description: Versión publicada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReglaValidacion" }
        "400": { $ref: "#/components/responses/ReglaEntradaInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/ReglaDesactualizada" }
        "422":
          description: Una vacuna inexistente o inactiva, o la versión no cambia nada de la que aplica
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                vacuna:
                  value:
                    error: { codigo: REGLA_INVALIDA, mensaje: La vacuna BCG no existe o está inactiva. }
                sinCambios:
                  value:
                    error: { codigo: REGLA_SIN_CAMBIOS, mensaje: La versión no cambia nada de la que aplica. }

  /reglas-validacion/{codigo}/desactivar:
    post:
      tags: [Configuración]
      summary: Desactivar la versión de la DDRISS (pasa a HISTORICO sin reemplazo)
      description: |
        El `VIGENTE` de la DDRISS del usuario pasa a `HISTORICO` con `vigencia.hasta` = el instante del cambio;
        solo cambian su `estado` y su `vigencia.hasta`. Si hay un `VIGENTE` nacional del mismo código, vuelve a
        aplicar ese; si no, la regla queda inactiva en la DDRISS. Una regla nacional no se desactiva.

        `version` es la del `VIGENTE` de la DDRISS que se ve. Se revisa, en este orden: que el código sea visible
        (404), el cuerpo (400), que la DDRISS tenga un `VIGENTE` del código (409 `REGLA_SIN_VERSION_PROPIA`) y
        que sea `version` (409 `REGLA_DESACTUALIZADA`). La escritura lleva la condición `estado: VIGENTE`.

        Bitácora: `DESACTIVAR` de la versión, con `estado`, `vigencia.hasta` y `motivoCambio` en `valoresNuevos`.
      x-permiso: REGLA_EDITAR
      parameters:
        - { $ref: "#/components/parameters/CodigoRegla" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReglaEstado" }
      responses:
        "200":
          description: Regla desactivada; la fila actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReglaPorCodigo" }
        "400": { $ref: "#/components/responses/ReglaEstadoInvalido" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: La DDRISS no tiene una versión activa del código, o la versión cambió mientras tanto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                sinVersionPropia:
                  value:
                    error: { codigo: REGLA_SIN_VERSION_PROPIA, mensaje: Su DDRISS no tiene una versión activa de esta regla; las reglas nacionales no se desactivan. }
                desactualizada:
                  value:
                    error: { codigo: REGLA_DESACTUALIZADA, mensaje: La regla VARIACION_HISTORICA cambió mientras la editaba; vuelva a abrirla. }

  /reglas-validacion/{codigo}/activar:
    post:
      tags: [Configuración]
      summary: Activar una regla de la DDRISS (publica una copia de su última versión)
      description: |
        Copia el contenido de la última versión de la DDRISS del usuario (que está en `HISTORICO`) en una versión
        nueva `VIGENTE` de la DDRISS, con `version` = la mayor del código en todo el país + 1 y el motivo del
        cuerpo.

        `version` es la de `ultimaDdriss`. Se revisa, en este orden: que el código sea visible (404), el cuerpo
        (400), que la DDRISS tenga versiones del código y ninguna `VIGENTE` (409 `REGLA_SIN_VERSION_PROPIA`),
        que `version` sea su última versión (409 `REGLA_DESACTUALIZADA`) y que las vacunas de la copia sigan
        activas (422 `REGLA_INVALIDA`).

        Bitácora: `REACTIVAR` de la versión nueva, con el documento completo.
      x-permiso: REGLA_EDITAR
      parameters:
        - { $ref: "#/components/parameters/CodigoRegla" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReglaEstado" }
      responses:
        "201":
          description: Versión publicada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReglaValidacion" }
        "400": { $ref: "#/components/responses/ReglaEstadoInvalido" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: La DDRISS ya tiene un `VIGENTE` del código o no tiene versiones, o la versión cambió mientras tanto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                sinVersionPropia:
                  value:
                    error: { codigo: REGLA_SIN_VERSION_PROPIA, mensaje: Solo se activa una regla de su DDRISS que esté desactivada. }
                desactualizada:
                  value:
                    error: { codigo: REGLA_DESACTUALIZADA, mensaje: La regla RANGO_01 cambió mientras la editaba; vuelva a abrirla. }
        "422": { $ref: "#/components/responses/ReglaInvalida" }

  /configuracion-indicadores:
    get:
      tags: [Configuración]
      summary: Indicadores configurados visibles para la DDRISS del usuario, una fila por código
      description: |
        Una fila por código que tenga al menos una versión `VIGENTE` o `HISTORICO` `NACIONAL` o de la DDRISS del
        usuario. Los códigos que solo tienen borradores y los de otras DDRISS no aparecen.

        - `aplica`: la versión que aplica a la DDRISS: su `VIGENTE` si existe; si no, el `VIGENTE` nacional del
          mismo código; si no, null (el indicador está inactivo en la DDRISS).
        - `ultimaDdriss`: la versión más reciente de la DDRISS, `VIGENTE` o `HISTORICO`, o null.
        - `vigenteNacional`: la versión del `VIGENTE` nacional, o null.

        Ordenadas por el nombre de la vacuna y luego por el tipo (`COBERTURA`, `AVANCE_META_MES`, `BRECHA`,
        `DESERCION`, `PROYECCION`). Sin parámetros (uno desconocido responde 400) y sin paginar.

        Estos son también los indicadores que calcula el motor (HU-36 a HU-39): los que aplican a la DDRISS en
        el momento de la corrida. `resultado_indicador` guarda el código y la versión usados, así que un cambio de
        configuración no altera los resultados ya guardados.
      x-permiso: INDICADOR_CONFIG_CONSULTAR
      responses:
        "200":
          description: Los indicadores de la DDRISS
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IndicadorPorCodigo" }
        "400":
          description: Parámetro no permitido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: vacuna." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
    post:
      tags: [Configuración]
      summary: Crear un indicador de la DDRISS (código generado, versión 1)
      description: |
        Solo de los tipos `COBERTURA`, `AVANCE_META_MES`, `BRECHA` y `DESERCION` (`PROYECCION` solo se versiona).
        Los campos que admite cada tipo están en `IndicadorCrear`; uno que el tipo no tiene responde 400.

        El backend genera el código `{PREFIJO}_{VACUNA}{DOSIS}`: el prefijo sale del tipo (`COB`, `AVANCE`,
        `BRECHA`, `DES`), `{VACUNA}` es el código de la vacuna y `{DOSIS}` el de la dosis sin la `D` inicial
        (`D3` → `3`, `R1` → `R1`, `UNICA` → `U`); en `DESERCION`, las dos dosis unidas con `_` (`DES_HEXA1_3`).
        Una `COBERTURA` con prorrateo `NINGUNO` (la cobertura anual, SPEC 60) lleva el prefijo `COB_ANUAL`
        (`COB_ANUAL_HEXA3`). Si el código ya existe en cualquier territorio y estado, agrega `_2`, `_3`… (el primero libre). Si pasa
        de 40 caracteres, responde 422 `INDICADOR_INVALIDO`.

        Lo que no se edita sale de los valores por defecto del tipo: numerador de producción `CERRADO`, por
        procedencia y acumulado anual; `niveles` `MUNICIPIO` y `DEPARTAMENTO`; periodicidad `MENSUAL`; alerta sin
        generar; y los `parametros` del tipo.

        Guarda la versión 1 `VIGENTE` con el territorio de la DDRISS del usuario y `vigencia.desde` = el instante
        de la publicación. Se revisa, en este orden: el cuerpo (400), la vacuna, las dosis y el grupo de edad
        (422 `INDICADOR_INVALIDO`) y que otro código que aplica a la DDRISS no tenga el mismo tipo, vacuna y dosis
        (409 `INDICADOR_DUPLICADO`). En `COBERTURA` cuenta también el prorrateo (SPEC 60): una cobertura
        `MENSUAL_LINEAL` y una `NINGUNO` de la misma dosis conviven. Si dos altas chocan en el código, la segunda responde 409
        `INDICADOR_DESACTUALIZADO`.

        Bitácora (módulo `CONFIGURACION`, entidad `configuracion_indicadores`, `entidadId` el ObjectId): `CREAR`
        con el documento completo.
      x-permiso: INDICADOR_CONFIG_EDITAR
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IndicadorCrear" }
      responses:
        "201":
          description: Indicador creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfiguracionIndicador" }
        "400": { $ref: "#/components/responses/IndicadorEntradaInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "409": { $ref: "#/components/responses/IndicadorConflicto" }
        "422": { $ref: "#/components/responses/IndicadorInvalido" }

  /configuracion-indicadores/opciones:
    get:
      tags: [Configuración]
      summary: Lo que necesita el editor de indicadores (vacunas, dosis, poblaciones y grupos de edad)
      description: |
        Las vacunas activas con sus dosis activas, en el orden de `GET /vacunas` (por `ordenInforme` y nombre, las
        dosis por `orden`); las clasificaciones de `clasificacion_poblacion`, por id; y los valores activos de la
        dimensión `grupo_edad`, por `orden`. Sin parámetros (uno desconocido responde 400).
      x-permiso: INDICADOR_CONFIG_CONSULTAR
      responses:
        "200":
          description: Las opciones del editor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpcionesIndicador" }
        "400":
          description: Parámetro no permitido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: activa." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /configuracion-indicadores/{codigo}/historial:
    get:
      tags: [Configuración]
      summary: Historial de versiones de un indicador
      description: |
        Las versiones `NACIONAL` y de la DDRISS del usuario del código, sin borradores, de la más reciente a la
        más antigua. `desactivacion` sale de la fila `DESACTIVAR` de la bitácora de esa versión, o es null.
        Sin parámetros (uno desconocido responde 400) y sin paginar.
      x-permiso: INDICADOR_CONFIG_CONSULTAR
      parameters:
        - { $ref: "#/components/parameters/CodigoIndicador" }
      responses:
        "200":
          description: Las versiones del indicador
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IndicadorEnHistorial" }
        "400":
          description: Parámetro no permitido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: estado." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /configuracion-indicadores/{codigo}/versiones:
    post:
      tags: [Configuración]
      summary: Publicar una versión nueva del indicador para la DDRISS
      description: |
        Guarda una versión `VIGENTE` de la DDRISS del usuario con `version` = la mayor del código en todo el país
        + 1. El código, el tipo y la vacuna no cambian. Lo que no se edita (numerador, alerta, `parametros`,
        niveles, periodicidad, unidad y comparador de la meta) se copia de la versión base. En `PROYECCION` solo
        cambian el nombre, la descripción y la meta.

        Si la DDRISS tenía un `VIGENTE` del código, pasa a `HISTORICO` con `vigencia.hasta` = el instante de la
        publicación; solo cambian su `estado` y su `vigencia.hasta`. El `VIGENTE` nacional no cambia: la versión
        de la DDRISS lo reemplaza solo en ella.

        `versionBase` es la versión que cargó el editor: la de `aplica`, o si no hay, la de `ultimaDdriss`, o si
        no hay, la última nacional. Se revisa, en este orden: que el código sea visible (404), el cuerpo (400),
        `versionBase` (409 `INDICADOR_DESACTUALIZADO`), la vacuna, las dosis y el grupo de edad (422
        `INDICADOR_INVALIDO`), que otro código que aplica no mida lo mismo (409 `INDICADOR_DUPLICADO`) y que el
        contenido cambie algo de la versión que aplica (422 `INDICADOR_SIN_CAMBIOS`).

        Los dos documentos se escriben en una transacción de MongoDB. Si otra escritura ganó la carrera,
        responde 409 `INDICADOR_DESACTUALIZADO` y no cambia nada.

        Bitácora: `CREAR` de la versión nueva y, si reemplaza a otra de la DDRISS, `ACTUALIZAR` de esa versión.
      x-permiso: INDICADOR_CONFIG_EDITAR
      parameters:
        - { $ref: "#/components/parameters/CodigoIndicador" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IndicadorVersion" }
      responses:
        "201":
          description: Versión publicada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfiguracionIndicador" }
        "400": { $ref: "#/components/responses/IndicadorEntradaInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/IndicadorConflicto" }
        "422":
          description: Vacuna, dosis o grupo de edad inactivos, o la versión no cambia nada de la que aplica
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                dosis:
                  value:
                    error: { codigo: INDICADOR_INVALIDO, mensaje: La dosis D4 no existe o está inactiva en HEXA. }
                sinCambios:
                  value:
                    error: { codigo: INDICADOR_SIN_CAMBIOS, mensaje: La versión no cambia nada de la que aplica. }

  /configuracion-indicadores/{codigo}/desactivar:
    post:
      tags: [Configuración]
      summary: Desactivar la versión de la DDRISS (pasa a HISTORICO sin reemplazo)
      description: |
        El `VIGENTE` de la DDRISS del usuario pasa a `HISTORICO` con `vigencia.hasta` = el instante del cambio;
        solo cambian su `estado` y su `vigencia.hasta`. Si hay un `VIGENTE` nacional del mismo código, vuelve a
        aplicar ese; si no, el indicador deja de calcularse para la DDRISS. Un indicador nacional no se desactiva.

        `version` es la del `VIGENTE` de la DDRISS que se ve. Se revisa, en este orden: que el código sea visible
        (404), el cuerpo (400), que la DDRISS tenga un `VIGENTE` del código (409 `INDICADOR_SIN_VERSION_PROPIA`) y
        que sea `version` (409 `INDICADOR_DESACTUALIZADO`). La escritura lleva la condición `estado: VIGENTE`.

        Bitácora: `DESACTIVAR` de la versión, con `estado`, `vigencia.hasta` y `motivoCambio` en `valoresNuevos`.
      x-permiso: INDICADOR_CONFIG_EDITAR
      parameters:
        - { $ref: "#/components/parameters/CodigoIndicador" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IndicadorEstado" }
      responses:
        "200":
          description: Indicador desactivado; la fila actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndicadorPorCodigo" }
        "400": { $ref: "#/components/responses/IndicadorEstadoInvalido" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: La DDRISS no tiene una versión activa del código, o la versión cambió mientras tanto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                sinVersionPropia:
                  value:
                    error: { codigo: INDICADOR_SIN_VERSION_PROPIA, mensaje: Su DDRISS no tiene una versión activa de este indicador; los indicadores nacionales no se desactivan. }
                desactualizado:
                  value:
                    error: { codigo: INDICADOR_DESACTUALIZADO, mensaje: El indicador COB_HEXA3 cambió mientras lo editaba; vuelva a abrirlo. }

  /configuracion-indicadores/{codigo}/activar:
    post:
      tags: [Configuración]
      summary: Activar un indicador de la DDRISS (publica una copia de su última versión)
      description: |
        Copia el contenido de la última versión de la DDRISS del usuario (que está en `HISTORICO`) en una versión
        nueva `VIGENTE` de la DDRISS, con `version` = la mayor del código en todo el país + 1 y el motivo del
        cuerpo.

        `version` es la de `ultimaDdriss`. Se revisa, en este orden: que el código sea visible (404), el cuerpo
        (400), que la DDRISS tenga versiones del código y ninguna `VIGENTE` (409 `INDICADOR_SIN_VERSION_PROPIA`),
        que `version` sea su última versión (409 `INDICADOR_DESACTUALIZADO`), que la vacuna, las dosis y el grupo
        de edad de la copia sigan activos (422 `INDICADOR_INVALIDO`) y que otro código que aplica no mida lo mismo
        (409 `INDICADOR_DUPLICADO`).

        Bitácora: `REACTIVAR` de la versión nueva, con el documento completo.
      x-permiso: INDICADOR_CONFIG_EDITAR
      parameters:
        - { $ref: "#/components/parameters/CodigoIndicador" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IndicadorEstado" }
      responses:
        "201":
          description: Versión publicada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfiguracionIndicador" }
        "400": { $ref: "#/components/responses/IndicadorEstadoInvalido" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: |
            La DDRISS ya tiene un `VIGENTE` del código o no tiene versiones, la versión cambió mientras tanto, u
            otro código que aplica mide lo mismo
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Error" }
                  - type: object
                    properties:
                      codigoExistente: { type: string, description: Solo con `INDICADOR_DUPLICADO`, example: COB_SPR1_2 }
              examples:
                sinVersionPropia:
                  value:
                    error: { codigo: INDICADOR_SIN_VERSION_PROPIA, mensaje: Solo se activa un indicador de su DDRISS que esté desactivado. }
                desactualizado:
                  value:
                    error: { codigo: INDICADOR_DESACTUALIZADO, mensaje: El indicador COB_SPR1 cambió mientras lo editaba; vuelva a abrirlo. }
                duplicado:
                  value:
                    error: { codigo: INDICADOR_DUPLICADO, mensaje: Ya existe el indicador COB_SPR1_2 para la misma vacuna y dosis; publique una versión de ese. }
                    codigoExistente: COB_SPR1_2
        "422": { $ref: "#/components/responses/IndicadorInvalido" }

  # ---------------------------------------------------------------- Producción
  /reportes:
    get:
      tags: [Producción]
      summary: Listar los reportes mensuales del alcance del usuario
      description: |
        El Personal de establecimiento solo ve los de su establecimiento; el Revisor y el administrador (que lo
        usa para elegir el reporte cerrado de una rectificación, SPEC 40), los de su DDRISS. Ordenados por año y
        mes descendentes, con la forma paginada común. No lee MongoDB. Un parámetro inválido, desconocido o
        repetido responde 400 `ENTRADA_INVALIDA`; una página fuera de rango responde 200 con `elementos` vacío y
        el `total` real.

        Cada elemento trae `periodo.estado` (el estado del mes en `cierre_periodo` de la DDRISS del
        establecimiento), `estadoDesde` (la fecha de la fila más reciente de `historial_estado_reporte`) y, si
        el reporte está en `CORRECCION_SOLICITADA`, `correccion` con el comentario y la fecha de la fila más
        reciente que lo pasó a ese estado.
      x-permiso: REPORTE_CONSULTAR
      parameters:
        - { name: periodoId, in: query, schema: { type: integer, minimum: 1, example: 10 } }
        - { name: anio, in: query, schema: { type: integer, minimum: 2000, maximum: 2100, example: 2026 } }
        - { name: estado, in: query, schema: { $ref: "#/components/schemas/EstadoReporte" } }
        - { $ref: "#/components/parameters/Pagina" }
        - { $ref: "#/components/parameters/PorPagina" }
      responses:
        "200":
          description: Página de reportes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginaReportes" }
        "400":
          description: Un parámetro inválido, desconocido o repetido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                estado:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "estado debe ser BORRADOR, ENVIADO, EN_REVISION, CORRECCION_SOLICITADA, APROBADO, CERRADO o RECTIFICACION." }
                anio:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: anio debe ser un número entero entre 2000 y 2100. }
                desconocido:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: establecimientoId." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
    post:
      tags: [Producción]
      summary: Crear el reporte mensual del establecimiento del usuario (nace en BORRADOR)
      description: |
        El establecimiento sale de la cuenta del usuario. El mes debe estar `ABIERTO` en `cierre_periodo` de la
        DDRISS del establecimiento y su fecha límite de envío no debe haber pasado (fecha de Guatemala), aunque la
        tarea que pasa el mes a `EN_CIERRE` todavía no haya corrido; si no, 409 `PERIODO_NO_ABIERTO`. Crea, en una transacción de MySQL, el reporte, una fila de `reporte_vacuna`
        por cada vacuna activa con un esquema publicado que cubra el día 1 del mes (el de la DDRISS del
        establecimiento, `VIGENTE` o `HISTORICO`, o si no hay, el nacional) **marcado con `incluirPorDefecto`**
        (un esquema sin el campo cuenta como marcado), una fila en `historial_estado_reporte`
        (`null` → `BORRADOR`) y una `CREAR` en la bitácora. Las vacunas sin esquema para ese mes se omiten, y las
        de un esquema sin marcar se agregan después con `POST /reportes/{id}/vacunas`. Las vacunas y sus
        versiones quedan fijas: desactivar una vacuna o publicar otra versión después no cambia el reporte.

        Si hay vacunas con esquema para el mes pero ninguna marcada, el reporte se crea sin vacunas. Solo si
        ninguna vacuna activa tiene esquema para el mes responde 422 `SIN_ESQUEMAS`.

        Los errores se revisan en este orden: cuerpo, establecimiento, periodo, reporte existente y esquemas.
      x-permiso: REPORTE_CREAR
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReporteNuevo" }
      responses:
        "201":
          description: Reporte creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reporte" }
        "400":
          description: El cuerpo no es `{ periodoId }` con un entero positivo, o trae otro campo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                periodo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: periodoId debe ser un número entero mayor o igual a 1. }
                campo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: establecimientoId." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403":
          description: Sin el permiso, o la cuenta no tiene establecimiento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                sinPermiso:
                  value:
                    error: { codigo: SIN_PERMISO, mensaje: No tiene permiso para realizar esta acción. }
                sinEstablecimiento:
                  value:
                    error: { codigo: SIN_ESTABLECIMIENTO, mensaje: Su cuenta no tiene un establecimiento asignado. }
        "404":
          description: El periodo no existe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: NO_ENCONTRADO, mensaje: El periodo no existe. }
        "409":
          description: |
            El establecimiento está inactivo, el mes no está abierto o su fecha límite ya pasó, o ya existe el
            reporte del mes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                establecimientoInactivo:
                  value:
                    error: { codigo: ESTABLECIMIENTO_INACTIVO, mensaje: Su establecimiento está desactivado y no puede crear reportes. }
                periodoNoAbierto:
                  value:
                    error: { codigo: PERIODO_NO_ABIERTO, mensaje: El mes no está abierto para reportes. }
                reporteExistente:
                  value:
                    error: { codigo: REPORTE_EXISTENTE, mensaje: Ya existe el reporte de este mes. }
        "422":
          description: El establecimiento no envía el 5C, o ninguna vacuna activa tiene esquema para el mes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                noReporta:
                  value:
                    error: { codigo: ESTABLECIMIENTO_NO_REPORTA, mensaje: Su establecimiento no envía el formulario 5C. }
                sinEsquemas:
                  value:
                    error: { codigo: SIN_ESQUEMAS, mensaje: No hay formularios de captura publicados para este mes. }

  /reportes/{id}:
    get:
      tags: [Producción]
      summary: Detalle de un reporte con sus vacunas y las etiquetas de su esquema
      description: |
        Uno que no existe o está fuera del alcance del usuario (para el Personal, de otro establecimiento)
        responde 404. Cada vacuna trae la versión del esquema fijada al crear el reporte y, de esa versión, las
        dosis que nombra y las dimensiones que usa con sus etiquetas, incluidas las inactivas.
      x-permiso: REPORTE_CONSULTAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: El reporte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reporte" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /reportes/{id}/formulario:
    get:
      tags: [Producción]
      summary: Formulario dinámico del reporte (esquema de cada vacuna y cantidades guardadas)
      description: |
        Por cada vacuna del reporte, en el orden de `GET /reportes/{id}`, trae la versión del esquema fijada al
        crear el reporte, todas sus celdas guardadas (de cualquier procedencia), sus datos adicionales y su
        total. Las etiquetas de las dosis y de las dimensiones no se repiten: salen de `GET /reportes/{id}`.

        Una celda vacía no tiene fila, así que no aparece; una con 0 sí. `editable` es `true` solo si el
        reporte está en `BORRADOR` y el mes está `ABIERTO` o `EN_CIERRE` en la DDRISS del establecimiento.
        Uno que no existe o está fuera del alcance del usuario responde 404.

        Cada vacuna trae sus `procedenciasPermitidas`, según el modo de procedencia de su esquema, y
        `municipios` trae el nombre de cada una y de las procedencias de las celdas guardadas.

        La pantalla de rectificación (SPEC 40) lo usa con un reporte `CERRADO` para mostrar sus cantidades
        actuales; también lo usa el administrador, para los reportes de su DDRISS.
      x-permiso: REPORTE_CONSULTAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: El formulario del reporte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormularioReporte" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /reportes/{id}/vacunas-disponibles:
    get:
      tags: [Producción]
      summary: Vacunas que se pueden agregar al reporte
      description: |
        Las vacunas activas con un esquema publicado que cubra el día 1 del mes (el de la DDRISS del
        establecimiento, o si no hay, el nacional), marcado o no, que el reporte todavía no tiene, en el orden de
        `GET /reportes/{id}`. No exige que el reporte esté en `BORRADOR`: la pantalla solo ofrece agregar cuando el
        formulario es `editable`. Un reporte que no existe o es de otro establecimiento responde 404.
      x-permiso: REPORTE_EDITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Las vacunas disponibles (puede ser `[]`)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VacunaDisponible" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /reportes/{id}/vacunas:
    post:
      tags: [Producción]
      summary: Agregar una vacuna al reporte en borrador
      description: |
        Agrega una fila de `reporte_vacuna` con el esquema que cubre el día 1 del mes en ese momento (como al
        crear el reporte, marcado o no), sube `versionFila` y deja una `CREAR` de `reporte_vacuna` en la bitácora,
        en una transacción de MySQL. La versión queda fija aunque después se publique otra.

        Responde la vacuna en la forma de `GET /reportes/{id}` y de `GET /reportes/{id}/formulario` (sin celdas),
        y `orden`, para que la pantalla la una a las demás sin recargar ni perder lo que no se ha guardado.

        Los errores se revisan en este orden: cuerpo, reporte, vacuna disponible, estado del reporte, estado del
        mes, `versionFila` y vacuna repetida.
      x-permiso: REPORTE_EDITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VacunaDeReporteAgregar" }
      responses:
        "201":
          description: Vacuna agregada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VacunaAgregada" }
        "400":
          description: El cuerpo no tiene la forma esperada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                campo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: esquemaId." }
                vacunaId:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: vacunaId debe ser un número entero mayor que 0. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404":
          description: El reporte no existe o es de otro establecimiento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: NO_ENCONTRADO, mensaje: El recurso solicitado no existe. }
        "409":
          description: El reporte no está en borrador, el mes está cerrado, `versionFila` no es la del reporte o la vacuna ya está
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                noEditable:
                  value:
                    error: { codigo: REPORTE_NO_EDITABLE, mensaje: El reporte ya no está en borrador y no se puede editar. }
                periodoCerrado:
                  value:
                    error: { codigo: PERIODO_CERRADO, mensaje: El mes ya está cerrado. }
                desactualizado:
                  value:
                    error: { codigo: REPORTE_DESACTUALIZADO, mensaje: El reporte cambió desde que lo abrió; recárguelo. }
                repetida:
                  value:
                    error: { codigo: VACUNA_YA_EN_REPORTE, mensaje: La vacuna ya está en el reporte. }
        "422":
          description: La vacuna no existe, está inactiva o no tiene un esquema publicado que cubra el mes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: VACUNA_NO_DISPONIBLE, mensaje: La vacuna no tiene un formulario de captura para este mes. }

  /reportes/{id}/vacunas/{vacunaId}:
    delete:
      tags: [Producción]
      summary: Quitar del reporte en borrador una vacuna que no es base, con sus cantidades
      description: |
        Borra la fila de `reporte_vacuna` y, en cascada, sus filas de `detalle_produccion`, `detalle_dimension` y
        `resultado_validacion`; sube `versionFila` y deja una `ELIMINAR` de `reporte_vacuna` en la bitácora con la
        fila y todas sus celdas, en una transacción de MySQL. `versionFila` va en la consulta.

        Una vacuna base (su versión fijada está marcada con `incluirPorDefecto`) no se quita, ni una con
        observaciones del revisor en `observacion_revision`.

        Los errores se revisan en este orden: consulta, reporte y vacuna, estado del reporte, estado del mes,
        `versionFila`, vacuna base y observaciones.
      x-permiso: REPORTE_EDITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: vacunaId, in: path, required: true, description: "`vacuna.id`", schema: { type: integer } }
        - { name: versionFila, in: query, required: true, description: La del reporte, schema: { type: integer, minimum: 1, example: 5 } }
      responses:
        "200":
          description: Vacuna quitada
          content:
            application/json:
              schema:
                type: object
                required: [versionFila]
                properties:
                  versionFila: { type: integer, description: La nueva del reporte, example: 6 }
        "400":
          description: Falta `versionFila`, no es válida, está repetida o hay otro parámetro
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: versionFila debe ser un número entero mayor que 0. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404":
          description: El reporte no existe o es de otro establecimiento, o la vacuna no está en el reporte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: NO_ENCONTRADO, mensaje: El recurso solicitado no existe. }
        "409":
          description: El reporte no está en borrador, el mes está cerrado, `versionFila` no es la del reporte, la vacuna es base o tiene observaciones
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                noEditable:
                  value:
                    error: { codigo: REPORTE_NO_EDITABLE, mensaje: El reporte ya no está en borrador y no se puede editar. }
                periodoCerrado:
                  value:
                    error: { codigo: PERIODO_CERRADO, mensaje: El mes ya está cerrado. }
                desactualizado:
                  value:
                    error: { codigo: REPORTE_DESACTUALIZADO, mensaje: El reporte cambió desde que lo abrió; recárguelo. }
                base:
                  value:
                    error: { codigo: VACUNA_BASE, mensaje: Esta vacuna es parte del reporte del mes y no se puede quitar. }
                observaciones:
                  value:
                    error: { codigo: VACUNA_CON_OBSERVACIONES, mensaje: La vacuna tiene observaciones del revisor y no se puede quitar. }
    put:
      tags: [Producción]
      summary: Guardar las cantidades de todas las procedencias y los datos adicionales de una vacuna del reporte
      description: |
        Reemplaza todas las celdas de esa vacuna, de cualquier procedencia (la tarjeta A y la B): las que no
        vienen se borran, las que cambian se actualizan y las nuevas se insertan, con sus filas de
        `detalle_dimension`, en una transacción de MySQL con su fila `ACTUALIZAR` en la bitácora. Una celda
        vacía no se manda; una con 0 sí, y queda guardada.

        La procedencia de cada celda debe ser el municipio del establecimiento o una de las
        `procedenciasPermitidas` de la vacuna (`GET /reportes/{id}/formulario`). Otra procedencia solo se
        acepta si la vacuna ya tenía filas de ella antes del guardado (una procedencia heredada, como un
        municipio desactivado).

        El backend calcula `clave_combinacion` a partir de `dimensiones` (ordenadas por código) y guarda en
        `total_declarado` la suma de todas las cantidades de la vacuna (`null` si no tiene filas). Una dosis
        inactiva solo se acepta si el reporte ya tenía filas de ella. Si nada cambió, no se escribe nada y
        `versionFila` no sube.

        Los errores se revisan en este orden: cuerpo, reporte y vacuna, estado del reporte, estado del mes,
        `versionFila`, celdas y datos adicionales.
      x-permiso: REPORTE_EDITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: vacunaId, in: path, required: true, description: "`vacuna.id`", schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VacunaDeReporteGuardar" }
      responses:
        "200":
          description: Cantidades guardadas
          content:
            application/json:
              schema:
                type: object
                required: [versionFila, vacuna]
                properties:
                  versionFila: { type: integer, description: "La nueva, o la misma si nada cambió", example: 4 }
                  vacuna: { $ref: "#/components/schemas/VacunaDeFormulario" }
        "400":
          description: El cuerpo no tiene la forma esperada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                campo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: totalDeclarado." }
                cantidad:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "La cantidad de cada celda debe ser un número entero mayor o igual a 0." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404":
          description: El reporte no existe o está fuera del alcance, o la vacuna no está en el reporte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: NO_ENCONTRADO, mensaje: El recurso solicitado no existe. }
        "409":
          description: El reporte no está en borrador, el mes está cerrado o `versionFila` no es la del reporte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                noEditable:
                  value:
                    error: { codigo: REPORTE_NO_EDITABLE, mensaje: El reporte ya no está en borrador y no se puede editar. }
                periodoCerrado:
                  value:
                    error: { codigo: PERIODO_CERRADO, mensaje: El mes ya está cerrado. }
                desactualizado:
                  value:
                    error: { codigo: REPORTE_DESACTUALIZADO, mensaje: El reporte cambió desde que lo abrió; recárguelo. }
        "422":
          description: Una celda o un dato adicional no corresponde al esquema de la vacuna
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                celdaInvalida:
                  value:
                    error: { codigo: CELDA_INVALIDA, mensaje: "La celda 3.ª dosis · < 1 año no es parte del formulario." }
                procedencia:
                  value:
                    error: { codigo: CELDA_INVALIDA, mensaje: "La celda 1.ª dosis · < 1 año tiene una procedencia que no se puede usar en esta vacuna." }
                celdaRepetida:
                  value:
                    error: { codigo: CELDA_REPETIDA, mensaje: "La celda 1.ª dosis · < 1 año está repetida." }
                datoAdicional:
                  value:
                    error: { codigo: DATO_ADICIONAL_INVALIDO, mensaje: "El dato «Frascos abiertos» no es válido." }

  # ---------------------------------------------------------------- Revisión
  /reportes/{id}/validar:
    post:
      tags: [Revisión]
      summary: Ejecutar las reglas de validación sobre lo guardado del reporte en borrador, sin cambiar el estado
      description: |
        Ejecuta las reglas que aplican a la DDRISS del establecimiento del reporte en este momento (por código,
        la `VIGENTE` de la DDRISS antes que la nacional; sin borradores), cuyo `vacunas` contiene la vacuna o
        `*`, sobre lo **guardado**: cada vacuna con la versión del esquema fijada en el reporte. Las reglas de
        ámbito `REPORTE` se ejecutan una vez. Una regla de un tipo que el backend no conoce se salta.

        Los resultados se comparan con los actuales del reporte (`ABIERTO` o `JUSTIFICADO`) por su llave: la
        regla, la vacuna, la celda y el mensaje. Uno que se repite se conserva (si cambió la versión o la
        severidad de la regla, se actualizan); uno nuevo se inserta `ABIERTO`; uno que ya no aparece pasa a
        `CORREGIDO`. Todo va en una transacción de MySQL con una fila `VALIDAR` en la bitácora (módulo
        `PRODUCCION`, entidad `reporte_produccion`, con `{ errores, advertencias, nuevos, actualizados,
        corregidos }`). Si nada cambió, no se escribe nada. No sube `versionFila`.

        Solo con el reporte en `BORRADOR` y el mes de la DDRISS `ABIERTO` o `EN_CIERRE`, como el guardado. Los
        errores se revisan en este orden: parámetros y cuerpo, reporte, estado del reporte y estado del mes.
      x-permiso: REPORTE_VALIDAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Los resultados actuales del reporte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Validacion" }
        "400":
          description: El id no es válido, hay un parámetro de consulta o el cuerpo no está vacío
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                parametro:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: vacunaId." }
                cuerpo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: versionFila." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404":
          description: El reporte no existe o es de otro establecimiento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: NO_ENCONTRADO, mensaje: El recurso solicitado no existe. }
        "409":
          description: El reporte no está en borrador o el mes no está abierto ni en cierre
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                noEditable:
                  value:
                    error: { codigo: REPORTE_NO_EDITABLE, mensaje: El reporte ya no está en borrador y no se puede editar. }
                periodoCerrado:
                  value:
                    error: { codigo: PERIODO_CERRADO, mensaje: El mes ya está cerrado. }

  /reportes/{id}/validacion:
    get:
      tags: [Revisión]
      summary: Resultados de validación guardados del reporte, sin volver a ejecutar las reglas
      description: |
        Lee los resultados actuales (`ABIERTO` y `JUSTIFICADO`) de `resultado_validacion`, en el mismo orden que
        `POST /reportes/{id}/validar`, sin ejecutar el motor ni escribir nada, en cualquier estado del reporte.
        Es lo que el revisor ve de lo que envió el establecimiento.

        `celdas` y `campos` van vacíos porque no se guardan; `corregidos` es 0 y `validadoEn` es el `ejecutado_en`
        más reciente de esos resultados, o `null` si no hay ninguno. Uno que no existe o está fuera del alcance del
        usuario (para el Personal, de otro establecimiento; para el Revisor, de otra DDRISS) responde 404.
      x-permiso: REPORTE_CONSULTAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Los resultados guardados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Validacion" }
        "400":
          description: El id no es válido o hay un parámetro de consulta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: vacunaId." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /reportes/{id}/transiciones:
    post:
      tags: [Revisión]
      summary: Cambiar el estado del reporte (enviar, asignar, pedir corrección, aprobar, cerrar)
      description: |
        Única vía para cambiar el estado. El permiso depende del destino; por ahora están habilitados `ENVIADO`
        (`REPORTE_ENVIAR`, solo el Personal del establecimiento), `EN_REVISION` (`REPORTE_ASIGNAR`, solo el
        Revisor), `CORRECCION_SOLICITADA` (`REPORTE_SOLICITAR_CORRECCION`, solo el Revisor), `BORRADOR`
        (`REPORTE_EDITAR`, solo el Personal del establecimiento) y `APROBADO` (`REPORTE_APROBAR`, solo el
        Revisor), y cualquier otro destino responde 422 `TRANSICION_NO_DISPONIBLE`. Además del permiso, la transición (estado actual →
        destino) debe existir en `transicion_estado` para el rol del usuario.

        Todo va en una transacción de MySQL con el reporte bloqueado. Cada transición sube `versionFila`, deja
        una fila en `historial_estado_reporte` (con el `comentario`, si viene) y una `CAMBIO_ESTADO` en la
        bitácora (módulo `REVISION`, entidad `reporte_produccion`).

        **ENVIADO:** solo con el mes de la DDRISS `ABIERTO` o `EN_CIERRE`, sin bloqueo por la fecha límite.
        Antes de cambiar el estado ejecuta las reglas sobre lo guardado, como `POST /reportes/{id}/validar`
        (con su fila `VALIDAR` si cambió algún resultado). Si quedan errores `ABIERTO`, los resultados quedan
        escritos, el reporte sigue en `BORRADOR` y responde 422 `REPORTE_CON_ERRORES` con la validación. Sin
        errores, el reporte pasa a `ENVIADO` con `enviadoEn`; las advertencias se envían y siguen `ABIERTO`.
        En un reenvío (después de una devolución), las observaciones pendientes del reporte (`atendida` en
        `false`) quedan atendidas (`atendida` en `true`, `atendidaEn` = ahora) en la misma transacción, y la
        `CAMBIO_ESTADO` lleva `observacionesAtendidas` con cuántas fueron. Con errores siguen pendientes.
        `revisor_id` y `asignado_en` no cambian: el reporte vuelve a la bandeja como `ENVIADO` con su revisor.

        **EN_REVISION (asignar):** exige `revisorId`, que debe ser una cuenta activa, con empleado activo, del
        rol `REVISOR` y de la DDRISS del reporte (puede ser el propio usuario); si no, 422 `REVISOR_INVALIDO`.
        Llena `revisor_id` y `asignado_en`, y la `CAMBIO_ESTADO` lleva `revisorId`. Cambiar después el revisor
        es `PATCH /reportes/{id}/revisor`.

        **CORRECCION_SOLICITADA (devolver):** solo el revisor asignado (`revisor_id` = el usuario); otro revisor
        recibe 403 `NO_ES_REVISOR_ASIGNADO`, sin fila `ACCESO_DENEGADO`. Exige `observaciones`, con al menos una
        (si no, 422 `OBSERVACION_REQUERIDA`): como máximo una general (`vacunaId: null`) y una por vacuna del
        reporte (otra vacuna: 422 `VACUNA_NO_EN_REPORTE`). No acepta `comentario`: el del historial lo arma el
        backend con el texto de la observación general o, sin ella, «N observaciones por vacuna: {nombres}»
        (recortado a 1000 caracteres). Escribe una fila de `observacion_revision` por observación (`detalle_id`
        vacío, `atendida` en `false`); `revisor_id` y `asignado_en` no cambian. La `CAMBIO_ESTADO` lleva las
        `observaciones` (`vacunaId` y `texto`). Volver a `BORRADOR` es del establecimiento.

        **BORRADOR (corregir):** solo desde `CORRECCION_SOLICITADA` y con el mes de la DDRISS `ABIERTO` o
        `EN_CIERRE` (si no, 409 `PERIODO_CERRADO`). El reporte vuelve a ser editable; `revisor_id`,
        `asignado_en` y las observaciones no cambian. `comentario` es opcional.

        **APROBADO (aprobar):** solo desde `EN_REVISION` y solo el revisor asignado (`revisor_id` = el usuario);
        otro revisor recibe 403 `NO_ES_REVISOR_ASIGNADO`, sin fila `ACCESO_DENEGADO`. No revisa el estado del mes.
        Llena `aprobadoPor` (el usuario) y `aprobadoEn`; `revisor_id` y `asignado_en` no cambian. `comentario` es
        opcional y va al historial. Las advertencias `ABIERTO` no impiden aprobar, y la `CAMBIO_ESTADO` lleva
        `advertencias` con cuántas había. Un reporte aprobado ya no se edita (409 `REPORTE_NO_EDITABLE`).

        Los errores se revisan en este orden: cuerpo, destino disponible, permiso, reporte, transición,
        comentario (salvo `CORRECCION_SOLICITADA`), estado del mes (solo `ENVIADO` y `BORRADOR`), `versionFila`, revisor (solo
        `EN_REVISION`), revisor asignado (`CORRECCION_SOLICITADA` y `APROBADO`), observaciones (solo
        `CORRECCION_SOLICITADA`) y validación (solo `ENVIADO`).
      x-permiso: "Según estadoDestino: ENVIADO → REPORTE_ENVIAR; EN_REVISION → REPORTE_ASIGNAR; CORRECCION_SOLICITADA → REPORTE_SOLICITAR_CORRECCION; BORRADOR → REPORTE_EDITAR; APROBADO → REPORTE_APROBAR"
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estadoDestino, versionFila]
              additionalProperties: false
              properties:
                estadoDestino: { $ref: "#/components/schemas/EstadoReporte" }
                versionFila: { type: integer, description: La del reporte que se abrió, example: 4 }
                comentario:
                  type: string
                  maxLength: 1000
                  description: |
                    Opcional; se guarda en el historial. Con `CORRECCION_SOLICITADA` no se acepta (400): el
                    comentario sale de las observaciones.
                revisorId:
                  type: integer
                  minimum: 1
                  description: Obligatorio con `EN_REVISION` (el revisor que se asigna); con otro destino, 400
                  example: 2
                observaciones:
                  type: array
                  description: |
                    Obligatorio con `CORRECCION_SOLICITADA`; con otro destino, 400. Vacío: 422
                    `OBSERVACION_REQUERIDA`. Una general y una por vacuna como máximo (repetida: 400).
                  items:
                    type: object
                    required: [vacunaId, texto]
                    additionalProperties: false
                    properties:
                      vacunaId:
                        type: integer
                        minimum: 1
                        nullable: true
                        description: Una vacuna del reporte, o `null` para la observación general
                        example: 3
                      texto:
                        type: string
                        minLength: 1
                        maxLength: 1000
                        description: Sin espacios a los lados
                        example: Hexavalente D1 en menores de 1 año es muy alto frente a septiembre.
            examples:
              enviar: { value: { estadoDestino: ENVIADO, versionFila: 4 } }
              asignar: { value: { estadoDestino: EN_REVISION, versionFila: 5, revisorId: 2 } }
              devolver:
                value:
                  estadoDestino: CORRECCION_SOLICITADA
                  versionFila: 15
                  observaciones:
                    - { vacunaId: null, texto: Revise la procedencia de las dosis de octubre. }
                    - { vacunaId: 3, texto: Hexavalente D1 en menores de 1 año es muy alto frente a septiembre. }
              corregir: { value: { estadoDestino: BORRADOR, versionFila: 16 } }
              aprobar: { value: { estadoDestino: APROBADO, versionFila: 21, comentario: Cifras coherentes con septiembre. } }
      responses:
        "200":
          description: Estado actualizado; el reporte como en `GET /reportes/{id}`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reporte" }
        "400":
          description: El id o el cuerpo no son válidos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                sinVersion:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "El campo versionFila es obligatorio." }
                campoDeMas:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: motivo." }
                destino:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "El estado destino no es válido." }
                sinRevisor:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "El campo revisorId es obligatorio para asignar el reporte." }
                sinObservaciones:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "El campo observaciones es obligatorio para solicitar la corrección." }
                observacionRepetida:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Solo puede haber una observación general." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403":
          description: Sin el permiso del destino, o al devolver o aprobar, el usuario no es el revisor asignado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                sinPermiso:
                  value:
                    error: { codigo: SIN_PERMISO, mensaje: No tiene permiso para realizar esta acción. }
                noAsignado:
                  value:
                    error: { codigo: NO_ES_REVISOR_ASIGNADO, mensaje: Solo el revisor asignado puede hacer esto con el reporte. }
        "404":
          description: El reporte no existe o no es del ámbito del usuario
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: NO_ENCONTRADO, mensaje: El recurso solicitado no existe. }
        "409":
          description: El mes no está abierto ni en cierre, o el reporte cambió desde que se abrió
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                periodoCerrado:
                  value:
                    error: { codigo: PERIODO_CERRADO, mensaje: El mes ya está cerrado. }
                desactualizado:
                  value:
                    error: { codigo: REPORTE_DESACTUALIZADO, mensaje: El reporte cambió desde que lo abrió; recárguelo. }
        "422":
          description: |
            El destino no está habilitado, la transición no existe para el rol desde el estado actual, falta el
            comentario que exige la transición, al asignar el revisor no es válido, al devolver no hay
            observaciones o una es de una vacuna que no está en el reporte o, al enviar, quedan errores de
            validación (con `validacion`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorConValidacion" }
              examples:
                noDisponible:
                  value:
                    error: { codigo: TRANSICION_NO_DISPONIBLE, mensaje: Esa transición todavía no está disponible. }
                noPermitida:
                  value:
                    error: { codigo: TRANSICION_NO_PERMITIDA, mensaje: El reporte no puede pasar de Enviado a Enviado. }
                comentario:
                  value:
                    error: { codigo: COMENTARIO_REQUERIDO, mensaje: Esta transición requiere un comentario. }
                revisorInvalido:
                  value:
                    error: { codigo: REVISOR_INVALIDO, mensaje: El revisor elegido no es un revisor activo de la DDRISS del reporte. }
                observacionRequerida:
                  value:
                    error: { codigo: OBSERVACION_REQUERIDA, mensaje: Escriba al menos una observación para devolver el reporte. }
                vacunaNoEnReporte:
                  value:
                    error: { codigo: VACUNA_NO_EN_REPORTE, mensaje: Una observación es de una vacuna que no está en el reporte. }
                conErrores:
                  value:
                    error:
                      codigo: REPORTE_CON_ERRORES
                      mensaje: El reporte tiene 2 errores de validación. Corríjalos para poder enviarlo.
                    validacion:
                      validadoEn: "2026-10-30T15:42:10.000Z"
                      errores: 2
                      advertencias: 1
                      corregidos: 0
                      resultados: []

  /reportes/{id}/revisor:
    patch:
      tags: [Revisión]
      summary: Pasar un reporte en revisión a otro revisor (solo el revisor asignado)
      description: |
        Cambia `revisor_id` y `asignado_en` de un reporte `EN_REVISION` sin cambiar su estado, así que no pasa por
        `/transiciones` ni escribe en `historial_estado_reporte`. Solo lo puede hacer el revisor asignado. El nuevo
        revisor debe ser una cuenta activa, con empleado activo, del rol `REVISOR` y de la DDRISS del reporte, y
        distinto del actual. Sube `versionFila` y deja una fila `ACTUALIZAR` en la bitácora (módulo `REVISION`,
        entidad `reporte_produccion`) con `{ revisorId }` antes y después.

        Los errores se revisan en este orden: cuerpo, permiso, reporte, estado, revisor asignado, revisor nuevo
        y `versionFila`.
      x-permiso: REPORTE_ASIGNAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revisorId, versionFila]
              additionalProperties: false
              properties:
                revisorId: { type: integer, minimum: 1, description: El revisor nuevo, example: 3 }
                versionFila: { type: integer, description: La del reporte que se ve, example: 6 }
      responses:
        "200":
          description: El revisor nuevo y la versionFila nueva del reporte
          content:
            application/json:
              schema:
                type: object
                required: [versionFila, revisor]
                properties:
                  versionFila: { type: integer, example: 7 }
                  revisor: { $ref: "#/components/schemas/RevisorResumen" }
        "400":
          description: El id o el cuerpo no son válidos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                sinVersion:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "El campo versionFila es obligatorio." }
                campoDeMas:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: motivo." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403":
          description: Sin `REPORTE_ASIGNAR`, o el usuario no es el revisor asignado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                sinPermiso:
                  value:
                    error: { codigo: SIN_PERMISO, mensaje: No tiene permiso para realizar esta acción. }
                noAsignado:
                  value:
                    error: { codigo: NO_ES_REVISOR_ASIGNADO, mensaje: Solo el revisor asignado puede pasar el reporte a otro revisor. }
        "404":
          description: El reporte no existe o no es de la DDRISS del usuario
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: NO_ENCONTRADO, mensaje: El recurso solicitado no existe. }
        "409":
          description: El reporte no está en revisión, o cambió desde que se abrió
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                noEnRevision:
                  value:
                    error: { codigo: REPORTE_NO_EN_REVISION, mensaje: El reporte no está en revisión. }
                desactualizado:
                  value:
                    error: { codigo: REPORTE_DESACTUALIZADO, mensaje: El reporte cambió desde que lo abrió; recárguelo. }
        "422":
          description: El revisor nuevo no es un revisor activo de la DDRISS, o es el mismo asignado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                invalido:
                  value:
                    error: { codigo: REVISOR_INVALIDO, mensaje: El revisor elegido no es un revisor activo de la DDRISS del reporte. }
                mismo:
                  value:
                    error: { codigo: REVISOR_INVALIDO, mensaje: El reporte ya está asignado a ese revisor. }

  /revision/bandeja:
    get:
      tags: [Revisión]
      summary: Bandeja de revisión de un mes de la DDRISS del usuario
      description: |
        Los establecimientos activos con `reporta_5c` de la DDRISS del usuario, cada uno con su reporte del mes si
        lo tiene, filtrados por `grupo` (los chips de la pantalla) y por municipio, con la forma paginada común
        y los `conteos` de cada grupo con el mes y el municipio elegidos (sin el filtro de `grupo`). Un mismo
        `WHERE` da el `total`, la página y los conteos.

        Orden: `enviadoEn` ascendente (los más antiguos primero), los que no tienen fecha de envío al final, y
        después por municipio y establecimiento.

        Grupos: `POR_ATENDER` (por defecto) = `ENVIADO` + `EN_REVISION`; `ASIGNADOS_A_MI` = `EN_REVISION` con el
        usuario como revisor; `EN_REVISION`, `ENVIADO`, `CORRECCION_SOLICITADA` y `APROBADO`, su estado;
        `SIN_ENVIAR` = sin reporte del mes o en `BORRADOR`; `CERRADO` = `CERRADO` + `RECTIFICACION`; `TODOS`.

        Un parámetro inválido, desconocido o repetido responde 400 `ENTRADA_INVALIDA`; un `periodoId` sin
        `cierre_periodo` de la DDRISS del usuario, 404; una página fuera de rango, 200 con `elementos` vacío.

        `cierre` resume el mes para cerrarlo (`POST /periodos/{id}/cerrar`) y no depende de `municipioId`, `grupo`
        ni la página.
      x-permiso: REPORTE_REVISAR
      parameters:
        - { name: periodoId, in: query, required: true, schema: { type: integer, minimum: 1, example: 10 } }
        - { name: municipioId, in: query, schema: { type: integer, minimum: 1, example: 9 } }
        - { name: grupo, in: query, schema: { $ref: "#/components/schemas/GrupoBandeja" } }
        - { $ref: "#/components/parameters/Pagina" }
        - { $ref: "#/components/parameters/PorPagina" }
      responses:
        "200":
          description: Página de la bandeja con los conteos de cada grupo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BandejaRevision" }
        "400":
          description: Un parámetro inválido, desconocido o repetido, o falta `periodoId`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                sinPeriodo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "periodoId es obligatorio." }
                grupo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "grupo no es válido." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404":
          description: El mes no tiene `cierre_periodo` de la DDRISS del usuario
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: NO_ENCONTRADO, mensaje: El recurso solicitado no existe. }

  /revision/revisores:
    get:
      tags: [Revisión]
      summary: Revisores activos de la DDRISS del usuario
      description: |
        Las cuentas activas, con empleado activo, del rol `REVISOR` de la DDRISS del usuario, ordenadas por nombre,
        para elegir a quién asignar un reporte. Sin parámetros: uno de consulta responde 400.
      x-permiso: REPORTE_REVISAR
      responses:
        "200":
          description: Los revisores
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RevisorResumen" }
        "400":
          description: Hay un parámetro de consulta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: ddrissId." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /revision/avance:
    get:
      tags: [Revisión]
      summary: Cuántos reportes de un mes hay en cada estado (avance del cierre)
      description: |
        Solo conteos, para el resumen del Inicio (SPEC 48). Cuenta los mismos establecimientos que
        `GET /revision/bandeja` (los activos con `reporta_5c` de la DDRISS, más los que tienen reporte del mes), con
        sus mismos grupos: `esperados` es el conteo de «Todos» y `CERRADO` incluye `RECTIFICACION`. No escribe
        nada ni deja bitácora.

        Sin `periodoId`, el mes que se está cerrando, según el `cierre_periodo` de la DDRISS: el más antiguo
        `EN_CIERRE`; si no hay, el más antiguo `ABIERTO`; si no hay, el último `CERRADO`. Si la DDRISS no tiene
        ninguno, responde 200 con `periodo: null`, `esperados: 0` y los conteos en 0.

        Con `periodoId`, ese mes; si no tiene `cierre_periodo` de la DDRISS, 404. Con `anio` y `mes` (SPEC 50),
        el mes del calendario con ese año y número, con la misma regla del 404: van juntos y no se combinan con
        `periodoId`, y existen porque la Autoridad no tiene `PERIODO_CONSULTAR` para traducir el mes a su id. Un
        parámetro inválido, desconocido o repetido responde 400 `ENTRADA_INVALIDA`. `ddrissId`, como en
        `GET /indicadores/resultados`.

        Con `desglose=municipio` (SPEC 50, el mapa territorial), la respuesta agrega `municipios`: los mismos
        conteos por el municipio del establecimiento (el lugar donde se reporta, no la procedencia de las dosis).
        Sin `desglose` no se hace esa consulta y la respuesta no trae `municipios`.
      x-permiso: REPORTE_AVANCE_CONSULTAR
      parameters:
        - { name: periodoId, in: query, schema: { type: integer, minimum: 1, example: 32 } }
        - { name: anio, in: query, description: Con `mes`; no se combina con `periodoId`, schema: { type: integer, minimum: 2000, maximum: 2100, example: 2026 } }
        - { name: mes, in: query, description: Con `anio`; no se combina con `periodoId`, schema: { type: integer, minimum: 1, maximum: 12, example: 9 } }
        - { name: desglose, in: query, description: Agrega los conteos por municipio, schema: { type: string, enum: [municipio] } }
        - { $ref: "#/components/parameters/DdrissIdAutoridad" }
      responses:
        "200":
          description: El mes elegido y sus conteos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvanceCierre" }
        "400":
          description: Un parámetro inválido, desconocido o repetido, o falta `ddrissId` (Autoridad nacional)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                periodo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "periodoId debe ser un número entero mayor o igual a 1." }
                desconocido:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: grupo." }
                combinado:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Use periodoId o anio y mes, no los dos." }
                incompleto:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "anio y mes van juntos." }
                desglose:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "desglose solo admite el valor municipio." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404":
          description: El mes no tiene `cierre_periodo` de la DDRISS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: NO_ENCONTRADO, mensaje: El recurso solicitado no existe. }

  /reportes/{id}/historial:
    get:
      tags: [Revisión]
      summary: Historial de estados del reporte
      description: |
        Los cambios de estado del reporte, del más antiguo al más reciente (a igual fecha, por id: la
        rectificación y el cierre del mes insertan filas en el mismo segundo). La primera fila es la creación
        (`estadoAnterior: null`).

        Las filas se escriben solo al crear el reporte, con `POST /reportes/{id}/transiciones`, al cerrar el mes
        (`POST /periodos/{id}/cerrar`) y al aplicar una rectificación; la API no tiene ninguna operación para
        modificarlas ni borrarlas, y la base impide el `UPDATE` (trigger del script `09`). El rol del usuario es
        el que tiene **hoy** su cuenta: la tabla no guarda el de ese momento.

        Uno que no existe o está fuera del alcance del usuario (para el Personal, de otro establecimiento; para el
        Revisor y el administrador, de otra DDRISS) responde 404.
      x-permiso: REPORTE_CONSULTAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Los cambios de estado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CambioEstadoReporte" }
              example:
                - id: 1520
                  estadoAnterior: null
                  estadoNuevo: BORRADOR
                  usuario:
                    id: 14
                    nombre: Ana Pérez
                    rol: { codigo: ESTABLECIMIENTO, nombre: Personal del establecimiento }
                  fecha: "2026-10-02T15:10:00.000Z"
                  comentario: null
                - id: 1534
                  estadoAnterior: BORRADOR
                  estadoNuevo: ENVIADO
                  usuario:
                    id: 14
                    nombre: Ana Pérez
                    rol: { codigo: ESTABLECIMIENTO, nombre: Personal del establecimiento }
                  fecha: "2026-10-05T21:42:00.000Z"
                  comentario: null
                - id: 1541
                  estadoAnterior: ENVIADO
                  estadoNuevo: EN_REVISION
                  usuario:
                    id: 2
                    nombre: María López
                    rol: { codigo: REVISOR, nombre: Estadígrafa / revisor DDRISS }
                  fecha: "2026-10-06T14:05:00.000Z"
                  comentario: null
        "400":
          description: El id no es válido o hay un parámetro de consulta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: estado." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /reportes/{id}/observaciones:
    get:
      tags: [Revisión]
      summary: Observaciones del revisor en las devoluciones del reporte
      description: |
        Las observaciones de todas las devoluciones (`CORRECCION_SOLICITADA`) del reporte: de la más reciente a
        la más antigua y, dentro de una misma devolución, la general primero y luego en el orden de las vacunas
        del reporte. Se escriben solo con `POST /reportes/{id}/transiciones` al devolver, y `atendida` y
        `atendidaEn` cambian solo al reenviar el reporte (`ENVIADO`), que marca todas las pendientes. Por eso las
        pendientes (`atendida: false`) son siempre las de la última devolución.

        Uno que no existe o está fuera del alcance del usuario (para el Personal, de otro establecimiento; para el
        Revisor, de otra DDRISS) responde 404. Un reporte sin observaciones responde una lista vacía.
      x-permiso: REPORTE_CONSULTAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Las observaciones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ObservacionRevision" }
        "400":
          description: El id no es válido o hay un parámetro de consulta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: vacunaId." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /periodos/{id}/cerrar:
    post:
      tags: [Revisión]
      summary: Cerrar un mes en cierre de la DDRISS del usuario y pasar sus reportes aprobados a Cerrado
      description: |
        Pasa el `cierre_periodo` de la DDRISS del usuario de `EN_CIERRE` a `CERRADO` (`cerrado_por`, `cerrado_en`)
        y cada reporte `APROBADO` del mes, de los establecimientos de esa DDRISS, a `CERRADO` (`cerrado_en`, sube
        `versionFila`), en una sola transacción. Es la única excepción a que el estado de un reporte solo cambie
        con `POST /reportes/{id}/transiciones`: igual revisa `APROBADO → CERRADO` en `transicion_estado` para el
        rol del usuario.

        El mes pasa solo de `ABIERTO` a `EN_CIERRE` el día después de su fecha límite de envío (una tarea del
        servidor, al arrancar y cada hora).

        No se cierra mientras algún reporte del mes siga en el ciclo: `ENVIADO`, `EN_REVISION`,
        `CORRECCION_SOLICITADA` o `BORRADOR` ya enviado alguna vez (devuelto). Un `BORRADOR` nunca enviado y un
        establecimiento sin reporte no lo impiden; el borrador queda como está y ya no se edita. Un mes sin reportes
        aprobados también se cierra (`reportesCerrados: 0`).

        Cada reporte deja una fila `APROBADO → CERRADO` en el historial (comentario «Cierre del periodo.») y una
        `CAMBIO_ESTADO` en la bitácora (módulo `REVISION`) con `{ estado: 'APROBADO' }` antes y
        `{ estado: 'CERRADO', cierrePeriodoId }` después; el mes deja una `ACTUALIZAR` (entidad `cierre_periodo`)
        con `{ estado: 'EN_CIERRE' }` antes y `{ estado: 'CERRADO', reportesCerrados }` después.

        Sin cuerpo: un cuerpo con campos responde 400.

        Después de confirmar el cierre calcula los indicadores del mes (una corrida `CIERRE_PERIODO` de la DDRISS,
        como `POST /indicadores/corridas`, con el usuario que cerró) y la respuesta la trae en `corrida`. Si el
        cálculo falla, el mes sigue cerrado y la corrida queda `FALLIDA`; se puede recalcular a mano.
      x-permiso: PERIODO_CERRAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Mes cerrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeriodoCerrado" }
        "400":
          description: El id no es válido o el cuerpo trae campos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: comentario." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404":
          description: El mes no existe o no tiene `cierre_periodo` de la DDRISS del usuario
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: NO_ENCONTRADO, mensaje: El periodo no existe. }
        "409":
          description: El mes sigue abierto, ya está cerrado o tiene reportes en el ciclo (con `faltanPorAprobar`)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Error" }
                  - type: object
                    properties:
                      faltanPorAprobar: { type: integer, minimum: 1, example: 3 }
              examples:
                abierto:
                  value:
                    error: { codigo: PERIODO_NO_EN_CIERRE, mensaje: "El mes sigue abierto: se cierra cuando vence su fecha límite." }
                cerrado:
                  value:
                    error: { codigo: PERIODO_YA_CERRADO, mensaje: El mes ya está cerrado. }
                pendientes:
                  value:
                    error: { codigo: PERIODO_CON_PENDIENTES, mensaje: Faltan 3 reportes por aprobar. }
                    faltanPorAprobar: 3
        "422":
          description: El rol del usuario no tiene la transición `APROBADO → CERRADO`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: TRANSICION_NO_PERMITIDA, mensaje: El reporte no puede pasar de Aprobado a Cerrado. }

  /reportes/{id}/rectificaciones:
    post:
      tags: [Revisión]
      summary: Solicitar la rectificación de un reporte CERRADO con la justificación y las cantidades nuevas
      description: |
        Crea una `solicitud_rectificacion` `PENDIENTE` y una fila de `rectificacion_detalle` por celda que cambia,
        en una transacción de MySQL, con una `CREAR` (módulo `RECTIFICACION`, entidad `solicitud_rectificacion`)
        que lleva el objeto completo: `reporteId`, `motivo`, `estado` y `cambios` con cada celda, su cantidad
        anterior y la nueva. El reporte **no cambia**: sigue `CERRADO` y su `versionFila` no sube. El revisor la
        aprueba (y la aplica) con `POST /rectificaciones/{id}/aprobar` o la rechaza con
        `POST /rectificaciones/{id}/rechazar`.

        La piden el Personal (reportes de su establecimiento) y el administrador (de los establecimientos de su
        DDRISS). Uno que no existe o está fuera del alcance responde 404.

        La cantidad anterior la lee el backend: la de `detalle_produccion` o 0 si la celda no existe (entonces
        `detalle_id` queda `NULL`). Cada celda debe ser válida para la versión del esquema fijada en
        `reporte_vacuna` y su procedencia debe estar permitida o tener filas en la vacuna, como al guardar
        (`PUT /reportes/{id}/vacunas/{vacunaId}`). Una celda con cantidad no se vacía: se escribe 0.

        Un reporte con una solicitud `PENDIENTE` no admite otra. Los campos adicionales no se rectifican, no se
        corren las reglas de validación y no se sube documento de respaldo (`evidencia_ruta` queda `NULL`).

        Los errores se revisan en este orden: cuerpo, reporte, estado del reporte, solicitud pendiente,
        `versionFila` y celdas.

        Control por establecimiento (SPEC 57): cuentan todas las solicitudes de los reportes del establecimiento
        cuyo `solicitadoEn` cae en el mismo mes calendario de Guatemala, en cualquier estado. Nunca bloquea: si
        con esta solicitud llegan a exactamente 5 (`umbral`), en la misma transacción se crea una fila en `alerta`
        (`tipo` `PROCESO`, `severidad` `ADVERTENCIA`, `rol_destino_id` del ADMINISTRADOR, con el establecimiento,
        su DDRISS y municipio, el periodo de ese mes si existe y este reporte) con su `CREAR` (entidad `alerta`)
        en la bitácora. La 6.ª y las siguientes del mes no crean otra.
      x-permiso: RECTIFICACION_SOLICITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SolicitudRectificacionNueva" }
            example:
              motivo: Faltó sumar la jornada de vacunación del 28 de agosto.
              versionFila: 14
              cambios:
                - { vacunaId: 3, dosisCodigo: D3, municipioProcedenciaId: 7, dimensiones: { grupo_edad: MENOR_1 }, cantidadNueva: 93 }
      responses:
        "201":
          description: Solicitud creada en estado `PENDIENTE`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SolicitudRectificacion" }
        "400":
          description: El id o el cuerpo no son válidos (motivo vacío o largo, `cambios` vacío, una celda repetida o un campo desconocido)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                motivo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: La justificación es obligatoria. }
                cambios:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: cambios debe tener entre 1 y 500 celdas. }
                repetida:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: Una celda está repetida en los cambios. }
                campo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: evidencia." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: El reporte no está cerrado, ya tiene una solicitud pendiente (con `solicitudId`) o cambió desde que se abrió
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Error" }
                  - type: object
                    properties:
                      solicitudId: { type: integer, description: Solo con `RECTIFICACION_PENDIENTE`, example: 4 }
              examples:
                noCerrado:
                  value:
                    error: { codigo: REPORTE_NO_CERRADO, mensaje: Solo se rectifican reportes cerrados. }
                pendiente:
                  value:
                    error: { codigo: RECTIFICACION_PENDIENTE, mensaje: El reporte ya tiene una solicitud de rectificación pendiente. }
                    solicitudId: 4
                desactualizado:
                  value:
                    error: { codigo: REPORTE_DESACTUALIZADO, mensaje: El reporte cambió desde que lo abrió; recárguelo. }
        "422":
          description: Una celda no es parte del formulario, usa una procedencia no permitida o no cambia la cantidad
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                vacuna:
                  value:
                    error: { codigo: CELDA_INVALIDA, mensaje: Una celda es de una vacuna que no está en el reporte. }
                celda:
                  value:
                    error: { codigo: CELDA_INVALIDA, mensaje: "La celda 3.ª dosis · < 1 año no es parte del formulario." }
                procedencia:
                  value:
                    error: { codigo: CELDA_INVALIDA, mensaje: "La celda 1.ª dosis · < 1 año tiene una procedencia que no se puede usar en esta vacuna." }
                sinDiferencia:
                  value:
                    error: { codigo: CAMBIO_SIN_DIFERENCIA, mensaje: "La celda 3.ª dosis · < 1 año ya tiene esa cantidad." }

  /reportes/{id}/rectificaciones/conteo-del-mes:
    get:
      tags: [Revisión]
      summary: Cuántas solicitudes de rectificación lleva el establecimiento del reporte en el mes actual
      description: |
        Cuenta las solicitudes de todos los reportes del establecimiento cuyo `solicitadoEn` cae en el mes
        calendario actual de Guatemala (UTC−6), en cualquier estado (también `RECHAZADA` y `APLICADA`). La
        pantalla «Nueva rectificación» lo pide antes de enviar para avisar desde la 5.ª; solo informa.

        No exige que el reporte esté `CERRADO`. Uno que no existe o está fuera del alcance responde 404.
      x-permiso: RECTIFICACION_SOLICITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: El conteo del mes actual
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConteoRectificacionesDelMes" }
        "400": { $ref: "#/components/responses/EntradaInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /rectificaciones:
    get:
      tags: [Revisión]
      summary: Listar las solicitudes de rectificación del alcance del usuario
      description: |
        El Personal ve las de los reportes de su establecimiento, y el administrador y el revisor las de su DDRISS. Ordenadas
        por fecha de solicitud, de la más reciente a la más antigua, con la forma paginada común. Un parámetro
        inválido, desconocido o repetido responde 400 `ENTRADA_INVALIDA`; una página fuera de rango responde 200
        con `elementos` vacío y el `total` real.
      x-permiso: RECTIFICACION_CONSULTAR
      parameters:
        - { name: estado, in: query, schema: { $ref: "#/components/schemas/EstadoRectificacion" } }
        - { $ref: "#/components/parameters/Pagina" }
        - { $ref: "#/components/parameters/PorPagina" }
      responses:
        "200":
          description: Página de solicitudes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginaRectificaciones" }
        "400":
          description: Un parámetro inválido, desconocido o repetido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                estado:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "estado debe ser PENDIENTE, AUTORIZADA, RECHAZADA o APLICADA." }
                desconocido:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: reporteId." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /rectificaciones/{id}:
    get:
      tags: [Revisión]
      summary: Detalle de una solicitud de rectificación con el valor anterior y el nuevo de cada celda
      description: |
        Las etiquetas de la dosis y de las dimensiones salen de la versión del esquema fijada en `reporte_vacuna`,
        incluidas las inactivas. Los cambios van en el orden de las vacunas del reporte, la dosis, la procedencia
        y la combinación. Una que no existe o está fuera del alcance del usuario responde 404.

        Una `PENDIENTE` trae además `totales`: las vacunas con cambios cuyo campo adicional
        `total_dosis_declarado` (el que compara la regla `TOTAL_CUADRA`) ya no cuadraría con la suma de sus celdas
        después de aplicar. Solo informa; no impide aprobar.
      x-permiso: RECTIFICACION_CONSULTAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: La solicitud
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SolicitudRectificacion" }
        "400": { $ref: "#/components/responses/EntradaInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /rectificaciones/{id}/aprobar:
    post:
      tags: [Revisión]
      summary: Aprobar una solicitud PENDIENTE y aplicar sus cambios al reporte
      description: |
        Lo hace cualquier revisor de la DDRISS del reporte. En una transacción de MySQL:

        - el reporte pasa de `CERRADO` a `RECTIFICACION` y de vuelta a `CERRADO`, con las dos transiciones
          revisadas en `transicion_estado` para el rol y una fila de `historial_estado_reporte` por cada una (los
          comentarios los arma el backend con el número de rectificación y, en la primera, el comentario del
          revisor si lo hay);
        - cada celda de la solicitud toma su cantidad nueva: se actualiza la de `detalle_produccion` o se crea con
          su `detalle_dimension` si no existía. Cada celda se busca por su vacuna, dosis, procedencia y
          combinación, y su cantidad actual (0 si no existe) debe seguir siendo la anterior guardada en la
          solicitud; si no, no se aplica nada. El `total_declarado` de cada vacuna que cambia pasa a ser la suma
          nueva de sus celdas, como al guardar;
        - `numero_rectificacion` y `version_fila` del reporte suben 1 (`cerrado_en` no cambia);
        - la solicitud pasa directo a `APLICADA`, con `resuelto_por`, `comentario_resolucion`, `resuelto_en` y
          `aplicado_en`.

        Bitácora (módulo `RECTIFICACION`): una `APLICAR_RECTIFICACION` sobre `solicitud_rectificacion` con el
        estado anterior y el nuevo, el comentario, el número de rectificación y, por celda, la cantidad anterior y
        la nueva; y una `CAMBIO_ESTADO` sobre `reporte_produccion` por cada transición. No se corren las reglas de
        validación.

        Después de confirmar recalcula los indicadores: una corrida `RECTIFICACION` de la DDRISS del reporte por el
        mes del reporte y por cada mes `CERRADO` siguiente del mismo año (el acumulado también cambia), en orden y
        con el usuario que aprobó; la respuesta las trae en `corridas`. Si una falla, queda `FALLIDA` y la
        rectificación sigue aplicada.

        Los errores se revisan en este orden: cuerpo, solicitud y alcance, estado de la solicitud, estado del
        reporte, detalle, transiciones y celdas.
      x-permiso: RECTIFICACION_RESOLVER
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolucionRectificacionAprobar" }
            example:
              comentario: Se verificó con el libro de vacunación.
      responses:
        "200":
          description: Solicitud `APLICADA`, reporte rectificado y las corridas de indicadores
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SolicitudRectificacionAplicada" }
        "400":
          description: El id o el cuerpo no son válidos (comentario de más de 500 caracteres o un campo desconocido)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                comentario:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El comentario no puede tener más de 500 caracteres. }
                campo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: motivo." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: La solicitud ya fue resuelta, el reporte no está cerrado o una celda ya no tiene la cantidad anterior
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                resuelta:
                  value:
                    error: { codigo: RECTIFICACION_RESUELTA, mensaje: La solicitud ya fue resuelta. }
                noCerrado:
                  value:
                    error: { codigo: REPORTE_NO_CERRADO, mensaje: Solo se rectifican reportes cerrados. }
                desactualizada:
                  value:
                    error: { codigo: RECTIFICACION_DESACTUALIZADA, mensaje: Los datos del reporte cambiaron desde la solicitud; rechácela y pida otra. }
        "422":
          description: La solicitud no tiene cambios (datos anteriores al SPEC 40) o el rol no tiene las transiciones
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                sinCambios:
                  value:
                    error: { codigo: RECTIFICACION_SIN_CAMBIOS, mensaje: La solicitud no tiene cambios que aplicar. }
                noPermitida:
                  value:
                    error: { codigo: TRANSICION_NO_PERMITIDA, mensaje: El reporte no puede pasar de Cerrado a Rectificación. }

  /rectificaciones/{id}/rechazar:
    post:
      tags: [Revisión]
      summary: Rechazar una solicitud PENDIENTE con un motivo; el reporte no cambia
      description: |
        Lo hace cualquier revisor de la DDRISS del reporte. La solicitud pasa a `RECHAZADA` con `resuelto_por`,
        `comentario_resolucion` (el motivo) y `resuelto_en`; el reporte y sus celdas no cambian, y el estado del
        reporte no se revisa (también se rechaza una solicitud sin detalle). Bitácora: una
        `RECHAZAR_RECTIFICACION` (módulo `RECTIFICACION`) sobre `solicitud_rectificacion` con el estado anterior y
        el nuevo, y el motivo.

        Los errores se revisan en este orden: cuerpo, solicitud y alcance, y estado de la solicitud.
      x-permiso: RECTIFICACION_RESOLVER
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolucionRectificacionRechazar" }
            example:
              comentario: El libro de vacunación no muestra esas dosis.
      responses:
        "200":
          description: Solicitud `RECHAZADA`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SolicitudRectificacion" }
        "400":
          description: El id o el cuerpo no son válidos (sin motivo, de más de 500 caracteres o un campo desconocido)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                comentario:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El motivo del rechazo es obligatorio. }
                campo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: motivo." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: La solicitud ya fue resuelta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: RECTIFICACION_RESUELTA, mensaje: La solicitud ya fue resuelta. }

  # ---------------------------------------------------------------- Indicadores
  /indicadores/corridas:
    post:
      tags: [Indicadores]
      summary: Calcular los indicadores de la DDRISS del usuario con corte a un mes
      description: |
        Crea una `corrida_calculo` (motivo `MANUAL`) de la DDRISS del usuario y la calcula en el momento: la respuesta
        trae la corrida ya `COMPLETADA`. Calcula cada indicador que aplica a la DDRISS al iniciar (su `VIGENTE`
        antes que la nacional del mismo código, SPEC 43) cuyo tipo tenga cálculo; hoy `COBERTURA`,
        `AVANCE_META_MES` y `BRECHA` (SPEC 45), que se calculan con las mismas fórmulas, cada uno con el prorrateo
        y la meta de su versión, `DESERCION` (SPEC 46) y `PROYECCION` (SPEC 47). Los indicadores cuya vacuna,
        dosis o grupo de población ya no existen, y las proyecciones que no se pueden calcular (ver abajo), quedan
        en `omitidos` con su motivo, sin hacer fallar la corrida.

        Por cada indicador deja una fila por municipio (los activos del departamento sede de la DDRISS, sin el
        `9999`) y una departamental (`municipio: null`):

        - **numerador**: dosis de la vacuna y la dosis del indicador en reportes `CERRADO` de establecimientos de
          la DDRISS, de enero al mes de corte, atribuidas al municipio de **procedencia** del mismo departamento
          (Migrantes y otros departamentos no cuentan; el Hospital de San Marcos, `solo_cobertura`, sí), con el
          filtro de `grupo_edad` del indicador si lo tiene;
        - **denominador**: la población del municipio, el año y el grupo del indicador; con prorrateo
          `MENSUAL_LINEAL`, población ÷ 12 × mes de corte (la meta del mes);
        - **valor**: numerador ÷ denominador × 100; **brechaDosis**: máx(0, ⌈meta ÷ 100 × denominador −
          numerador⌉); **cumpleMeta**: el valor comparado con la meta según el comparador del indicador.

        Un municipio sin población deja la fila con el numerador y lo demás en `null` (`calculable: false`); la
        fila departamental tampoco se calcula si a algún municipio le falta la población.

        `DESERCION` no usa la población. Con las dosis inicial y final del indicador, acumuladas con la misma regla
        y el mismo filtro de dimensiones: **numerador** = inicial − final (negativo si se aplicaron más finales que
        iniciales), **denominador** = inicial, **valor** = numerador ÷ denominador × 100, **brechaDosis** `null`,
        **dosis** = la dosis final, y **cumpleMeta** con la meta y el comparador (`<=`) del indicador. Sin dosis
        iniciales, la fila queda con el valor, la meta y `cumpleMeta` en `null` (`calculable: false`). La
        departamental suma las iniciales y las finales de los municipios.

        `PROYECCION` estima la cobertura a diciembre y sus filas llevan `esProyeccion: true`. Usa el indicador de
        `parametros.indicador_base` que calcula la misma corrida (de tipo `COBERTURA`, `AVANCE_META_MES` o
        `BRECHA`): de él salen la vacuna, la dosis, el filtro de dimensiones y el grupo de población. El ritmo es
        el promedio de las dosis de los últimos `parametros.meses_ventana` meses que estaban `CERRADO` en la DDRISS
        al calcular (un mes sin cerrar no entra; si hay menos, se usan los que haya). **numerador** = dosis
        acumuladas + ritmo × (12 − mes de corte); **denominador** = la población anual, sin prorrateo; **valor**,
        **brechaDosis** y **cumpleMeta** como en la cobertura, con la meta de la proyección. Sin meses cerrados en
        la ventana, la fila queda con la población y lo demás en `null` (`calculable: false`). Se omite con su
        motivo si la base no aplica a la DDRISS, si es de otro tipo, si la base se omitió, si `metodo` no es
        `PROMEDIO_MOVIL` u `horizonte` no es `FIN_DE_ANIO`, o si `meses_ventana` no es un entero de 1 a 12.

        El mes de corte puede ser cualquier mes del calendario de periodos: si algún mes de enero al corte no
        estaba cerrado en la DDRISS al calcular, la corrida es `parcial` (solo cuentan los reportes ya cerrados).
        La corrida nueva pasa a ser la vigente de su DDRISS, año y mes, y la anterior deja de serlo.

        Todo va en una transacción de MySQL. Si el cálculo falla, no queda nada escrito salvo una corrida
        `FALLIDA` sin resultados, y responde 500. Bitácora: `CALCULAR_INDICADORES` (módulo `INDICADORES`,
        entidad `corrida_calculo`) con la DDRISS, el corte, el motivo, el estado, `parcial`, los indicadores
        calculados con su versión, los omitidos y el número de resultados (o el error en una `FALLIDA`).

        También se calcula sin este endpoint: al cerrar el mes (`POST /periodos/{id}/cerrar`, motivo
        `CIERRE_PERIODO`) y al aplicar una rectificación (`POST /rectificaciones/{id}/aprobar`, motivo
        `RECTIFICACION`, para el mes del reporte y cada mes cerrado siguiente del año).
      x-permiso: INDICADOR_CALCULAR
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorridaNueva" }
            example: { anio: 2026, mesHasta: 8 }
      responses:
        "201":
          description: Corrida `COMPLETADA` y vigente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Corrida" }
        "400":
          description: El cuerpo no es válido (campo desconocido, año fuera de 2000 a 2100 o mes fuera de 1 a 12)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                campo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: motivo." }
                mes:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El mes de corte debe ser un número de 1 a 12. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403":
          description: El usuario no tiene el permiso o no tiene DDRISS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: SIN_PERMISO, mensaje: No tiene permiso para realizar esta acción. }
        "422":
          description: El mes no está en el calendario de periodos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: CORRIDA_INVALIDA, mensaje: El mes 8 de 2031 no está en el calendario. }
        "500":
          description: El cálculo falló; queda una corrida `FALLIDA` sin resultados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ERROR_INTERNO, mensaje: Ocurrió un error interno. Intente de nuevo. }
    get:
      tags: [Indicadores]
      summary: Corridas de una DDRISS en un año, de la más reciente a la más antigua
      description: |
        Las corridas de la DDRISS del usuario. La Autoridad sin DDRISS (nacional) elige la DDRISS con `ddrissId`,
        que para ella es obligatorio; para los demás roles, `ddrissId` responde 400.
      x-permiso: INDICADOR_CONSULTAR
      parameters:
        - { name: anio, in: query, required: true, schema: { type: integer, minimum: 2000, maximum: 2100, example: 2026 } }
        - { name: mesHasta, in: query, schema: { type: integer, minimum: 1, maximum: 12, example: 8 } }
        - { $ref: "#/components/parameters/DdrissIdAutoridad" }
        - { $ref: "#/components/parameters/Pagina" }
        - { $ref: "#/components/parameters/PorPagina" }
      responses:
        "200":
          description: Página de corridas (sin `resultados`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginaCorridas" }
        "400":
          description: Un parámetro falta, no es válido, es desconocido o está repetido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: ddrissId." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /indicadores/corridas/{id}:
    get:
      tags: [Indicadores]
      summary: Una corrida con todos sus resultados
      x-permiso: INDICADOR_CONSULTAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: La corrida y sus resultados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorridaConResultados" }
        "400": { $ref: "#/components/responses/EntradaInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /indicadores/resultados:
    get:
      tags: [Indicadores]
      summary: Resultados de la corrida vigente de una DDRISS, un año y un mes
      description: |
        Lee la corrida vigente (la última `COMPLETADA`) de la DDRISS, el año y el mes. Sin corrida responde 200
        con `corrida: null` y `resultados` vacío. La fila departamental va primero y luego los municipios por
        nombre. `ddrissId`, como en `GET /indicadores/corridas`.

        `metaDosis`, `excedenteDosis` y `sumaBrechasMunicipales` no se guardan: se calculan al leer (SPEC 45).
        Con `municipioId` la respuesta no trae la fila departamental, así que tampoco `sumaBrechasMunicipales`.

        `proyeccion` (SPEC 47) tampoco se guarda: en las filas `PROYECCION` se arma al leer con los `parametros` de
        la versión usada, los meses cerrados al iniciar la corrida y la fila del indicador base del mismo
        municipio en la misma corrida, aunque la consulta filtre por `indicador` o por `municipioId`.

        Con `redId` (SPEC 60), además de lo de siempre, cada indicador `COBERTURA`, `AVANCE_META_MES`, `BRECHA` o
        `DESERCION` trae una fila «Total de la red», justo después de su fila departamental, con `red: { id, nombre }`
        y `municipio: null`. No se guarda: se calcula al leer con los municipios **actuales** de la red que están en
        la corrida, sumando sus numeradores y sus denominadores guardados (en `DESERCION`, las pérdidas y las dosis
        iniciales), con la meta, el comparador y el semáforo de la versión usada, como la fila departamental. Si
        a un municipio de la red le falta el denominador, la fila no es calculable. `sumaBrechasMunicipales`
        suma solo los municipios de la red. `PROYECCION` no tiene fila de la red. La red debe estar activa y ser
        de la DDRISS de la consulta (404 si no); `redId` no se combina con `municipioId` (400).
      x-permiso: INDICADOR_CONSULTAR
      parameters:
        - { name: anio, in: query, required: true, schema: { type: integer, minimum: 2000, maximum: 2100, example: 2026 } }
        - { name: mes, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 12, example: 8 } }
        - { name: indicador, in: query, schema: { type: string, pattern: "^[A-Z0-9_]{1,40}$", example: AVANCE_HEXA3 } }
        - { name: municipioId, in: query, schema: { type: integer, example: 1 } }
        - name: redId
          in: query
          description: Agrega la fila «Total de la red» de cada indicador (SPEC 60); no se combina con `municipioId`
          schema: { type: integer, minimum: 1, example: 1 }
        - { $ref: "#/components/parameters/DdrissIdAutoridad" }
      responses:
        "200":
          description: La corrida vigente y sus resultados filtrados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResultadosVigentes" }
        "400":
          description: Un parámetro falta, no es válido, es desconocido o está repetido, o vienen `redId` y `municipioId`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: El mes debe ser un número de 1 a 12. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404":
          description: La red no existe, está inactiva o es de otra DDRISS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: NO_ENCONTRADO, mensaje: La red no existe. }

  /indicadores/serie:
    get:
      tags: [Indicadores]
      summary: Serie mensual de un indicador en las corridas vigentes de un año (SPEC 49)
      description: |
        Por cada mes del año con una corrida vigente `COMPLETADA` de la DDRISS (la misma que lee
        `GET /indicadores/resultados`), la fila del indicador: la departamental sin `municipioId`, o la del municipio
        pedido. Cada `resultado` trae los mismos campos que en `/indicadores/resultados`, calculados al leer
        (`metaDosis`, `excedenteDosis`, `proyeccion`…). Un mes sin corrida vigente, o cuya corrida no tiene ese
        indicador, no aparece; los puntos van de enero a diciembre y `puntos` es vacío si no hay ninguno.

        `parcial` sigue la regla de la corrida (algún mes de enero al corte sin cerrar al empezarla). Es una
        lectura: no deja bitácora. `ddrissId`, como en `GET /indicadores/corridas`.

        `poblacionAnual` (SPEC 51) es la población del año del grupo de la versión del indicador
        (`aplica_a[0].clasificacion_poblacion`), sin prorrateo: la de los municipios de la DDRISS sin `municipioId`,
        o la del municipio pedido. Es `null` si el indicador no tiene grupo de población (`DESERCION`) o si el año
        no tiene esa población. Sirve para comparar la cobertura real entre años (dosis acumuladas ÷ población anual).
      x-permiso: INDICADOR_CONSULTAR
      parameters:
        - { name: anio, in: query, required: true, schema: { type: integer, minimum: 2000, maximum: 2100, example: 2026 } }
        - { name: indicador, in: query, required: true, schema: { type: string, pattern: "^[A-Z0-9_]{1,40}$", example: COB_HEXA3 } }
        - { name: municipioId, in: query, schema: { type: integer, example: 1 } }
        - { $ref: "#/components/parameters/DdrissIdAutoridad" }
      responses:
        "200":
          description: Un punto por mes con corrida vigente que tiene el indicador
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SerieIndicador" }
        "400":
          description: Un parámetro falta, no es válido, es desconocido o está repetido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: El indicador es obligatorio. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /indicadores/meses-calculados:
    get:
      tags: [Indicadores]
      summary: Años y meses con una corrida vigente de la DDRISS (SPEC 51)
      description: |
        Los años con al menos una corrida vigente `COMPLETADA` de la DDRISS, del más reciente al más antiguo, y sus
        meses de corte en orden. No dice qué indicadores tiene cada corrida. Lo usa «Comparar periodos» de
        «Indicadores» para ofrecer solo los años y meses que tienen cálculo. Es una lectura: no deja bitácora.
        `ddrissId`, como en `GET /indicadores/corridas`.
      x-permiso: INDICADOR_CONSULTAR
      parameters:
        - { $ref: "#/components/parameters/DdrissIdAutoridad" }
      responses:
        "200":
          description: Los años con corridas vigentes y sus meses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MesesCalculados" }
        "400":
          description: Un parámetro no es válido, es desconocido o está repetido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: anio." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  # ---------------------------------------------------------------- Alertas y auditoría
  /alertas:
    get:
      tags: [Alertas y auditoría]
      summary: Alertas activas para el rol y alcance del usuario
      parameters:
        - { name: estado, in: query, schema: { type: string, enum: [ACTIVA, ATENDIDA, DESCARTADA] } }
      responses:
        "200": { description: Lista de alertas }

  /auditoria/bitacora:
    get:
      tags: [Alertas y auditoría]
      summary: Consultar la bitácora (solo lectura; no existe endpoint para modificarla)
      parameters:
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: usuarioId, in: query, schema: { type: integer } }
        - { name: modulo, in: query, schema: { type: string } }
        - { name: accion, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Pagina" }
        - { $ref: "#/components/parameters/PorPagina" }
      responses:
        "200": { description: Lista paginada de registros de bitácora }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieRefresh:
      type: apiKey
      in: cookie
      name: sircova_refresh
      description: Refresh token de la sesión. La pone el login; solo viaja a `/api/v1/auth`.

  headers:
    CookieRefresh:
      description: |
        `sircova_refresh=<token>; Max-Age=<segundos hasta el fin de la jornada + 3600>; Path=/api/v1/auth;
        HttpOnly; Secure; SameSite=Strict`

        La cookie dura 1 h más que la jornada: así, al terminar, `POST /auth/refrescar` todavía la recibe y
        responde 401 `JORNADA_TERMINADA` (y la borra) en lugar de `NO_AUTENTICADO`. La sesión no dura más.
      schema: { type: string }
    CookieRefreshBorrada:
      description: '`sircova_refresh=; Max-Age=0; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Strict`'
      schema: { type: string }

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    DosisId:
      name: dosisId
      in: path
      required: true
      schema: { type: integer }
    CodigoDimension:
      name: codigo
      in: path
      required: true
      description: Código de la dimensión en `catalogo_dimensiones`
      schema: { type: string, example: grupo_edad }
    CodigoValor:
      name: valor
      in: path
      required: true
      description: Código del valor dentro de la dimensión
      schema: { type: string, example: MENOR_1 }
    IdEsquema:
      name: id
      in: path
      required: true
      description: ObjectId del esquema en `esquemas_captura`; uno inválido responde 404
      schema: { type: string, example: 66f8a1c2e4b0a1b2c3d4e5f6 }
    CodigoRegla:
      name: codigo
      in: path
      required: true
      description: |
        Código de la regla en `reglas_validacion`: mayúsculas, dígitos y guion bajo, hasta 40 caracteres. Uno
        con otro formato, inexistente o no visible para la DDRISS del usuario responde 404
      schema: { type: string, pattern: "^[A-Z0-9_]{1,40}$", example: VARIACION_HISTORICA }
    CodigoIndicador:
      name: codigo
      in: path
      required: true
      description: |
        Código del indicador en `configuracion_indicadores`: mayúsculas, dígitos y guion bajo, hasta 40
        caracteres. Uno con otro formato, inexistente o no visible para la DDRISS del usuario responde 404
      schema: { type: string, pattern: "^[A-Z0-9_]{1,40}$", example: COB_HEXA3 }
    Pagina:
      name: pagina
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    PorPagina:
      name: porPagina
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
    DdrissIdAutoridad:
      name: ddrissId
      in: query
      description: |
        Solo la Autoridad sin DDRISS (nacional), para la que es obligatorio. Los demás roles consultan su DDRISS y
        este parámetro les responde 400
      schema: { type: integer, example: 1 }

  responses:
    EntradaInvalida:
      description: La solicitud no cumple el formato esperado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CodificacionNoAdmitida:
      description: El cuerpo llegó comprimido (`Content-Encoding` distinto de `identity`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { codigo: CODIFICACION_NO_ADMITIDA, mensaje: El servidor no acepta cuerpos comprimidos. }
    CuerpoDemasiadoGrande:
      description: El cuerpo pasa de 1 MB
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { codigo: CUERPO_DEMASIADO_GRANDE, mensaje: El cuerpo de la solicitud es demasiado grande. }
    NoAutenticado:
      description: |
        Falta el token, no es válido, no tiene `sid`, o su cuenta o su sesión no existen (NO_AUTENTICADO);
        el token venció (SESION_VENCIDA); la cuenta o su empleado están desactivados (CUENTA_DESACTIVADA);
        el rol, el establecimiento o el municipio cambiaron desde que se emitió el token (SESION_DESACTUALIZADA);
        se inició sesión con la cuenta en otro equipo (SESION_REEMPLAZADA); se cerró la sesión (SESION_CERRADA);
        el administrador restableció la contraseña (CONTRASENA_RESTABLECIDA); la sesión no tuvo peticiones
        durante `SESION_INACTIVIDAD` (SESION_INACTIVA), o terminó la jornada (JORNADA_TERMINADA)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            noAutenticado:
              value:
                error: { codigo: NO_AUTENTICADO, mensaje: Debe iniciar sesión. }
            sesionVencida:
              value:
                error: { codigo: SESION_VENCIDA, mensaje: Su sesión venció; inicie sesión de nuevo. }
            cuentaDesactivada:
              value:
                error: { codigo: CUENTA_DESACTIVADA, mensaje: Su cuenta está desactivada; contacte al administrador. }
            sesionDesactualizada:
              value:
                error: { codigo: SESION_DESACTUALIZADA, mensaje: Sus datos de acceso cambiaron; inicie sesión de nuevo. }
            sesionReemplazada:
              value:
                error: { codigo: SESION_REEMPLAZADA, mensaje: Se inició sesión con su cuenta en otro equipo. Inicie sesión de nuevo para continuar aquí. }
            sesionCerrada:
              value:
                error: { codigo: SESION_CERRADA, mensaje: Su sesión se cerró; inicie sesión de nuevo. }
            contrasenaRestablecida:
              value:
                error: { codigo: CONTRASENA_RESTABLECIDA, mensaje: Su contraseña fue restablecida. Inicie sesión con la contraseña temporal que le dé su administrador. }
            sesionInactiva:
              value:
                error: { codigo: SESION_INACTIVA, mensaje: Su sesión se cerró por inactividad. Inicie sesión de nuevo. }
            jornadaTerminada:
              value:
                error: { codigo: JORNADA_TERMINADA, mensaje: Su jornada de 8 horas terminó; inicie sesión de nuevo. }
    SinPermiso:
      description: El usuario no tiene el permiso de la operación, o su rol es de solo consulta
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { codigo: SIN_PERMISO, mensaje: No tiene permiso para realizar esta acción. }
    CambioContrasenaRequerido:
      description: |
        La cuenta debe cambiar su contraseña (por ejemplo, la temporal) antes de usar este endpoint.
        Lo responde cualquier endpoint protegido salvo `POST /auth/contrasena`, `POST /auth/logout` y `GET /auth/yo`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { codigo: CAMBIO_CONTRASENA_REQUERIDO, mensaje: Debe cambiar su contraseña temporal antes de continuar. }
    NoEncontrado:
      description: No existe o está fuera del alcance del usuario
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { codigo: NO_ENCONTRADO, mensaje: El recurso solicitado no existe. }
    DistritoNoEncontrado:
      description: El distrito no existe o es de otra DDRISS
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { codigo: NO_ENCONTRADO, mensaje: El distrito de salud no existe. }
    RedNoEncontrada:
      description: La red no existe o es de otra DDRISS
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { codigo: NO_ENCONTRADO, mensaje: La red no existe. }
    RedEntradaInvalida:
      description: Nombre inválido, lista vacía, repetida o con ids que no son enteros positivos, cuerpo sin campos, o campo no permitido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            nombre:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: El nombre de la red debe tener entre 3 y 120 caracteres. }
            sinMunicipios:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: La red debe tener al menos un municipio. }
            sinTrazadoras:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: La red debe tener al menos una trazadora. }
            codigo:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: codigo no se puede cambiar. }
            campo:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: activo." }
    RedConflicto:
      description: Nombre repetido en la DDRISS, municipio que ya está en otra red, o estado de la red que no lo permite
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            duplicada:
              value:
                error: { codigo: RED_DUPLICADA, mensaje: Ya hay una red con ese nombre en la DDRISS. }
            municipio:
              value:
                error: { codigo: MUNICIPIO_EN_OTRA_RED, mensaje: Tacaná ya pertenece a la Red No. 2. }
            inactiva:
              value:
                error: { codigo: RED_INACTIVA, mensaje: La red está inactiva; reactívela con sus municipios. }
            activa:
              value:
                error: { codigo: RED_ACTIVA, mensaje: La red ya está activa. }
    RedInvalida:
      description: Un municipio que no existe, inactivo, de otro departamento o el `9999`, o una dosis nueva que no existe o está inactiva
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            municipio:
              value:
                error: { codigo: MUNICIPIO_INVALIDO, mensaje: El municipio no existe, está inactivo o no es del departamento de su DDRISS. }
            dosis:
              value:
                error: { codigo: DOSIS_INVALIDA, mensaje: La dosis no existe, está inactiva o es de una vacuna inactiva. }
    EstablecimientoNoEncontrado:
      description: El establecimiento no existe o es de otra DDRISS
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { codigo: NO_ENCONTRADO, mensaje: El establecimiento no existe. }
    VacunaNoEncontrada:
      description: La vacuna no existe
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { codigo: NO_ENCONTRADO, mensaje: La vacuna no existe. }
    VacunaODosisNoEncontrada:
      description: La vacuna no existe, o la dosis no existe o es de otra vacuna
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            vacuna:
              value:
                error: { codigo: NO_ENCONTRADO, mensaje: La vacuna no existe. }
            dosis:
              value:
                error: { codigo: NO_ENCONTRADO, mensaje: La dosis no existe. }
    DosisDuplicada:
      description: La vacuna ya tiene una dosis con ese nombre
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { codigo: DOSIS_DUPLICADA, mensaje: La vacuna ya tiene una dosis con ese nombre. }
    SecuenciaInvalida:
      description: La secuencia de dosis no cumple las reglas del tipo
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            unica:
              value:
                error: { codigo: SECUENCIA_INVALIDA, mensaje: Una vacuna con dosis única no lleva otras dosis, solo refuerzos. }
            refuerzo:
              value:
                error: { codigo: SECUENCIA_INVALIDA, mensaje: Los refuerzos van después de las dosis. }
    PeriodoNoEncontrado:
      description: El mes no existe en el calendario
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { codigo: NO_ENCONTRADO, mensaje: El periodo no existe. }
    AnioSinPeriodos:
      description: El año no tiene meses en el calendario de periodos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { codigo: ANIO_SIN_PERIODOS, mensaje: El año 2019 no está en el calendario de periodos. }
    FechaLimiteInvalidaFormato:
      description: Falta la fecha, no es una fecha AAAA-MM-DD válida, o hay un campo no permitido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            fecha:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: fechaLimiteEnvio debe ser una fecha AAAA-MM-DD. }
            campo:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: estado." }
    FechaLimiteInvalida:
      description: La fecha límite es igual o anterior al fin del mes
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { codigo: FECHA_LIMITE_INVALIDA, mensaje: La fecha límite debe ser posterior al 2026-10-31. }
    EsquemaEntradaInvalida:
      description: Campo faltante, de tipo inválido o no permitido, código repetido, modo inválido o título inválido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            campo:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: reglas." }
            dosisRepetida:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: La dosis D1 está repetida. }
            dimensionRepetida:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: La dimensión grupo_edad está repetida. }
            valorRepetido:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: El valor MENOR_1 de grupo_edad está repetido. }
            modo:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: El modo de procedencia debe ser MUNICIPIO_DETALLADO o PROPIO_Y_OTROS. }
            titulo:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: El título de la sección debe tener entre 1 y 60 caracteres. }
    EsquemaInvalido:
      description: |
        El esquema incumple una regla de coherencia. Se revisan en este orden y se responde con el primer
        problema: vacuna activa; dosis activas de la vacuna; dimensiones y valores activos del catálogo
        (general y por dosis); `grupo_edad` en la desagregación de cada dosis si y solo si la vacuna desagrega
        por edad; secciones (al menos una, dosis del esquema, cada dosis en alguna, un grupo de edad distinto
        por sección y permitido por sus dosis, o una sola sección sin grupo de edad); y que la combinación más
        larga de cada dosis quepa en los 255 caracteres de `clave_combinacion`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            vacunaInactiva:
              value:
                error: { codigo: ESQUEMA_INVALIDO, mensaje: La vacuna está inactiva; no admite esquemas nuevos. }
            sinDosis:
              value:
                error: { codigo: ESQUEMA_INVALIDO, mensaje: Indique al menos una dosis. }
            dosis:
              value:
                error: { codigo: ESQUEMA_INVALIDO, mensaje: La dosis R3 no es una dosis activa de HEXA. }
            dimension:
              value:
                error: { codigo: ESQUEMA_INVALIDO, mensaje: La dimensión pueblo no existe o está inactiva. }
            valor:
              value:
                error: { codigo: ESQUEMA_INVALIDO, mensaje: El valor 2_4 de grupo_edad no existe o está inactivo. }
            grupoEdadDosis:
              value:
                error: { codigo: ESQUEMA_INVALIDO, mensaje: La dosis R1 debe desagregarse por grupo de edad, como la vacuna. }
            dosisConEdad:
              value:
                error: { codigo: ESQUEMA_INVALIDO, mensaje: La dosis D1 no se desagrega por grupo de edad, porque la vacuna no lo hace. }
            sinSecciones:
              value:
                error: { codigo: ESQUEMA_INVALIDO, mensaje: Indique al menos una sección. }
            dosisAjena:
              value:
                error: { codigo: ESQUEMA_INVALIDO, mensaje: La sección < 1 año usa la dosis D2, que no está en el esquema. }
            dosisSinSeccion:
              value:
                error: { codigo: ESQUEMA_INVALIDO, mensaje: La dosis D3 no aparece en ninguna sección. }
            seccionSinGrupo:
              value:
                error: { codigo: ESQUEMA_INVALIDO, mensaje: La sección < 1 año necesita un grupo de edad. }
            grupoRepetido:
              value:
                error: { codigo: ESQUEMA_INVALIDO, mensaje: Dos secciones usan el grupo de edad MENOR_1. }
            grupoNoPermitido:
              value:
                error: { codigo: ESQUEMA_INVALIDO, mensaje: La dosis R1 no admite el grupo de edad MENOR_1 de la sección < 1 año. }
            unaSeccion:
              value:
                error: { codigo: ESQUEMA_INVALIDO, mensaje: Sin desagregación por grupo de edad, el esquema lleva una sola sección. }
            seccionConGrupo:
              value:
                error: { codigo: ESQUEMA_INVALIDO, mensaje: La sección General no lleva grupo de edad, porque la vacuna no se desagrega por edad. }
            combinacion:
              value:
                error: { codigo: ESQUEMA_INVALIDO, mensaje: La combinación de la dosis D1 supera los 255 caracteres. }
    EsquemaNoEditable:
      description: El esquema no es un borrador de la DDRISS del usuario (es nacional, vigente o histórico)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { codigo: ESQUEMA_NO_EDITABLE, mensaje: Solo se edita un borrador de su DDRISS; para cambiar un esquema publicado, cree un borrador nuevo. }
    ReglaEntradaInvalida:
      description: |
        El cuerpo de una regla no cumple el formato: campo faltante o no permitido, tipo que no se crea, severidad,
        vacunas o parámetros mal formados, marcador desconocido en el mensaje, o nombre, descripción, mensaje o
        motivo inválidos. Los parámetros y marcadores de cada tipo están en `ReglaValidacion`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            campo:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: codigo." }
            tipo:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: Solo se crean reglas de tipo RANGO, SECUENCIA_DOSIS, VARIACION_HISTORICA o TOTAL_CUADRA. }
            severidad:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: La severidad debe ser ERROR o ADVERTENCIA. }
            vacunas:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Indique * para todas las vacunas, o una lista de códigos sin repetir y sin *." }
            parametroDeMas:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido en una regla de tipo RANGO: tolerancia." }
            parametroFaltante:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Falta el parámetro maximo." }
            parametroRango:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: El parámetro maximo debe ser un entero entre 1 y 100000. }
            marcador:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "El mensaje usa el marcador {dosis}, que no existe en las reglas de tipo TOTAL_CUADRA." }
            nombre:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: El nombre de la regla debe tener entre 3 y 100 caracteres. }
            descripcion:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: La descripción de la regla debe tener como máximo 300 caracteres. }
            mensaje:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: El mensaje de la regla debe tener entre 10 y 300 caracteres. }
            motivo:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: El motivo del cambio debe tener entre 1 y 300 caracteres. }
    ReglaEstadoInvalido:
      description: Falta `version` o `motivoCambio`, son inválidos, o hay un campo no permitido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            campo:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: severidad." }
            version:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: version debe ser un número entero positivo. }
            motivo:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: El motivo del cambio debe tener entre 1 y 300 caracteres. }
    ReglaDesactualizada:
      description: |
        La versión que cargó el editor ya no es la actual (alguien publicó, activó o desactivó mientras tanto), o
        dos escrituras chocaron en un índice único
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            desactualizada:
              value:
                error: { codigo: REGLA_DESACTUALIZADA, mensaje: La regla VARIACION_HISTORICA cambió mientras la editaba; vuelva a abrirla. }
            altaSimultanea:
              value:
                error: { codigo: REGLA_DESACTUALIZADA, mensaje: Se creó otra regla del mismo tipo al mismo tiempo; intente de nuevo. }
    ReglaInvalida:
      description: Una vacuna de la regla no existe o está inactiva
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { codigo: REGLA_INVALIDA, mensaje: La vacuna BCG no existe o está inactiva. }
    IndicadorEntradaInvalida:
      description: |
        El cuerpo de un indicador no cumple el formato: campo faltante, no permitido o que el tipo no tiene, tipo
        que no se crea, meta o cortes fuera de rango, dosis inicial después de la final, o nombre, descripción o
        motivo inválidos. Los campos de cada tipo están en `IndicadorCrear`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            campo:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: codigo." }
            campoDelTipo:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Los indicadores de tipo DESERCION no llevan prorrateo." }
            tipo:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: Solo se crean indicadores de tipo COBERTURA, AVANCE_META_MES, BRECHA o DESERCION. }
            meta:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: La meta debe ser un número de 1 a 100, con un decimal como máximo. }
            cortes:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Los cortes del semáforo deben ser dos números de 0 a 100, con un decimal como máximo, y el primero menor que el segundo." }
            dosis:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: La dosis inicial debe ir antes que la final. }
            nombre:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: El nombre del indicador debe tener entre 3 y 120 caracteres. }
            descripcion:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: La descripción del indicador debe tener como máximo 300 caracteres. }
            motivo:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: El motivo del cambio debe tener entre 1 y 300 caracteres. }
    IndicadorEstadoInvalido:
      description: Falta `version` o `motivoCambio`, son inválidos, o hay un campo no permitido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            campo:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: meta." }
            version:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: version debe ser un número entero positivo. }
            motivo:
              value:
                error: { codigo: ENTRADA_INVALIDA, mensaje: El motivo del cambio debe tener entre 1 y 300 caracteres. }
    IndicadorConflicto:
      description: |
        La versión que cargó el editor ya no es la actual o dos escrituras chocaron en un índice único
        (`INDICADOR_DESACTUALIZADO`), u otro código que aplica a la DDRISS tiene el mismo tipo, vacuna y dosis
        (`INDICADOR_DUPLICADO`, con `codigoExistente`)
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Error" }
              - type: object
                properties:
                  codigoExistente: { type: string, description: Solo con `INDICADOR_DUPLICADO`, example: COB_HEXA3 }
          examples:
            desactualizado:
              value:
                error: { codigo: INDICADOR_DESACTUALIZADO, mensaje: El indicador COB_HEXA3 cambió mientras lo editaba; vuelva a abrirlo. }
            altaSimultanea:
              value:
                error: { codigo: INDICADOR_DESACTUALIZADO, mensaje: Se creó otro indicador con el mismo código al mismo tiempo; intente de nuevo. }
            duplicado:
              value:
                error: { codigo: INDICADOR_DUPLICADO, mensaje: Ya existe el indicador COB_HEXA3 para la misma vacuna y dosis; publique una versión de ese. }
                codigoExistente: COB_HEXA3
    IndicadorInvalido:
      description: La vacuna, una dosis o el grupo de edad no existen o están inactivos, o el código generado pasa de 40 caracteres
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            vacuna:
              value:
                error: { codigo: INDICADOR_INVALIDO, mensaje: La vacuna SPR no existe o está inactiva. }
            dosis:
              value:
                error: { codigo: INDICADOR_INVALIDO, mensaje: La dosis D4 no existe o está inactiva en HEXA. }
            grupoEdad:
              value:
                error: { codigo: INDICADOR_INVALIDO, mensaje: El grupo de edad 1_A_4 no existe o está inactivo. }
            codigoLargo:
              value:
                error: { codigo: INDICADOR_INVALIDO, mensaje: El código generado pasa de 40 caracteres; use una vacuna con un código más corto. }
    Conflicto:
      description: Duplicado o versionFila desactualizada
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ReglaNegocio:
      description: Se incumple una regla del negocio (transición no permitida, errores de validación, reporte no editable)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            codigo: { type: string, example: TRANSICION_NO_PERMITIDA }
            mensaje: { type: string }
            detalles: { type: array, items: { type: object } }

    ErrorConValidacion:
      description: El error común; con `REPORTE_CON_ERRORES` trae además la validación de esa corrida
      allOf:
        - { $ref: "#/components/schemas/Error" }
        - type: object
          properties:
            validacion: { $ref: "#/components/schemas/Validacion" }

    EstadoReporte:
      type: string
      enum: [BORRADOR, ENVIADO, EN_REVISION, CORRECCION_SOLICITADA, APROBADO, CERRADO, RECTIFICACION]

    RespuestaLogin:
      type: object
      properties:
        token: { type: string, example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... }
        usuario: { $ref: "#/components/schemas/UsuarioSesion" }

    UsuarioSesion:
      type: object
      properties:
        id: { type: integer }
        nombreUsuario: { type: string }
        rol: { type: string, enum: [ESTABLECIMIENTO, REVISOR, EPIDEMIOLOGIA, ADMINISTRADOR, AUTORIDAD] }
        rolNombre:
          type: string
          description: Nombre del rol (`rol.nombre`) para mostrarlo; no va en el JWT
          example: Estadígrafa / revisor DDRISS
        permisos: { type: array, items: { type: string } }
        debeCambiarContrasena:
          type: boolean
          description: Si es `true`, la cuenta solo puede cambiar su contraseña o cerrar sesión; no va en el JWT
        empleado:
          type: object
          properties:
            nombres: { type: string }
            apellidos: { type: string }
            ddrissId: { type: integer, nullable: true, description: NULL solo para AUTORIDAD de nivel nacional }
            establecimientoId: { type: integer, nullable: true }
            municipioId: { type: integer, nullable: true }

    Perfil:
      description: La sesión actual con los datos de su cuenta y de su empleado
      allOf:
        - { $ref: "#/components/schemas/UsuarioSesion" }
        - type: object
          properties:
            ultimoAcceso:
              type: string
              format: date-time
              nullable: true
              description: El último inicio de sesión correcto (el de la sesión actual)
            creadoEn: { type: string, format: date-time, description: Cuándo se creó la cuenta }
            empleado:
              type: object
              properties:
                id: { type: integer }
                cuiRegistrado: { type: boolean, description: true si tiene un CUI registrado; el CUI nunca se devuelve }
                cargo: { type: string, nullable: true }
                correo: { type: string, nullable: true }
                telefono: { type: string, nullable: true }
                ddrissNombre: { type: string, nullable: true, description: NULL solo para AUTORIDAD de nivel nacional }
                establecimientoCodigo: { type: string, nullable: true }
                establecimientoNombre: { type: string, nullable: true }
                municipioNombre: { type: string, nullable: true }

    CambioContrasenaEntrada:
      type: object
      additionalProperties: false
      required: [contrasenaActual, contrasenaNueva]
      properties:
        contrasenaActual: { type: string, format: password }
        contrasenaNueva:
          type: string
          format: password
          minLength: 12
          description: Al menos 12 caracteres, como máximo 72 bytes en UTF-8 y puntaje de zxcvbn de 3 o más

    CierreSesionEntrada:
      type: object
      properties:
        motivo:
          type: string
          enum: [MANUAL, INACTIVIDAD]
          default: MANUAL
          description: MANUAL si el usuario pulsó "Cerrar sesión"; INACTIVIDAD si el frontend la cerró por inactividad

    EmpleadoEntrada:
      type: object
      description: Si llega `codigoEmpleado`, responde 400
      required: [nombres, apellidos, cui, correo]
      properties:
        nombres: { $ref: "#/components/schemas/TextoNombres" }
        apellidos: { $ref: "#/components/schemas/TextoNombres" }
        cui: { $ref: "#/components/schemas/TextoCui" }
        cargo: { $ref: "#/components/schemas/TextoCargo" }
        correo: { $ref: "#/components/schemas/TextoCorreo" }
        telefono: { $ref: "#/components/schemas/TextoTelefono" }
        establecimientoId:
          type: integer
          description: Activo y de la DDRISS del administrador; el municipio se toma de él
        municipioId:
          type: integer
          description: Solo sin establecimiento; activo y del departamento sede de la DDRISS

    Empleado:
      type: object
      properties:
        id: { type: integer }
        cuiRegistrado: { type: boolean, description: true si el empleado tiene un CUI registrado; el CUI y su huella nunca se devuelven }
        nombres: { type: string }
        apellidos: { type: string }
        cargo: { type: string, nullable: true }
        correo: { type: string, nullable: true }
        telefono: { type: string, nullable: true }
        establecimientoId: { type: integer, nullable: true }
        municipioId: { type: integer, nullable: true }
        ddrissId: { type: integer }
        activo: { type: boolean }

    EmpleadoCambios:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Cambio parcial; `ddrissId`, `activo` y `codigoEmpleado` no se aceptan
      properties:
        nombres: { $ref: "#/components/schemas/TextoNombres" }
        apellidos: { $ref: "#/components/schemas/TextoNombres" }
        cui:
          allOf: [{ $ref: "#/components/schemas/TextoCui" }]
          description: Registra el CUI o reemplaza el que había; null o vacío responde 400
        cargo:
          allOf: [{ $ref: "#/components/schemas/TextoCargo" }]
          nullable: true
          description: null o vacío lo borra
        correo:
          allOf: [{ $ref: "#/components/schemas/TextoCorreo" }]
          description: null o vacío responde 400
        telefono:
          allOf: [{ $ref: "#/components/schemas/TextoTelefono" }]
          nullable: true
          description: null o vacío lo borra
        establecimientoId:
          type: integer
          nullable: true
          description: Activo y de la DDRISS del administrador; el municipio se toma de él. null lo quita
        municipioId:
          type: integer
          nullable: true
          description: Solo sin establecimiento; activo y del departamento sede de la DDRISS. No puede venir con valor junto a establecimientoId

    UsuarioEntrada:
      type: object
      description: No lleva contraseña; la genera el sistema. Si llega `contrasenaTemporal`, responde 400
      required: [empleadoId, nombreUsuario, rolId]
      properties:
        empleadoId: { type: integer }
        nombreUsuario:
          type: string
          pattern: '^[a-z0-9._-]{4,50}$'
          description: 4 a 50 caracteres; minúsculas, números, punto, guion o guion bajo. Se quitan los espacios de los extremos
        rolId: { type: integer }

    TextoNombres:
      type: string
      maxLength: 100
      description: |
        Nombres o apellidos: letras (con tildes, ñ y ü), y varias palabras separadas por un espacio, un
        apóstrofo o un guion (`^\p{L}+(?:[ '’-]\p{L}+)*$` después de limpiar). De 1 a 100 caracteres.
      example: María de los Ángeles

    TextoCui:
      type: string
      description: |
        CUI del DPI. Acepta espacios y guiones; sin ellos deben quedar 13 dígitos: 8 de correlativo, 1
        verificador, 2 de departamento y 2 de municipio. El verificador es el residuo de dividir entre 11 la
        suma de los 8 primeros dígitos multiplicados por 2, 3… 9 (residuo 10 = inválido). El departamento va
        de 01 a 22. Único: un CUI repetido responde 409 `CUI_DUPLICADO`.
      example: 2345 67899 1201

    TextoCargo:
      type: string
      maxLength: 100
      description: Empieza con letra; letras, espacios y `. , ( ) / -`; al menos 2 letras
      example: Enf. auxiliar (TSR)

    TextoCorreo:
      type: string
      maxLength: 150
      description: |
        `^[^\s@]+@[^\s@]+\.[^\s@]{2,}$`, de cualquier dominio. Se guarda en minúsculas. Único: uno repetido
        responde 409 `CORREO_DUPLICADO`.
      example: ana.lopez@gmail.com

    TextoTelefono:
      type: string
      description: |
        Acepta `+502`, espacios y guiones; sin ellos deben quedar 8 dígitos que empiecen con 2 a 7. Se guarda
        como `NNNN-NNNN`.
      example: +502 5551 1001

    Usuario:
      type: object
      properties:
        id: { type: integer }
        empleadoId: { type: integer }
        nombreUsuario: { type: string }
        rol: { type: string, enum: [ESTABLECIMIENTO, REVISOR, EPIDEMIOLOGIA, ADMINISTRADOR, AUTORIDAD] }
        rolNombre: { type: string }
        activo: { type: boolean }
        debeCambiarContrasena: { type: boolean }

    UsuarioCreado:
      description: Cuenta recién creada, con la contraseña temporal que generó el sistema; se devuelve una sola vez
      allOf:
        - { $ref: "#/components/schemas/Usuario" }
        - type: object
          properties:
            contrasenaTemporal: { type: string, format: password, minLength: 12, maxLength: 12 }

    RestablecimientoContrasena:
      type: object
      description: La contraseña temporal se devuelve una sola vez
      properties:
        usuario: { $ref: "#/components/schemas/UsuarioDetalle" }
        contrasenaTemporal: { type: string, format: password, minLength: 12, maxLength: 12 }

    UsuarioDetalle:
      description: Cuenta con los datos de su empleado; nunca trae la contraseña, su hash, los intentos fallidos ni la fecha del bloqueo
      allOf:
        - { $ref: "#/components/schemas/Usuario" }
        - type: object
          properties:
            bloqueada:
              type: boolean
              description: Si la cuenta está bloqueada ahora por intentos fallidos
            ultimoAcceso: { type: string, format: date-time, nullable: true }
            desactivadoEn: { type: string, format: date-time, nullable: true }
            empleado:
              allOf:
                - { $ref: "#/components/schemas/Empleado" }
                - type: object
                  properties:
                    establecimientoNombre: { type: string, nullable: true }
                    municipioNombre: { type: string, nullable: true }

    PaginaUsuarios:
      description: |
        Página de cuentas. Es la forma de toda respuesta paginada de la API: `elementos` (los de esta página),
        `total` (todos los que cumplen los filtros, sin paginar), `pagina` y `porPagina`. Los demás listados
        paginados repiten esta forma con su propio tipo de elemento.
      type: object
      required: [elementos, total, pagina, porPagina]
      properties:
        elementos:
          type: array
          items: { $ref: "#/components/schemas/UsuarioDetalle" }
        total: { type: integer, minimum: 0, example: 57 }
        pagina: { type: integer, minimum: 1, example: 2 }
        porPagina: { type: integer, minimum: 1, maximum: 100, example: 20 }

    TextoNombreDistrito:
      type: string
      minLength: 3
      maxLength: 120
      description: |
        Nombre del distrito: letras (con tildes, ñ y ü), dígitos, espacios y `.`, `-`, `(`, `)`. Se quitan los
        espacios de los extremos y se reducen los dobles; de 3 a 120 caracteres después de limpiar.
      example: Distrito de Salud Tacaná Norte

    DistritoSalud:
      type: object
      required: [id, codigo, nombre, ddrissId, municipioId, municipioCodigoIne, municipioNombre, establecimientosActivos, activo]
      properties:
        id: { type: integer, example: 31 }
        codigo: { type: string, description: "Generado por el sistema; no cambia", example: DS-1207-02 }
        nombre: { type: string, example: Distrito de Salud Tacaná Norte }
        ddrissId: { type: integer, example: 1 }
        municipioId: { type: integer, example: 7 }
        municipioCodigoIne: { type: string, example: "1207" }
        municipioNombre: { type: string, example: Tacaná }
        establecimientosActivos:
          type: integer
          minimum: 0
          description: Establecimientos activos ligados al distrito; mientras sea mayor que 0 no se puede desactivar
          example: 0
        activo: { type: boolean, example: true }

    TextoNombreRed:
      type: string
      minLength: 3
      maxLength: 120
      description: |
        Nombre de la red: letras (con tildes, ñ y ü), dígitos, espacios y `.`, `-`, `(`, `)`. Se quitan los
        espacios de los extremos y se reducen los dobles; de 3 a 120 caracteres después de limpiar.
      example: Red No. 1

    IdsMunicipiosRed:
      type: array
      minItems: 1
      uniqueItems: true
      items: { type: integer, minimum: 1 }
      example: [7, 8, 9, 23, 24]

    IdsDosisRed:
      type: array
      minItems: 1
      uniqueItems: true
      items: { type: integer, minimum: 1 }
      example: [1, 4, 13]

    Red:
      type: object
      required: [id, codigo, nombre, activo, ddriss, municipios, trazadoras]
      properties:
        id: { type: integer, example: 1 }
        codigo: { type: string, description: "Generado por el sistema; no cambia", example: RED_01 }
        nombre: { type: string, example: Red No. 1 }
        activo: { type: boolean, example: true }
        ddriss:
          type: object
          required: [id, codigo, nombre]
          properties:
            id: { type: integer, example: 1 }
            codigo: { type: string, example: DDRISS_SM }
            nombre: { type: string, example: DDRISS San Marcos }
        municipios:
          type: array
          description: Por nombre; vacía si la red está inactiva
          items:
            type: object
            required: [id, codigoIne, nombre]
            properties:
              id: { type: integer, example: 7 }
              codigoIne: { type: string, example: "1207" }
              nombre: { type: string, example: Tacaná }
        trazadoras:
          type: array
          description: Por `ordenInforme` de la vacuna y `orden` de la dosis
          items: { $ref: "#/components/schemas/TrazadoraRed" }

    TrazadoraRed:
      type: object
      required: [dosisId, codigo, nombre, activa, vacuna]
      properties:
        dosisId: { type: integer, example: 4 }
        codigo: { type: string, example: D3 }
        nombre: { type: string, example: Tercera dosis }
        activa: { type: boolean, example: true }
        vacuna:
          type: object
          required: [id, codigo, nombre, activa]
          properties:
            id: { type: integer, example: 2 }
            codigo: { type: string, example: HEXA }
            nombre: { type: string, example: Hexavalente }
            activa: { type: boolean, example: true }

    OpcionesRed:
      type: object
      required: [municipios, vacunas]
      properties:
        municipios:
          type: array
          items:
            type: object
            required: [id, codigoIne, nombre, red]
            properties:
              id: { type: integer, example: 7 }
              codigoIne: { type: string, example: "1207" }
              nombre: { type: string, example: Tacaná }
              red:
                description: La red activa en la que está el municipio, o `null` si está libre
                nullable: true
                type: object
                required: [id, nombre]
                properties:
                  id: { type: integer, example: 1 }
                  nombre: { type: string, example: Red No. 1 }
        vacunas:
          type: array
          items:
            type: object
            required: [id, codigo, nombre, dosis]
            properties:
              id: { type: integer, example: 2 }
              codigo: { type: string, example: HEXA }
              nombre: { type: string, example: Hexavalente }
              dosis:
                type: array
                items:
                  type: object
                  required: [id, codigo, nombre, esTrazadora]
                  properties:
                    id: { type: integer, example: 4 }
                    codigo: { type: string, example: D3 }
                    nombre: { type: string, example: Tercera dosis }
                    esTrazadora: { type: boolean, example: true }

    TextoNombreEstablecimiento:
      type: string
      minLength: 3
      maxLength: 150
      description: |
        Letras (con tildes, ñ y ü), dígitos, espacios y `. , - ( ) / '`. Se quitan los espacios de los extremos
        y se reducen los dobles; de 3 a 150 caracteres después de limpiar.
      example: Puesto de Salud Aldea Tochab, Tajumulco

    TextoDireccion:
      type: string
      maxLength: 255
      description: Letras, dígitos, espacios y `. , - ( ) / # '`; hasta 255 caracteres. Vacía o null guarda NULL
      example: Aldea Tochab, Tajumulco

    TextoNombreContacto:
      type: string
      maxLength: 150
      description: Nombre de persona, con la misma regla de `TextoNombres`; hasta 150 caracteres. Vacío o null guarda NULL
      example: Ana Lucía Pérez

    Establecimiento:
      type: object
      required:
        [id, codigo, nombre, tipoEstablecimientoId, tipoEstablecimientoCodigo, tipoEstablecimientoNombre, ddrissId,
         distritoSaludId, distritoSaludCodigo, distritoSaludNombre, municipioId, municipioCodigoIne, municipioNombre,
         reportaProduccion, reporta5c, soloCobertura, esExterno, direccion, telefono, correo, nombreContacto,
         cuentasActivas, activo]
      properties:
        id: { type: integer, example: 41 }
        codigo: { type: string, description: "Generado por el sistema; no cambia", example: PS-1209-02 }
        nombre: { type: string, example: Puesto de Salud Aldea Tochab, Tajumulco }
        tipoEstablecimientoId: { type: integer, example: 4 }
        tipoEstablecimientoCodigo: { type: string, example: PS }
        tipoEstablecimientoNombre: { type: string, example: Puesto de Salud }
        ddrissId: { type: integer, example: 1 }
        distritoSaludId: { type: integer, nullable: true, description: NULL solo en los externos, example: 9 }
        distritoSaludCodigo: { type: string, nullable: true, example: DS-1209 }
        distritoSaludNombre: { type: string, nullable: true, example: Distrito de Salud Tajumulco }
        municipioId: { type: integer, description: Municipio de aplicación de sus dosis, example: 9 }
        municipioCodigoIne: { type: string, example: "1209" }
        municipioNombre: { type: string, example: Tajumulco }
        reportaProduccion: { type: boolean, description: false si otro establecimiento consolida su producción }
        reporta5c: { type: boolean, description: true si envía un 5C a la DDRISS }
        soloCobertura: { type: boolean, description: true si su producción solo cuenta para la cobertura (Hospital de San Marcos) }
        esExterno:
          type: boolean
          description: true si su municipio no es del departamento sede de la DDRISS (p. ej. Coatepeque); lo deduce el backend
        direccion: { type: string, nullable: true, example: Aldea Tochab, Tajumulco }
        telefono: { type: string, nullable: true, example: 5550-3010 }
        correo: { type: string, nullable: true, example: null }
        nombreContacto: { type: string, nullable: true, example: Ana Lucía Pérez }
        cuentasActivas:
          type: integer
          minimum: 0
          description: Cuentas activas de su personal (cuenta y empleado activos); mientras sea mayor que 0 no se puede desactivar
          example: 0
        activo: { type: boolean, example: true }

    EstablecimientoNuevo:
      type: object
      required: [tipoEstablecimientoId, municipioId, nombre]
      additionalProperties: false
      description: |
        `codigo`, `ddrissId`, `esExterno`, `activo` o cualquier otro campo responden 400. `distritoSaludId` es
        obligatorio si el municipio es del departamento sede, y debe faltar o ser null si es de otro departamento.
      properties:
        tipoEstablecimientoId: { type: integer, minimum: 1, example: 4 }
        municipioId: { type: integer, minimum: 1, example: 9 }
        distritoSaludId: { type: integer, minimum: 1, nullable: true, example: 9 }
        nombre: { $ref: "#/components/schemas/TextoNombreEstablecimiento" }
        direccion: { allOf: [{ $ref: "#/components/schemas/TextoDireccion" }], nullable: true }
        telefono:
          allOf: [{ $ref: "#/components/schemas/TextoTelefono" }]
          nullable: true
          description: Opcional; vacío o null guarda NULL
        correo:
          type: string
          nullable: true
          maxLength: 150
          description: Opcional; vacío o null guarda NULL. Con texto, la regla de `TextoCorreo` (sin la de duplicado)
        nombreContacto: { allOf: [{ $ref: "#/components/schemas/TextoNombreContacto" }], nullable: true }
        reportaProduccion: { type: boolean, default: true }
        reporta5c: { type: boolean, default: false }
        soloCobertura: { type: boolean, default: false }

    EstablecimientoCambios:
      type: object
      minProperties: 1
      additionalProperties: false
      description: |
        Cambio parcial. `codigo`, `tipoEstablecimientoId`, `municipioId`, `distritoSaludId`, `ddrissId` y
        `esExterno` responden 400 ("{campo} no se puede cambiar."); `activo` y cualquier otro campo, 400
        ("Campo no permitido: {nombre}.").
      properties:
        nombre: { $ref: "#/components/schemas/TextoNombreEstablecimiento" }
        direccion: { allOf: [{ $ref: "#/components/schemas/TextoDireccion" }], nullable: true }
        telefono: { allOf: [{ $ref: "#/components/schemas/TextoTelefono" }], nullable: true, description: Vacío o null lo borra }
        correo: { type: string, nullable: true, maxLength: 150, description: Vacío o null lo borra }
        nombreContacto: { allOf: [{ $ref: "#/components/schemas/TextoNombreContacto" }], nullable: true }
        reportaProduccion: { type: boolean }
        reporta5c: { type: boolean }
        soloCobertura: { type: boolean }

    TextoCodigoVacuna:
      type: string
      minLength: 2
      maxLength: 20
      description: |
        Empieza con una letra; letras A-Z sin tildes, dígitos y `_`. Se quitan los espacios de los extremos y se
        convierte a mayúsculas. De 2 a 20 caracteres. Es la llave que usan los esquemas de captura; no cambia.
      example: MPOX

    TextoNombreVacuna:
      type: string
      minLength: 3
      maxLength: 120
      description: |
        Letras (con tildes, ñ y ü), dígitos, espacios y `. , - ( ) / + '`. Se quitan los espacios de los extremos
        y se reducen los dobles; de 3 a 120 caracteres después de limpiar.
      example: Viruela símica (Mpox)

    TextoDescripcionVacuna:
      type: string
      maxLength: 255
      description: Los caracteres de `TextoNombreVacuna` más `; :`; hasta 255 caracteres. Vacía o null guarda NULL
      example: "Dos dosis con 4 semanas de intervalo; grupos de riesgo."

    TextoNombreDosis:
      type: string
      minLength: 3
      maxLength: 60
      description: |
        Letras (con tildes, ñ y ü), dígitos, espacios y `. , - ( ) /`. Se quitan los espacios de los extremos y
        se reducen los dobles; de 3 a 60 caracteres después de limpiar. Único dentro de la vacuna.
      example: Primera dosis

    TipoDosis:
      type: string
      enum: [UNICA, DOSIS, REFUERZO]
      description: |
        Se deduce del código de la dosis: `UNICA` → `UNICA`, `D{n}` → `DOSIS`, `R{n}` → `REFUERZO`.

    Dosis:
      type: object
      required: [id, codigo, tipo, nombre, orden, completaEsquema, esTrazadora, activa]
      properties:
        id: { type: integer, example: 4 }
        codigo: { type: string, description: "Generado por el sistema según el tipo; no cambia ni se reutiliza", example: D3 }
        tipo: { $ref: "#/components/schemas/TipoDosis" }
        nombre: { type: string, example: Tercera dosis }
        orden: { type: integer, minimum: 1, description: "Generado por el sistema; no cambia", example: 3 }
        completaEsquema:
          type: boolean
          description: |
            Lo calcula el sistema: la dosis activa `UNICA` o `DOSIS` de mayor orden o, si no hay, el refuerzo
            activo de mayor orden. Exactamente una por vacuna.
          example: true
        esTrazadora: { type: boolean, example: true }
        activa: { type: boolean, example: true }

    Vacuna:
      type: object
      required: [id, codigo, nombre, descripcion, ordenInforme, activa, dosis]
      properties:
        id: { type: integer, example: 2 }
        codigo: { type: string, example: HEXA }
        nombre: { type: string, example: Hexavalente }
        descripcion: { type: string, nullable: true, example: null }
        ordenInforme: { type: integer, minimum: 0, maximum: 65535, example: 4 }
        activa: { type: boolean, example: true }
        dosis:
          type: array
          description: Todas las dosis de la vacuna, también las inactivas, ordenadas por `orden`
          items: { $ref: "#/components/schemas/Dosis" }

    DosisNueva:
      type: object
      required: [tipo, nombre]
      additionalProperties: false
      description: |
        `codigo`, `orden`, `completaEsquema`, `activa` o cualquier otro campo responden 400 ("Campo no permitido:
        {nombre}."). El código, el orden y la marca de completa los genera el sistema.
      properties:
        tipo: { $ref: "#/components/schemas/TipoDosis" }
        nombre: { $ref: "#/components/schemas/TextoNombreDosis" }
        esTrazadora: { type: boolean, default: false }

    VacunaNueva:
      type: object
      required: [codigo, nombre, dosis]
      additionalProperties: false
      description: |
        `id`, `activa` o cualquier otro campo responden 400 ("Campo no permitido: {nombre}.").
      properties:
        codigo: { $ref: "#/components/schemas/TextoCodigoVacuna" }
        nombre: { $ref: "#/components/schemas/TextoNombreVacuna" }
        descripcion: { allOf: [{ $ref: "#/components/schemas/TextoDescripcionVacuna" }], nullable: true }
        ordenInforme:
          type: integer
          minimum: 0
          maximum: 65535
          description: Opcional; sin él, el mayor `ordenInforme` más uno. Puede repetirse
          example: 23
        dosis:
          type: array
          minItems: 1
          description: En el orden del esquema; los refuerzos van después de las dosis `UNICA` o `DOSIS`
          items: { $ref: "#/components/schemas/DosisNueva" }
      example:
        codigo: MPOX
        nombre: Viruela símica (Mpox)
        descripcion: ""
        ordenInforme: 23
        dosis:
          - { tipo: DOSIS, nombre: Primera dosis, esTrazadora: false }
          - { tipo: DOSIS, nombre: Segunda dosis, esTrazadora: true }

    VacunaCambios:
      type: object
      minProperties: 1
      additionalProperties: false
      description: |
        Cambio parcial. `codigo` responde 400 ("codigo no se puede cambiar."); `dosis`, `activa` y cualquier
        otro campo, 400 ("Campo no permitido: {nombre}.").
      properties:
        nombre: { $ref: "#/components/schemas/TextoNombreVacuna" }
        descripcion: { allOf: [{ $ref: "#/components/schemas/TextoDescripcionVacuna" }], nullable: true, description: Vacía o null la borra }
        ordenInforme: { type: integer, minimum: 0, maximum: 65535 }

    DosisCambios:
      type: object
      minProperties: 1
      additionalProperties: false
      description: |
        Cambio parcial. `codigo`, `tipo`, `orden` y `completaEsquema` responden 400 ("{campo} no se puede
        cambiar."); `activa` y cualquier otro campo, 400 ("Campo no permitido: {nombre}.").
      properties:
        nombre: { $ref: "#/components/schemas/TextoNombreDosis" }
        esTrazadora: { type: boolean }

    EstadoPeriodo:
      type: string
      enum: [ABIERTO, EN_CIERRE, CERRADO]

    Periodo:
      type: object
      required: [id, anio, mes, fechaInicio, fechaFin, estado, fechaLimiteEnvio, cerradoEn]
      description: |
        Un mes del calendario común. `estado`, `fechaLimiteEnvio` y `cerradoEn` son los de la DDRISS del usuario,
        o `null` si el mes no está abierto en ella.
      properties:
        id: { type: integer, example: 10 }
        anio: { type: integer, example: 2026 }
        mes: { type: integer, minimum: 1, maximum: 12, example: 10 }
        fechaInicio: { type: string, format: date, example: "2026-10-01" }
        fechaFin: { type: string, format: date, example: "2026-10-31" }
        estado: { allOf: [{ $ref: "#/components/schemas/EstadoPeriodo" }], nullable: true, example: ABIERTO }
        fechaLimiteEnvio: { type: string, format: date, nullable: true, example: "2026-11-10" }
        cerradoEn: { type: string, format: date-time, nullable: true, example: null }

    PeriodoAnioNuevo:
      type: object
      required: [anio]
      additionalProperties: false
      description: 'Cualquier otro campo responde 400 ("Campo no permitido: {nombre}.").'
      properties:
        anio: { type: integer, minimum: 2020, description: "Hasta el año siguiente al actual", example: 2027 }

    FechaLimite:
      type: object
      required: [fechaLimiteEnvio]
      additionalProperties: false
      description: 'Cualquier otro campo responde 400 ("Campo no permitido: {nombre}.").'
      properties:
        fechaLimiteEnvio:
          type: string
          format: date
          description: Posterior al fin del mes
          example: "2026-11-10"

    GrupoPoblacion:
      type: object
      properties:
        codigo: { type: string, description: "Código de clasificacion_poblacion (encabezado del 5C)", example: MENOR_1 }
        descripcion: { type: string, example: Menores de 1 año }

    PoblacionGrupo:
      type: object
      properties:
        cantidad: { type: integer, minimum: 0, maximum: 9999999, example: 1450 }
        fuente: { type: string, nullable: true, example: Archivo MSPAS 2026 }
        actualizadoEn: { type: string, format: date-time, example: "2026-01-05T15:00:00.000Z" }

    PoblacionMunicipio:
      type: object
      properties:
        id: { type: integer, example: 1 }
        codigoIne: { type: string, example: "1201" }
        nombre: { type: string, example: San Marcos }
        poblacion:
          type: object
          description: Por código de grupo; un grupo sin registrar no aparece
          additionalProperties: { $ref: "#/components/schemas/PoblacionGrupo" }
          example:
            NACIDOS_VIVOS: { cantidad: 1494, fuente: Archivo MSPAS 2026, actualizadoEn: "2026-01-05T15:00:00.000Z" }
            MENOR_1: { cantidad: 1450, fuente: Archivo MSPAS 2026, actualizadoEn: "2026-01-05T15:00:00.000Z" }

    PoblacionAnio:
      type: object
      properties:
        anio: { type: integer, example: 2026 }
        grupos:
          type: array
          items: { $ref: "#/components/schemas/GrupoPoblacion" }
        municipios:
          type: array
          items: { $ref: "#/components/schemas/PoblacionMunicipio" }

    PoblacionGuardar:
      type: object
      required: [grupos]
      additionalProperties: false
      description: 'Cualquier otro campo responde 400 ("Campo no permitido: {nombre}.").'
      properties:
        fuente:
          type: string
          nullable: true
          maxLength: 150
          description: Opcional; se recortan los espacios y vacío pasa a null
          example: Archivo MSPAS 2026
        grupos:
          type: object
          minProperties: 1
          description: Por código de grupo, un entero de 0 a 9 999 999. Al menos un grupo.
          additionalProperties: { type: integer, minimum: 0, maximum: 9999999 }
          example: { MENOR_1: 1450, 4_ANIOS: 1378 }

    TextoCodigoDimension:
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
      minLength: 2
      maxLength: 30
      description: |
        Empieza con una letra minúscula; minúsculas, dígitos y `_`. Se quitan los espacios de los extremos. Es la
        llave de `detalle_dimension.dimension_codigo`; no cambia.
      example: via

    TextoCodigoValorDimension:
      type: string
      pattern: "^[A-Z0-9_]+$"
      minLength: 1
      maxLength: 30
      description: |
        Mayúsculas, dígitos y `_`. Se quitan los espacios de los extremos y se convierte a mayúsculas. Es la
        llave de `detalle_dimension.valor_codigo`; no cambia. Único dentro de la dimensión.
      example: IM

    TextoNombreDimension:
      type: string
      minLength: 2
      maxLength: 60
      description: Se quitan los espacios de los extremos; de 2 a 60 caracteres
      example: Vía de aplicación

    TextoDescripcionDimension:
      type: string
      maxLength: 255
      description: Se quitan los espacios de los extremos; hasta 255 caracteres. Vacía o null la quita
      example: Cómo se aplicó la dosis.

    TextoEtiquetaValorDimension:
      type: string
      minLength: 1
      maxLength: 60
      description: Se quitan los espacios de los extremos; de 1 a 60 caracteres
      example: Intramuscular

    EdadMeses:
      type: integer
      minimum: 0
      maximum: 1200
      example: 48

    TipoDimension:
      type: string
      enum: [CATEGORICA, RANGO_EDAD]
      description: "`RANGO_EDAD` solo lo tiene `grupo_edad`; las dimensiones nuevas son `CATEGORICA`"

    ValorDimension:
      type: object
      required: [codigo, etiqueta, orden, activo, enUso]
      properties:
        codigo: { type: string, example: MENOR_1 }
        etiqueta: { type: string, example: "< 1 año" }
        orden: { type: integer, minimum: 1, example: 1 }
        activo: { type: boolean, example: true }
        edadMinMeses: { type: integer, description: Solo en una dimensión `RANGO_EDAD`, example: 0 }
        edadMaxMeses: { type: integer, description: Solo en una dimensión `RANGO_EDAD`, example: 12 }
        enUso:
          type: boolean
          description: Lo usa un esquema de captura `VIGENTE` o `BORRADOR`; si es true, no se puede desactivar
          example: true
        sinPoblacion:
          type: boolean
          description: Solo en una dimensión `RANGO_EDAD`; true si el código no está en `clasificacion_poblacion`
          example: false

    Dimension:
      type: object
      required: [id, codigo, nombre, descripcion, tipo, activa, enUso, valores]
      properties:
        id: { type: string, description: ObjectId del documento en MongoDB, example: 6720f0c1a2b3c4d5e6f70812 }
        codigo: { type: string, example: grupo_edad }
        nombre: { type: string, example: Grupo de edad }
        descripcion: { type: string, nullable: true, example: null }
        tipo: { $ref: "#/components/schemas/TipoDimension" }
        activa: { type: boolean, example: true }
        enUso:
          type: boolean
          description: La usa un esquema de captura `VIGENTE` o `BORRADOR`; si es true, no se puede desactivar
          example: true
        valores:
          type: array
          description: Todos los valores, también los inactivos, ordenados por `orden`
          items: { $ref: "#/components/schemas/ValorDimension" }
        gruposPoblacionDisponibles:
          type: array
          description: |
            Solo en `GET /dimensiones/{codigo}` de una dimensión `RANGO_EDAD`: los grupos de
            `clasificacion_poblacion` que la dimensión todavía no tiene, ordenados por `id`
          items: { $ref: "#/components/schemas/GrupoPoblacion" }

    ValorDimensionNuevo:
      type: object
      required: [codigo, etiqueta]
      additionalProperties: false
      description: 'Un valor de la lista de `DimensionCrear`. Cualquier otro campo responde 400 ("Campo no permitido: {nombre}.").'
      properties:
        codigo: { $ref: "#/components/schemas/TextoCodigoValorDimension" }
        etiqueta: { $ref: "#/components/schemas/TextoEtiquetaValorDimension" }

    DimensionCrear:
      type: object
      required: [codigo, nombre, valores]
      additionalProperties: false
      description: |
        `tipo`, `activa` o cualquier otro campo responden 400 ("Campo no permitido: {nombre}."). La dimensión
        queda `CATEGORICA` y activa.
      properties:
        codigo: { $ref: "#/components/schemas/TextoCodigoDimension" }
        nombre: { $ref: "#/components/schemas/TextoNombreDimension" }
        descripcion: { allOf: [{ $ref: "#/components/schemas/TextoDescripcionDimension" }], nullable: true }
        valores:
          type: array
          minItems: 1
          description: En el orden en que se muestran; dos valores con el mismo código responden 400
          items: { $ref: "#/components/schemas/ValorDimensionNuevo" }
      example:
        codigo: via
        nombre: Vía de aplicación
        descripcion: null
        valores:
          - { codigo: IM, etiqueta: Intramuscular }
          - { codigo: SC, etiqueta: Subcutánea }

    DimensionEditar:
      type: object
      minProperties: 1
      additionalProperties: false
      description: |
        Cambio parcial. `codigo`, `tipo`, `activa`, `valores` o cualquier otro campo responden 400 ("Campo no
        permitido: {nombre}.").
      properties:
        nombre: { $ref: "#/components/schemas/TextoNombreDimension" }
        descripcion: { allOf: [{ $ref: "#/components/schemas/TextoDescripcionDimension" }], nullable: true, description: Vacía o null la quita }

    ValorDimensionCrear:
      type: object
      required: [codigo, etiqueta]
      additionalProperties: false
      description: |
        En una dimensión `RANGO_EDAD`, `edadMinMeses` y `edadMaxMeses` son obligatorios y el código debe existir
        en `clasificacion_poblacion`. En una `CATEGORICA` las edades responden 400 ("Campo no permitido:
        {nombre}."), igual que cualquier otro campo.
      properties:
        codigo: { $ref: "#/components/schemas/TextoCodigoValorDimension" }
        etiqueta: { $ref: "#/components/schemas/TextoEtiquetaValorDimension" }
        edadMinMeses: { $ref: "#/components/schemas/EdadMeses" }
        edadMaxMeses: { $ref: "#/components/schemas/EdadMeses" }
      example:
        codigo: EMBARAZADAS
        etiqueta: Embarazadas
        edadMinMeses: 120
        edadMaxMeses: 600

    ValorDimensionEditar:
      type: object
      required: [etiqueta]
      additionalProperties: false
      description: 'Cualquier otro campo responde 400 ("Campo no permitido: {nombre}.").'
      properties:
        etiqueta: { $ref: "#/components/schemas/TextoEtiquetaValorDimension" }

    OrdenValores:
      type: object
      required: [codigos]
      additionalProperties: false
      description: 'Cualquier otro campo responde 400 ("Campo no permitido: {nombre}.").'
      properties:
        codigos:
          type: array
          description: Todos los códigos de valor de la dimensión (activos e inactivos), cada uno una vez, en el orden nuevo
          items: { type: string }
          example: [MENOR_1, 1_A_MENOR_2, 4_ANIOS, 1_A_5, 2_4, 10_14, MEF_15_49]

    EstadoEsquema:
      type: string
      enum: [BORRADOR, VIGENTE, HISTORICO]

    TerritorioEsquema:
      type: object
      required: [nivel, ddrissCodigo]
      properties:
        nivel: { type: string, enum: [NACIONAL, DDRISS] }
        ddrissCodigo: { type: string, nullable: true, description: null en un esquema nacional, example: DDRISS_SM }

    ResumenEsquema:
      type: object
      required: [id, version, territorio]
      properties:
        id: { type: string, description: ObjectId del esquema, example: 66f8a1c2e4b0a1b2c3d4e5f6 }
        version: { type: integer, minimum: 1, example: 2 }
        territorio: { $ref: "#/components/schemas/TerritorioEsquema" }

    EsquemaPorVacuna:
      type: object
      required: [vacuna, vigente, borrador]
      properties:
        vacuna:
          type: object
          required: [id, codigo, nombre, activa]
          properties:
            id: { type: integer, example: 2 }
            codigo: { type: string, example: HEXA }
            nombre: { type: string, example: Hexavalente }
            activa: { type: boolean, example: true }
        vigente:
          allOf:
            - { $ref: "#/components/schemas/ResumenEsquema" }
            - type: object
              required: [vigenciaDesde]
              properties:
                vigenciaDesde: { type: string, format: date, description: Puede ser futura, example: "2026-10-01" }
          nullable: true
          description: El `VIGENTE` de la DDRISS del usuario o, si no hay, el `VIGENTE` nacional; null si no hay ninguno
        borrador:
          type: object
          nullable: true
          description: El `BORRADOR` de la DDRISS del usuario, o null
          required: [id, version, creadoEn]
          properties:
            id: { type: string, example: 6721a0c1a2b3c4d5e6f70901 }
            version: { type: integer, example: 3 }
            creadoEn: { type: string, format: date-time, example: "2026-10-15T15:00:00.000Z" }
      example:
        vacuna: { id: 2, codigo: HEXA, nombre: Hexavalente, activa: true }
        vigente: { id: 66f8a1c2e4b0a1b2c3d4e5f6, version: 2, territorio: { nivel: NACIONAL, ddrissCodigo: null }, vigenciaDesde: "2026-10-01" }
        borrador: { id: 6721a0c1a2b3c4d5e6f70901, version: 3, creadoEn: "2026-10-15T15:00:00.000Z" }

    DesagregacionEsquema:
      type: object
      required: [dimension, valores]
      properties:
        dimension: { type: string, description: Código de una dimensión activa de `catalogo_dimensiones`, example: grupo_edad }
        valores:
          type: array
          minItems: 1
          description: Valores activos de la dimensión, sin repetir; se guardan en el orden del catálogo
          items: { type: string }
          example: [MENOR_1, 1_A_5]
        etiqueta:
          type: string
          nullable: true
          maxLength: 120
          description: |
            Opcional. Texto que reemplaza el nombre de la dimensión en el formulario. Se quitan los espacios de
            los extremos y se reducen los dobles; vacía o `null` no se guarda. El editor no la cambia: la devuelve
            tal como la recibió para que guardar no la pierda. Un valor que no es texto, o de más de 120
            caracteres, responde 400.
          example: "Condición: embarazada o no"

    DesagregacionEsquemaGuardada:
      allOf:
        - { $ref: "#/components/schemas/DesagregacionEsquema" }
        - type: object
          required: [etiqueta]
          properties:
            etiqueta:
              type: string
              nullable: true
              description: La etiqueta guardada en el documento; `null` si no tiene
              example: "Condición: embarazada o no"

    ProcedenciaEsquema:
      type: object
      required: [modo]
      properties:
        modo:
          type: string
          enum: [MUNICIPIO_DETALLADO, PROPIO_Y_OTROS]
          description: "`MUNICIPIO_DETALLADO`: se elige el municipio de procedencia; `PROPIO_Y_OTROS`: réplica del 5C (propio y otros)"
        permiteNoEspecificado: { type: boolean, default: true }

    TextoTituloSeccion:
      type: string
      minLength: 1
      maxLength: 60
      description: Se quitan los espacios de los extremos; de 1 a 60 caracteres
      example: "< 1 año"

    DosisEsquemaEntrada:
      type: object
      required: [codigo]
      additionalProperties: false
      properties:
        codigo: { type: string, description: Código de una dosis activa de la vacuna, example: R1 }
        desagregacion:
          type: array
          nullable: true
          description: |
            null o ausente: la dosis usa la desagregación general. `[]`: la dosis no se desagrega. Una lista:
            reemplaza la general solo para esta dosis; si la vacuna desagrega por `grupo_edad`, la lista lo lleva.
          items: { $ref: "#/components/schemas/DesagregacionEsquema" }

    SeccionEsquemaEntrada:
      type: object
      required: [titulo, grupoEdad, dosis]
      additionalProperties: false
      properties:
        titulo: { $ref: "#/components/schemas/TextoTituloSeccion" }
        grupoEdad:
          type: string
          nullable: true
          description: Un valor de `grupo_edad` del esquema, distinto en cada sección; null si la vacuna no desagrega por edad
          example: MENOR_1
        dosis:
          type: array
          minItems: 1
          description: Dosis del esquema que se capturan en la sección, sin repetir
          items: { type: string }
          example: [D1, D2, D3]

    EsquemaEditar:
      type: object
      required: [procedencia, dosis, desagregacion, secciones]
      additionalProperties: false
      description: 'Cualquier otro campo responde 400 ("Campo no permitido: {nombre}.").'
      properties:
        procedencia: { $ref: "#/components/schemas/ProcedenciaEsquema" }
        dosis:
          type: array
          minItems: 1
          description: Las dosis que pide el formulario; se guardan en el orden de MySQL
          items: { $ref: "#/components/schemas/DosisEsquemaEntrada" }
        desagregacion:
          type: array
          description: Desagregación general; `[]` si solo se reporta el total por dosis
          items: { $ref: "#/components/schemas/DesagregacionEsquema" }
        secciones:
          type: array
          minItems: 1
          description: En el orden en que se muestran
          items: { $ref: "#/components/schemas/SeccionEsquemaEntrada" }
        incluirPorDefecto:
          type: boolean
          description: |
            `true`: la vacuna entra en cada reporte nuevo del mes que cubre la versión (SPEC 31). Opcional: en el
            `POST`, si no viene, un borrador vacío empieza en `false` y una copia toma la del esquema copiado; en
            el `PUT`, si no viene, se conserva.
          example: true

    EsquemaCrear:
      allOf:
        - $ref: "#/components/schemas/EsquemaEditar"
        - type: object
          required: [vacunaId]
          properties:
            vacunaId: { type: integer, description: vacuna.id en MySQL, example: 4 }
            copiaDe:
              type: string
              nullable: true
              description: |
                ObjectId del vigente que aplica (el `vigente.id` de `GET /esquemas-captura`) para copiarlo; null o
                ausente para empezar vacío. Si ya no es el vigente que aplica, responde 409 `BASE_DESACTUALIZADA`.
              example: 66f8a1c2e4b0a1b2c3d4e601
      example:
        vacunaId: 4
        copiaDe: 66f8a1c2e4b0a1b2c3d4e601
        procedencia: { modo: MUNICIPIO_DETALLADO, permiteNoEspecificado: true }
        dosis:
          - { codigo: D1, desagregacion: null }
          - { codigo: R1, desagregacion: [{ dimension: grupo_edad, valores: [MEF_15_49] }] }
        desagregacion:
          - { dimension: estado_embarazo, valores: [EMBARAZADA, NO_EMBARAZADA] }
          - { dimension: grupo_edad, valores: [MEF_15_49] }
        secciones:
          - { titulo: Mujer de 15 a 49 años, grupoEdad: MEF_15_49, dosis: [D1, R1] }

    EsquemaCaptura:
      type: object
      required: [id, vacuna, version, territorio, estado, vigencia, versionAnteriorId, basadoEn, procedencia, dosis,
        desagregacion, secciones, incluirPorDefecto, camposAdicionales, reglas, presentacion, creadoPor, creadoEn,
        publicadoPor, publicadoEn, motivoCambio]
      properties:
        id: { type: string, example: 6721a0c1a2b3c4d5e6f70901 }
        vacuna:
          type: object
          properties:
            id: { type: integer, example: 4 }
            codigo: { type: string, example: TD }
            nombre: { type: string, example: Toxoide tetánico y diftérico (Td) }
        version: { type: integer, minimum: 1, example: 5 }
        territorio: { $ref: "#/components/schemas/TerritorioEsquema" }
        estado: { $ref: "#/components/schemas/EstadoEsquema" }
        vigencia:
          type: object
          nullable: true
          description: null en un `BORRADOR`
          properties:
            desde: { type: string, format: date, example: "2026-10-01" }
            hasta: { type: string, format: date, nullable: true, example: null }
        versionAnteriorId: { type: string, nullable: true, example: null }
        basadoEn:
          type: object
          nullable: true
          properties:
            esquemaId: { type: string, example: 66f8a1c2e4b0a1b2c3d4e601 }
            version: { type: integer, example: 1 }
        procedencia: { $ref: "#/components/schemas/ProcedenciaEsquema" }
        dosis:
          type: array
          items:
            type: object
            required: [codigo, etiqueta, desagregacion]
            properties:
              codigo: { type: string, example: R1 }
              etiqueta: { type: string, example: Primer refuerzo }
              desagregacion:
                type: array
                nullable: true
                description: null si la dosis usa la desagregación general; `[]` si no se desagrega
                items: { $ref: "#/components/schemas/DesagregacionEsquemaGuardada" }
        desagregacion:
          type: array
          items: { $ref: "#/components/schemas/DesagregacionEsquemaGuardada" }
        secciones:
          type: array
          items:
            type: object
            required: [codigo, titulo, orden, grupoEdad, dosis]
            properties:
              codigo: { type: string, description: El `grupoEdad`, o `GENERAL`, example: MEF_15_49 }
              titulo: { type: string, example: Mujer de 15 a 49 años }
              orden: { type: integer, example: 1 }
              grupoEdad: { type: string, nullable: true, example: MEF_15_49 }
              dosis: { type: array, items: { type: string }, example: [D1, R1] }
        incluirPorDefecto:
          type: boolean
          description: |
            `true`: la vacuna entra en los reportes nuevos del mes que cubre esta versión. Un documento sin el campo
            (anterior a MongoDB v0.8) responde `true`.
          example: true
        camposAdicionales:
          type: array
          description: Copiados de la base; este spec no los edita
          items: { type: object }
        reglas:
          type: array
          items:
            type: object
            properties:
              codigo: { type: string, example: CAMPOS_COMPLETOS }
              version: { type: integer, example: 1 }
              severidadOverride: { type: string, nullable: true, enum: [ERROR, ADVERTENCIA, null] }
        presentacion:
          type: object
          description: La deduce el backend
          example: { filas: dosis, columnas: [estado_embarazo] }
        creadoPor: { type: integer, description: Id del usuario de MySQL, example: 1 }
        creadoEn: { type: string, format: date-time, example: "2026-10-24T16:00:00.000Z" }
        publicadoPor: { $ref: "#/components/schemas/PublicadoPor" }
        publicadoEn: { type: string, format: date-time, nullable: true, description: null en un `BORRADOR`, example: "2026-10-24T16:30:00.000Z" }
        motivoCambio: { type: string, nullable: true, description: "El motivo guardado: null en un borrador del SPEC 19; al publicar, el del cuerpo", example: Se agrega la dimensión pueblo. }

    PublicadoPor:
      type: object
      nullable: true
      description: Usuario que publicó la versión; null en un `BORRADOR` o si el usuario no existe en MySQL
      required: [id, nombreUsuario]
      properties:
        id: { type: integer, example: 1 }
        nombreUsuario: { type: string, example: admin.prueba }

    EsquemaPublicar:
      type: object
      required: [vigenciaDesde, motivoCambio]
      additionalProperties: false
      properties:
        vigenciaDesde:
          type: string
          format: date
          description: Día 1 de un mes del calendario de periodos, desde el mes actual
          example: "2026-12-01"
        motivoCambio: { type: string, minLength: 1, maxLength: 300, description: Se recorta, example: Se agrega la dimensión pueblo. }

    HistorialEsquemas:
      type: object
      required: [vacuna, versiones]
      properties:
        vacuna:
          type: object
          required: [id, codigo, nombre, activa]
          properties:
            id: { type: integer, example: 2 }
            codigo: { type: string, example: HEXA }
            nombre: { type: string, example: Hexavalente }
            activa: { type: boolean, example: true }
        versiones:
          type: array
          items:
            type: object
            required: [id, version, territorio, estado, vigencia, versionAnteriorId, basadoEn, creadoEn, publicadoPor,
              publicadoEn, motivoCambio, reportes]
            properties:
              id: { type: string, example: 66f8a1c2e4b0a1b2c3d4e5f5 }
              version: { type: integer, example: 1 }
              territorio: { $ref: "#/components/schemas/TerritorioEsquema" }
              estado: { $ref: "#/components/schemas/EstadoEsquema" }
              vigencia:
                type: object
                nullable: true
                description: null en un `BORRADOR`
                properties:
                  desde: { type: string, format: date, example: "2026-01-01" }
                  hasta: { type: string, format: date, nullable: true, example: "2026-09-30" }
              versionAnteriorId: { type: string, nullable: true, example: null }
              basadoEn:
                type: object
                nullable: true
                properties:
                  esquemaId: { type: string }
                  version: { type: integer }
              creadoEn: { type: string, format: date-time }
              publicadoPor: { $ref: "#/components/schemas/PublicadoPor" }
              publicadoEn: { type: string, format: date-time, nullable: true }
              motivoCambio: { type: string, nullable: true }
              reportes: { type: integer, minimum: 0, description: Filas de `reporte_vacuna` de la DDRISS del usuario que usan la versión, example: 6 }
      example:
        vacuna: { id: 2, codigo: HEXA, nombre: Hexavalente, activa: true }
        versiones:
          - id: 6721a0c1a2b3c4d5e6f70901
            version: 3
            territorio: { nivel: DDRISS, ddrissCodigo: DDRISS_SM }
            estado: BORRADOR
            vigencia: null
            versionAnteriorId: null
            basadoEn: { esquemaId: 66f8a1c2e4b0a1b2c3d4e5f6, version: 2 }
            creadoEn: "2026-10-15T15:00:00.000Z"
            publicadoPor: null
            publicadoEn: null
            motivoCambio: null
            reportes: 0
          - id: 66f8a1c2e4b0a1b2c3d4e5f5
            version: 1
            territorio: { nivel: NACIONAL, ddrissCodigo: null }
            estado: HISTORICO
            vigencia: { desde: "2026-01-01", hasta: "2026-09-30" }
            versionAnteriorId: null
            basadoEn: null
            creadoEn: "2026-09-01T00:00:00.000Z"
            publicadoPor: { id: 1, nombreUsuario: admin.prueba }
            publicadoEn: "2026-09-01T00:00:00.000Z"
            motivoCambio: null
            reportes: 6

    TipoRegla:
      type: string
      description: |
        El validador que ejecuta la regla. Solo se crean códigos nuevos de `RANGO`, `SECUENCIA_DOSIS`,
        `VARIACION_HISTORICA` y `TOTAL_CUADRA`; los demás tienen solo las reglas de la semilla.
      enum: [CAMPOS_COMPLETOS, NO_NEGATIVO, TOTAL_CUADRA, SIN_DUPLICADOS, SECUENCIA_DOSIS, VARIACION_HISTORICA,
        RANGO, PROCEDENCIA_VALIDA, DIMENSIONES_VALIDAS]

    SeveridadRegla:
      type: string
      description: "`ERROR` impide enviar el reporte; `ADVERTENCIA` solo avisa"
      enum: [ERROR, ADVERTENCIA]

    ParametrosRegla:
      type: object
      description: |
        Los parámetros del tipo, con las claves en snake_case de la base (son datos de la regla, no campos de la
        API). Todos son obligatorios y no se admiten otros. Los marcadores son los `{x}` que acepta `mensaje`.

        | Tipo | Ámbito | Parámetros | Marcadores |
        |---|---|---|---|
        | `RANGO` | `DETALLE` | `minimo` (entero, 0 a 100000), `maximo` (entero, de `minimo` + 1 a 100000) | `vacuna`, `dosis`, `valor`, `minimo`, `maximo` |
        | `SECUENCIA_DOSIS` | `VACUNA` | `exceso_permitido_pct` (entero, 0 a 1000) | `vacuna`, `dosis_anterior`, `dosis_posterior`, `exceso_permitido_pct` |
        | `VARIACION_HISTORICA` | `VACUNA` | `meses_referencia` (entero, 1 a 12), `variacion_max_pct` (entero, 1 a 1000), `minimo_dosis` (entero, 0 a 100000) | `vacuna`, `variacion`, `meses_referencia`, `variacion_max_pct` |
        | `TOTAL_CUADRA` | `VACUNA` | `tolerancia` (entero, 0 a 1000) | `vacuna`, `total`, `suma` |
        | `CAMPOS_COMPLETOS` | `VACUNA` | `cero_explicito` (booleano) | `vacuna`, `n_faltantes` |
        | `NO_NEGATIVO` | `DETALLE` | ninguno | `vacuna`, `dosis` |
        | `DIMENSIONES_VALIDAS` | `DETALLE` | ninguno | `vacuna`, `dosis`, `version` |
        | `PROCEDENCIA_VALIDA` | `DETALLE` | ninguno | `vacuna`, `dosis`, `municipio` |
        | `SIN_DUPLICADOS` | `REPORTE` | ninguno | `establecimiento`, `periodo` |
      additionalProperties: true
      example: { meses_referencia: 3, variacion_max_pct: 40, minimo_dosis: 10 }

    VacunasRegla:
      type: array
      minItems: 1
      description: '`["*"]` = todas; si no, códigos de vacunas activas de MySQL, sin repetir. `*` no se combina con códigos'
      items: { type: string }
      example: ["*"]

    ReglaValidacion:
      type: object
      description: Una versión de una regla de validación
      required: [id, codigo, version, nombre, descripcion, tipo, ambito, severidad, vacunas, parametros, mensaje,
        territorio, estado, vigencia, publicadoPor, publicadoEn, motivoCambio]
      properties:
        id: { type: string, description: ObjectId de la versión, example: 6722b0c1a2b3c4d5e6f70a01 }
        codigo: { type: string, example: VARIACION_HISTORICA }
        version: { type: integer, minimum: 1, example: 2 }
        nombre: { type: string, example: Variación atípica frente al historial (San Marcos) }
        descripcion: { type: string, nullable: true, example: null }
        tipo: { $ref: "#/components/schemas/TipoRegla" }
        ambito: { type: string, enum: [DETALLE, VACUNA, REPORTE], description: Lo fija el tipo }
        severidad: { $ref: "#/components/schemas/SeveridadRegla" }
        vacunas: { $ref: "#/components/schemas/VacunasRegla" }
        parametros: { $ref: "#/components/schemas/ParametrosRegla" }
        mensaje:
          type: string
          description: Plantilla con los marcadores del tipo
          example: La producción de {vacuna} varía {variacion} % respecto al promedio de los últimos {meses_referencia} meses.
        territorio: { $ref: "#/components/schemas/TerritorioEsquema" }
        estado: { type: string, enum: [VIGENTE, HISTORICO] }
        vigencia:
          type: object
          required: [desde, hasta]
          description: "`desde` es el instante de la publicación; `hasta`, el instante en que la reemplazaron o la desactivaron"
          properties:
            desde: { type: string, format: date-time, example: "2026-10-01T06:00:00.000Z" }
            hasta: { type: string, format: date-time, nullable: true, example: null }
        publicadoPor: { $ref: "#/components/schemas/PublicadoPor" }
        publicadoEn:
          type: string
          format: date-time
          description: En las versiones de la semilla sin fecha de publicación, la de creación
          example: "2026-10-01T06:00:00.000Z"
        motivoCambio: { type: string, nullable: true, example: "Prueba: umbral de 40 % pedido por la DDRISS." }

    ReglaPorCodigo:
      type: object
      required: [codigo, tipo, ambito, aplica, ultimaDdriss, vigenteNacional]
      properties:
        codigo: { type: string, example: VARIACION_HISTORICA }
        tipo: { $ref: "#/components/schemas/TipoRegla" }
        ambito: { type: string, enum: [DETALLE, VACUNA, REPORTE] }
        aplica:
          allOf: [{ $ref: "#/components/schemas/ReglaValidacion" }]
          nullable: true
          description: La versión que aplica a la DDRISS; null si la regla está inactiva en ella
        ultimaDdriss:
          allOf: [{ $ref: "#/components/schemas/ReglaValidacion" }]
          nullable: true
          description: La versión más reciente de la DDRISS, `VIGENTE` o `HISTORICO`; null si la DDRISS no tiene
        vigenteNacional:
          type: object
          nullable: true
          required: [version]
          properties:
            version: { type: integer, example: 1 }

    ReglaEnHistorial:
      allOf:
        - $ref: "#/components/schemas/ReglaValidacion"
        - type: object
          required: [desactivacion]
          properties:
            desactivacion:
              type: object
              nullable: true
              description: Si la versión se desactivó (fila `DESACTIVAR` de la bitácora); null si no
              required: [en, por, motivo]
              properties:
                en: { type: string, format: date-time, example: "2026-10-30T16:40:00.000Z" }
                por: { $ref: "#/components/schemas/PublicadoPor" }
                motivo: { type: string, example: La DDRISS revisará este control a mano este mes. }

    ContenidoRegla:
      type: object
      required: [nombre, severidad, vacunas, parametros, mensaje, motivoCambio]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 100, description: Se recorta, example: Rango mensual de BCG }
        descripcion:
          type: string
          nullable: true
          maxLength: 300
          description: Opcional; se recorta, y vacía o null no guarda descripción
          example: Advierte cuando una celda supera 300 dosis.
        severidad: { $ref: "#/components/schemas/SeveridadRegla" }
        vacunas: { $ref: "#/components/schemas/VacunasRegla" }
        parametros: { $ref: "#/components/schemas/ParametrosRegla" }
        mensaje:
          type: string
          minLength: 10
          maxLength: 300
          description: Se recorta; solo los marcadores del tipo
          example: "{vacuna} {dosis}: {valor} dosis está fuera del rango esperado ({minimo} a {maximo})."
        motivoCambio: { type: string, minLength: 1, maxLength: 300, description: Se recorta, example: Control pedido por la DDRISS. }

    ReglaCrear:
      allOf:
        - $ref: "#/components/schemas/ContenidoRegla"
        - type: object
          required: [tipo]
          properties:
            tipo: { type: string, enum: [RANGO, SECUENCIA_DOSIS, VARIACION_HISTORICA, TOTAL_CUADRA] }
      description: No admite otros campos
      example:
        tipo: RANGO
        nombre: Rango mensual de BCG
        severidad: ADVERTENCIA
        vacunas: [BCG]
        parametros: { minimo: 0, maximo: 300 }
        mensaje: "{vacuna} {dosis}: {valor} dosis está fuera del rango esperado ({minimo} a {maximo})."
        motivoCambio: Control pedido por la DDRISS.

    ReglaVersion:
      allOf:
        - $ref: "#/components/schemas/ContenidoRegla"
        - type: object
          required: [versionBase]
          properties:
            versionBase:
              type: integer
              minimum: 1
              description: La versión que cargó el editor; si ya no es la base, responde 409 `REGLA_DESACTUALIZADA`
              example: 1
      description: No admite otros campos (ni `tipo` ni `codigo`)
      example:
        versionBase: 1
        nombre: Coherencia entre dosis sucesivas (San Marcos)
        severidad: ERROR
        vacunas: [HEXA, SPR]
        parametros: { exceso_permitido_pct: 10 }
        mensaje: "{dosis_posterior} de {vacuna} supera a {dosis_anterior} en más de {exceso_permitido_pct} %."
        motivoCambio: La DDRISS pide un umbral más estricto.

    ReglaEstado:
      type: object
      required: [version, motivoCambio]
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
          description: "Al desactivar, la del `VIGENTE` de la DDRISS; al activar, la de `ultimaDdriss`"
          example: 2
        motivoCambio: { type: string, minLength: 1, maxLength: 300, description: Se recorta, example: La DDRISS revisará este control a mano este mes. }

    TipoCalculoIndicador:
      type: string
      enum: [COBERTURA, AVANCE_META_MES, BRECHA, DESERCION, PROYECCION]
      description: |
        Qué fórmula usa el motor y qué campos se configuran:

        | Tipo | Se crea | Dosis | Población | Prorrateo | Meta (comparador) | Semáforo | Mapa |
        |---|---|---|---|---|---|---|---|
        | `COBERTURA` | Sí | `dosis` | obligatoria | `NINGUNO` o `MENSUAL_LINEAL` (por defecto) | editable, 95 por defecto (`>`) | ascendente | sí |
        | `AVANCE_META_MES` | Sí | `dosis` | obligatoria | siempre `MENSUAL_LINEAL` | siempre 100 (`>=`) | ascendente | sí |
        | `BRECHA` | Sí | `dosis` | obligatoria | `NINGUNO` (por defecto) o `MENSUAL_LINEAL` | editable, 95 por defecto (`>`) | no | no |
        | `DESERCION` | Sí | `dosisInicial` y `dosisFinal` | no | no | editable, 10 por defecto (`<=`) | descendente | no |
        | `PROYECCION` | No | se copia | se copia | se copia | editable (`>`) | no | no |

    VacunaDeIndicador:
      type: object
      required: [codigo, nombre, activa]
      properties:
        codigo: { type: string, example: HEXA }
        nombre: { type: string, description: De MySQL; el código si la vacuna ya no existe, example: Hexavalente }
        activa: { type: boolean, description: false si la vacuna está inactiva o ya no existe }

    UmbralIndicador:
      type: object
      required: [color, desde, hasta]
      description: Una franja del semáforo; `desde` incluido y `hasta` excluido en ascendente, al revés en descendente
      properties:
        color: { type: string, enum: [verde, amarillo, rojo], description: Nombre del color; el mapa lo pinta con sus tonos }
        desde: { type: number, nullable: true, example: 80 }
        hasta: { type: number, nullable: true, example: 90 }

    ConfiguracionIndicador:
      type: object
      description: |
        Una versión de la configuración de un indicador. `parametros` conserva las claves en snake_case de la base:
        son datos del método del indicador, no campos de la API, y no se editan.
      required: [id, codigo, version, nombre, descripcion, tipoCalculo, vacuna, dosis, dosisInicial, dosisFinal,
        clasificacionPoblacion, grupoEdad, numerador, denominador, meta, umbrales, umbralesProvisionales,
        esIndicadorMapa, parametros, alerta, esEstimacion, territorio, estado, vigencia, publicadoPor, publicadoEn,
        motivoCambio]
      properties:
        id: { type: string, description: ObjectId de la versión, example: 6727c0c1a2b3c4d5e6f70a01 }
        codigo: { type: string, example: AVANCE_HEXA3 }
        version: { type: integer, minimum: 1, example: 1 }
        nombre: { type: string, example: Avance de Hexavalente 3.ª dosis contra la meta del mes }
        descripcion: { type: string, nullable: true, example: "Dosis acumuladas al mes ÷ (población ÷ 12 × número de mes) × 100. La meta del mes vale 100 %." }
        tipoCalculo: { $ref: "#/components/schemas/TipoCalculoIndicador" }
        vacuna: { $ref: "#/components/schemas/VacunaDeIndicador" }
        dosis: { type: string, nullable: true, description: Null en `DESERCION`, example: D3 }
        dosisInicial: { type: string, nullable: true, description: Solo en `DESERCION`, example: null }
        dosisFinal: { type: string, nullable: true, description: Solo en `DESERCION`, example: null }
        clasificacionPoblacion: { type: string, nullable: true, description: Código de `clasificacion_poblacion`; null en `DESERCION`, example: MENOR_1 }
        grupoEdad:
          type: string
          nullable: true
          description: El único valor de `filtros_dimension.grupo_edad`; null si no hay filtro (todas las edades) o tiene más de un valor
          example: MENOR_1
        numerador:
          type: object
          properties:
            fuente: { type: string, enum: [PRODUCCION, INDICADOR] }
            estadosReporte: { type: array, items: { type: string }, example: [CERRADO] }
            atribucion: { type: string, enum: [PROCEDENCIA, APLICACION] }
            acumulado: { type: string, enum: [MENSUAL, ANUAL] }
        denominador:
          type: object
          properties:
            fuente: { type: string, enum: [POBLACION_OBJETIVO, PRODUCCION, INDICADOR] }
            prorrateo:
              type: string
              enum: [NINGUNO, MENSUAL_LINEAL]
              description: "`MENSUAL_LINEAL`: población ÷ 12 × número de mes"
        meta:
          type: object
          required: [valor, unidad, comparador]
          properties:
            valor: { type: number, example: 100 }
            unidad: { type: string, enum: [PORCENTAJE, DOSIS] }
            comparador: { type: string, enum: [">", ">=", "<", "<="] }
        umbrales:
          type: array
          description: Las franjas del semáforo; vacío si la versión no tiene
          items: { $ref: "#/components/schemas/UmbralIndicador" }
        umbralesProvisionales: { type: boolean, description: Rangos sin confirmar por Epidemiología }
        esIndicadorMapa: { type: boolean, description: El mapa puede mostrarlo; varios pueden tenerlo }
        parametros:
          type: object
          additionalProperties: true
          description: Claves en snake_case; no se editan
          example: { mostrar_diferencia: true, redondeo: ARRIBA, minimo_cero: true }
        alerta:
          type: object
          description: No se edita
          properties:
            generar: { type: boolean }
            tipo: { type: string, enum: [COBERTURA_BAJO_META, CALIDAD, PROCESO] }
            rolDestino: { type: array, items: { type: string } }
        esEstimacion: { type: boolean, description: true en `PROYECCION` }
        territorio: { $ref: "#/components/schemas/TerritorioEsquema" }
        estado: { type: string, enum: [VIGENTE, HISTORICO] }
        vigencia:
          type: object
          required: [desde, hasta]
          description: "`desde` es el instante de la publicación; `hasta`, el instante en que la reemplazaron o la desactivaron"
          properties:
            desde: { type: string, format: date-time, example: "2026-01-01T00:00:00.000Z" }
            hasta: { type: string, format: date-time, nullable: true, example: null }
        publicadoPor: { $ref: "#/components/schemas/PublicadoPor" }
        publicadoEn:
          type: string
          format: date-time
          description: En las versiones de la semilla sin fecha de publicación, la de creación
          example: "2026-01-01T00:00:00.000Z"
        motivoCambio: { type: string, nullable: true, example: null }

    IndicadorPorCodigo:
      type: object
      required: [codigo, tipoCalculo, vacuna, aplica, ultimaDdriss, vigenteNacional]
      properties:
        codigo: { type: string, example: AVANCE_HEXA3 }
        tipoCalculo: { $ref: "#/components/schemas/TipoCalculoIndicador" }
        vacuna: { $ref: "#/components/schemas/VacunaDeIndicador" }
        aplica:
          allOf: [{ $ref: "#/components/schemas/ConfiguracionIndicador" }]
          nullable: true
          description: La versión que aplica a la DDRISS; null si el indicador está inactivo en ella
        ultimaDdriss:
          allOf: [{ $ref: "#/components/schemas/ConfiguracionIndicador" }]
          nullable: true
          description: La versión más reciente de la DDRISS, `VIGENTE` o `HISTORICO`; null si la DDRISS no tiene
        vigenteNacional:
          type: object
          nullable: true
          required: [version]
          properties:
            version: { type: integer, example: 1 }

    IndicadorEnHistorial:
      allOf:
        - $ref: "#/components/schemas/ConfiguracionIndicador"
        - type: object
          required: [desactivacion]
          properties:
            desactivacion:
              type: object
              nullable: true
              description: Si la versión se desactivó (fila `DESACTIVAR` de la bitácora); null si no
              required: [en, por, motivo]
              properties:
                en: { type: string, format: date-time, example: "2026-11-03T16:40:00.000Z" }
                por: { $ref: "#/components/schemas/PublicadoPor" }
                motivo: { type: string, example: Epidemiología usará el indicador nacional este año. }

    OpcionesIndicador:
      type: object
      required: [vacunas, clasificaciones, gruposEdad]
      properties:
        vacunas:
          type: array
          description: Vacunas activas con sus dosis activas
          items:
            type: object
            required: [codigo, nombre, dosis]
            properties:
              codigo: { type: string, example: HEXA }
              nombre: { type: string, example: Hexavalente }
              dosis:
                type: array
                items:
                  type: object
                  required: [codigo, nombre, orden, completaEsquema]
                  properties:
                    codigo: { type: string, example: D3 }
                    nombre: { type: string, example: Tercera dosis }
                    orden: { type: integer, example: 3 }
                    completaEsquema: { type: boolean, example: true }
        clasificaciones:
          type: array
          items:
            type: object
            required: [codigo, descripcion]
            properties:
              codigo: { type: string, example: MENOR_1 }
              descripcion: { type: string, example: Menores de 1 año }
        gruposEdad:
          type: array
          description: Valores activos de la dimensión `grupo_edad`
          items:
            type: object
            required: [codigo, etiqueta]
            properties:
              codigo: { type: string, example: MENOR_1 }
              etiqueta: { type: string, example: Menor de 1 año }

    ContenidoIndicador:
      type: object
      required: [nombre, motivoCambio]
      description: |
        Los campos que van dependen del tipo (ver `TipoCalculoIndicador`); uno que el tipo no tiene responde 400.
        En `PROYECCION` solo van `nombre`, `descripcion`, `meta` y `motivoCambio`.
      properties:
        nombre: { type: string, minLength: 3, maxLength: 120, description: Se recorta, example: Cobertura de SPR 1.ª dosis en niñas y niños de 1 año }
        descripcion:
          type: string
          nullable: true
          maxLength: 300
          description: Opcional; se recorta, y vacía o null no guarda descripción
        dosis: { type: string, description: Dosis activa de la vacuna; salvo en `DESERCION`, example: D1 }
        dosisInicial: { type: string, description: Solo en `DESERCION`; con `orden` menor que la final, example: D1 }
        dosisFinal: { type: string, description: Solo en `DESERCION`, example: D3 }
        clasificacionPoblacion: { type: string, description: Código de `clasificacion_poblacion`; salvo en `DESERCION`, example: 1_A_MENOR_2 }
        grupoEdad: { type: string, nullable: true, description: Valor activo de `grupo_edad`; null o ausente = todas las edades, example: 1_A_MENOR_2 }
        prorrateo: { type: string, enum: [NINGUNO, MENSUAL_LINEAL], description: Solo en `COBERTURA` y `BRECHA` }
        meta: { type: number, minimum: 1, maximum: 100, description: Porcentaje con un decimal como máximo; no va en `AVANCE_META_MES`, example: 95 }
        cortes:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: number, minimum: 0, maximum: 100 }
          description: |
            Los dos cortes del semáforo `[c1, c2]`, con `c1 < c2` y un decimal como máximo. Solo en `COBERTURA`,
            `AVANCE_META_MES` y `DESERCION`, donde es obligatorio. Se guardan como tres franjas: ascendente =
            rojo `[0, c1)`, amarillo `[c1, c2)`, verde `[c2, …)`; descendente (`DESERCION`) = verde `(…, c1]`,
            amarillo `(c1, c2]`, rojo `(c2, …)`.
          example: [80, 90]
        umbralesProvisionales: { type: boolean, description: Con `cortes`; por defecto false }
        esIndicadorMapa: { type: boolean, description: Solo en `COBERTURA` y `AVANCE_META_MES`; por defecto false }
        motivoCambio: { type: string, minLength: 1, maxLength: 300, description: Se recorta, example: Meta pedida por Epidemiología. }

    IndicadorCrear:
      allOf:
        - $ref: "#/components/schemas/ContenidoIndicador"
        - type: object
          required: [tipoCalculo, vacuna]
          properties:
            tipoCalculo: { type: string, enum: [COBERTURA, AVANCE_META_MES, BRECHA, DESERCION] }
            vacuna: { type: string, description: Código de una vacuna activa, example: SPR }
      description: No admite otros campos
      example:
        tipoCalculo: COBERTURA
        vacuna: SPR
        nombre: Cobertura de SPR 1.ª dosis en niñas y niños de 1 año
        dosis: D1
        clasificacionPoblacion: 1_A_MENOR_2
        grupoEdad: 1_A_MENOR_2
        prorrateo: MENSUAL_LINEAL
        meta: 95
        cortes: [80, 90]
        umbralesProvisionales: false
        esIndicadorMapa: false
        motivoCambio: Indicador pedido por Epidemiología.

    IndicadorVersion:
      allOf:
        - $ref: "#/components/schemas/ContenidoIndicador"
        - type: object
          required: [versionBase]
          properties:
            versionBase:
              type: integer
              minimum: 1
              description: La versión que cargó el editor; si ya no es la base, responde 409 `INDICADOR_DESACTUALIZADO`
              example: 1
      description: No admite otros campos (ni `tipoCalculo`, ni `vacuna`, ni `codigo`)
      example:
        versionBase: 1
        nombre: Cobertura de Hexavalente 3.ª dosis en menores de 1 año
        dosis: D3
        clasificacionPoblacion: MENOR_1
        grupoEdad: MENOR_1
        prorrateo: MENSUAL_LINEAL
        meta: 95
        cortes: [85, 95]
        umbralesProvisionales: false
        esIndicadorMapa: false
        motivoCambio: Semáforo confirmado por Epidemiología.

    IndicadorEstado:
      type: object
      required: [version, motivoCambio]
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
          description: "Al desactivar, la del `VIGENTE` de la DDRISS; al activar, la de `ultimaDdriss`"
          example: 2
        motivoCambio: { type: string, minLength: 1, maxLength: 300, description: Se recorta, example: Epidemiología usará el indicador nacional este año. }

    ReporteNuevo:
      type: object
      additionalProperties: false
      required: [periodoId]
      description: 'El establecimiento sale de la cuenta; cualquier otro campo responde 400 ("Campo no permitido: {nombre}.").'
      properties:
        periodoId: { type: integer, minimum: 1, example: 10 }

    EstablecimientoDeReporte:
      type: object
      required: [id, codigo, nombre]
      properties:
        id: { type: integer, example: 1 }
        codigo: { type: string, example: CS-1201 }
        nombre: { type: string, example: Centro de Salud San Marcos }

    ReporteResumen:
      type: object
      required: [id, establecimiento, periodo, estado, actualizadoEn, estadoDesde, correccion]
      properties:
        id: { type: integer, example: 412 }
        establecimiento: { $ref: "#/components/schemas/EstablecimientoDeReporte" }
        periodo:
          type: object
          required: [id, anio, mes, estado]
          properties:
            id: { type: integer, example: 10 }
            anio: { type: integer, example: 2026 }
            mes: { type: integer, minimum: 1, maximum: 12, example: 10 }
            estado:
              allOf: [{ $ref: "#/components/schemas/EstadoPeriodo" }]
              nullable: true
              description: Estado del mes en la DDRISS del establecimiento; `null` si no tiene fila en `cierre_periodo`
        estado: { $ref: "#/components/schemas/EstadoReporte" }
        actualizadoEn: { type: string, format: date-time, example: "2026-10-25T15:04:00.000Z" }
        estadoDesde:
          type: string
          format: date-time
          description: Fecha del último cambio de estado (la fila más reciente de `historial_estado_reporte`)
          example: "2026-10-12T20:00:00.000Z"
        correccion:
          type: object
          nullable: true
          description: Solo si el reporte está en `CORRECCION_SOLICITADA`; si no, `null`
          required: [comentario, fecha]
          properties:
            comentario: { type: string, nullable: true, example: Revisar Hexavalente D1 en menores de 1 año. }
            fecha: { type: string, format: date-time, example: "2026-10-12T20:00:00.000Z" }

    GrupoBandeja:
      type: string
      description: Los chips de la bandeja de revisión
      enum: [POR_ATENDER, ASIGNADOS_A_MI, EN_REVISION, ENVIADO, CORRECCION_SOLICITADA, SIN_ENVIAR, APROBADO, CERRADO, TODOS]
      default: POR_ATENDER

    RevisorResumen:
      type: object
      required: [id, nombre]
      properties:
        id: { type: integer, description: "`usuario.id`", example: 2 }
        nombre: { type: string, description: Nombres y apellidos del empleado, example: Ana Pérez }

    ObservacionRevision:
      type: object
      required: [id, vacuna, texto, autor, creadoEn, atendida, atendidaEn]
      properties:
        id: { type: integer, description: "`observacion_revision.id`", example: 31 }
        vacuna:
          type: object
          nullable: true
          description: "`null` en una observación general, o si su vacuna ya no está en el reporte"
          required: [id, codigo, nombre]
          properties:
            id: { type: integer, example: 3 }
            codigo: { type: string, example: HEXA }
            nombre: { type: string, example: Hexavalente }
        texto: { type: string, maxLength: 1000, example: Hexavalente D1 en menores de 1 año es muy alto frente a septiembre. }
        autor: { $ref: "#/components/schemas/RevisorResumen" }
        creadoEn: { type: string, format: date-time, example: "2026-10-31T15:10:00.000Z" }
        atendida: { type: boolean, description: "Pasa a `true` al reenviar el reporte después de la devolución", example: false }
        atendidaEn: { type: string, format: date-time, nullable: true, description: "Cuándo se reenvió; `null` si está pendiente", example: null }

    CambioEstadoReporte:
      type: object
      required: [id, estadoAnterior, estadoNuevo, usuario, fecha, comentario]
      properties:
        id: { type: integer, description: "`historial_estado_reporte.id`", example: 1534 }
        estadoAnterior:
          allOf: [{ $ref: "#/components/schemas/EstadoReporte" }]
          nullable: true
          description: "`null` en la creación del reporte"
        estadoNuevo: { $ref: "#/components/schemas/EstadoReporte" }
        usuario:
          type: object
          required: [id, nombre, rol]
          properties:
            id: { type: integer, description: "`usuario.id`", example: 14 }
            nombre: { type: string, description: Nombres y apellidos del empleado, example: Ana Pérez }
            rol:
              type: object
              description: El rol actual de la cuenta
              required: [codigo, nombre]
              properties:
                codigo: { type: string, example: ESTABLECIMIENTO }
                nombre: { type: string, example: Personal del establecimiento }
        fecha: { type: string, format: date-time, example: "2026-10-05T21:42:00.000Z" }
        comentario: { type: string, maxLength: 1000, nullable: true, example: null }

    ElementoBandeja:
      type: object
      required: [reporteId, versionFila, establecimiento, municipio, estado, enviadoEn, revisor, advertencias, dosisTotales]
      properties:
        reporteId: { type: integer, nullable: true, description: "`null` si el establecimiento no tiene reporte del mes", example: 524 }
        versionFila: { type: integer, nullable: true, example: 13 }
        establecimiento:
          type: object
          required: [id, codigo, nombre]
          properties:
            id: { type: integer, example: 9 }
            codigo: { type: string, example: CS-1209 }
            nombre: { type: string, example: Centro de Salud Tajumulco }
        municipio:
          type: object
          required: [id, nombre]
          properties:
            id: { type: integer, example: 9 }
            nombre: { type: string, example: Tajumulco }
        estado:
          allOf: [{ $ref: "#/components/schemas/EstadoReporte" }]
          nullable: true
          description: "`null` si no hay reporte del mes"
        enviadoEn: { type: string, format: date-time, nullable: true, example: "2026-10-31T02:58:01.000Z" }
        revisor:
          allOf: [{ $ref: "#/components/schemas/RevisorResumen" }]
          nullable: true
        advertencias:
          type: integer
          description: Resultados `ADVERTENCIA` en `ABIERTO` o `JUSTIFICADO`
          example: 1
        dosisTotales:
          type: integer
          nullable: true
          description: Suma de `reporte_vacuna.total_declarado`; `null` si ninguna vacuna tiene total
          example: 85

    BandejaRevision:
      description: |
        Página de la bandeja, con la forma paginada común (ver `PaginaUsuarios`), los conteos de los grupos y el
        resumen del cierre del mes
      type: object
      required: [elementos, total, pagina, porPagina, conteos, cierre]
      properties:
        elementos:
          type: array
          items: { $ref: "#/components/schemas/ElementoBandeja" }
        total: { type: integer, minimum: 0, example: 6 }
        pagina: { type: integer, minimum: 1, example: 1 }
        porPagina: { type: integer, minimum: 1, maximum: 100, example: 20 }
        conteos:
          type: object
          description: Cuántos hay en cada grupo con el mes y el municipio elegidos
          required: [POR_ATENDER, ASIGNADOS_A_MI, EN_REVISION, ENVIADO, CORRECCION_SOLICITADA, SIN_ENVIAR, APROBADO, CERRADO, TODOS]
          additionalProperties: false
          properties:
            POR_ATENDER: { type: integer, example: 6 }
            ASIGNADOS_A_MI: { type: integer, example: 2 }
            EN_REVISION: { type: integer, example: 4 }
            ENVIADO: { type: integer, example: 2 }
            CORRECCION_SOLICITADA: { type: integer, example: 3 }
            SIN_ENVIAR: { type: integer, example: 2 }
            APROBADO: { type: integer, example: 5 }
            CERRADO: { type: integer, example: 14 }
            TODOS: { type: integer, example: 30 }
        cierre: { $ref: "#/components/schemas/ResumenCierre" }

    ResumenCierre:
      type: object
      description: |
        El mes de la DDRISS del usuario visto para cerrarlo, sin los filtros de la bandeja. `establecimientos` es el
        conteo de «Todos» sin municipio; `cerrados` cuenta `CERRADO` y `RECTIFICACION`; `faltanPorAprobar`, los
        reportes en el ciclo (`ENVIADO`, `EN_REVISION`, `CORRECCION_SOLICITADA` o `BORRADOR` ya enviado), con la
        misma regla que el cierre.
      required: [estado, fechaLimiteEnvio, establecimientos, aprobados, cerrados, faltanPorAprobar]
      properties:
        estado: { $ref: "#/components/schemas/EstadoPeriodo" }
        fechaLimiteEnvio: { type: string, format: date, example: "2026-11-10" }
        establecimientos: { type: integer, minimum: 0, example: 30 }
        aprobados: { type: integer, minimum: 0, example: 5 }
        cerrados: { type: integer, minimum: 0, example: 14 }
        faltanPorAprobar: { type: integer, minimum: 0, example: 9 }

    AvanceCierre:
      type: object
      description: El avance del cierre de un mes de una DDRISS (`GET /revision/avance`)
      required: [periodo, esperados, conteos]
      properties:
        periodo:
          type: object
          nullable: true
          description: El mes elegido, con el estado y la fecha límite de la DDRISS; `null` si la DDRISS no tiene meses
          required: [id, anio, mes, estado, fechaLimiteEnvio]
          properties:
            id: { type: integer, example: 32 }
            anio: { type: integer, example: 2026 }
            mes: { type: integer, minimum: 1, maximum: 12, example: 8 }
            estado: { $ref: "#/components/schemas/EstadoPeriodo" }
            fechaLimiteEnvio: { type: string, format: date, example: "2026-09-10" }
        esperados: { type: integer, minimum: 0, description: El conteo de «Todos» de la bandeja, example: 30 }
        conteos: { $ref: "#/components/schemas/ConteosAvance" }
        municipios:
          type: array
          description: |
            Solo con `desglose=municipio`. Un elemento por municipio con al menos un establecimiento contado, por
            nombre; la suma de sus `esperados` y `conteos` es la de la DDRISS. Vacío con `periodo: null`.
          items:
            type: object
            required: [municipio, esperados, conteos]
            properties:
              municipio:
                type: object
                required: [id, nombre, codigoIne]
                properties:
                  id: { type: integer, example: 3 }
                  nombre: { type: string, example: Tacaná }
                  codigoIne: { type: string, description: La llave del GeoJSON del mapa, example: "1203" }
              esperados: { type: integer, minimum: 0, example: 4 }
              conteos: { $ref: "#/components/schemas/ConteosAvance" }

    ConteosAvance:
      type: object
      required: [SIN_ENVIAR, ENVIADO, EN_REVISION, CORRECCION_SOLICITADA, APROBADO, CERRADO]
      additionalProperties: false
      properties:
        SIN_ENVIAR: { type: integer, minimum: 0, description: Sin reporte del mes o en `BORRADOR`, example: 2 }
        ENVIADO: { type: integer, minimum: 0, example: 2 }
        EN_REVISION: { type: integer, minimum: 0, example: 4 }
        CORRECCION_SOLICITADA: { type: integer, minimum: 0, example: 3 }
        APROBADO: { type: integer, minimum: 0, example: 5 }
        CERRADO: { type: integer, minimum: 0, description: "`CERRADO` y `RECTIFICACION`", example: 14 }

    PeriodoCerrado:
      description: El mes ya cerrado (el mismo objeto de `GET /periodos`) y cuántos reportes pasaron a Cerrado
      allOf:
        - { $ref: "#/components/schemas/Periodo" }
        - type: object
          required: [reportesCerrados, corrida]
          properties:
            reportesCerrados: { type: integer, minimum: 0, example: 19 }
            corrida:
              allOf: [{ $ref: "#/components/schemas/CorridaDeCierre" }]
              description: La corrida `CIERRE_PERIODO` del mes; `FALLIDA` no deshace el cierre

    PaginaReportes:
      description: Página de reportes, con la forma paginada común (ver `PaginaUsuarios`)
      type: object
      required: [elementos, total, pagina, porPagina]
      properties:
        elementos:
          type: array
          items: { $ref: "#/components/schemas/ReporteResumen" }
        total: { type: integer, minimum: 0, example: 1 }
        pagina: { type: integer, minimum: 1, example: 1 }
        porPagina: { type: integer, minimum: 1, maximum: 100, example: 20 }

    DosisDeReporte:
      type: object
      required: [codigo, nombre, orden, activa]
      description: Una dosis que nombra el esquema del reporte, con los datos de la tabla `dosis`
      properties:
        codigo: { type: string, example: D1 }
        nombre: { type: string, example: 1.ª dosis }
        orden: { type: integer, example: 1 }
        activa: { type: boolean, description: "`false` si se desactivó; qué hacer con ella lo decide el formulario (HU-20)", example: true }

    DimensionDeReporte:
      type: object
      required: [codigo, nombre, etiqueta, valores]
      description: Una dimensión que usa el esquema del reporte, con los valores que usa, en el orden del catálogo
      properties:
        codigo: { type: string, example: grupo_edad }
        nombre: { type: string, example: Grupo de edad }
        etiqueta:
          type: string
          nullable: true
          description: La `etiqueta` de la desagregación en el esquema; `null` si no tiene
          example: null
        valores:
          type: array
          items:
            type: object
            required: [codigo, etiqueta, orden, activo]
            properties:
              codigo: { type: string, example: MENOR_1 }
              etiqueta: { type: string, example: "< 1 año" }
              orden: { type: integer, example: 1 }
              activo: { type: boolean, example: true }

    VacunaDeReporte:
      type: object
      required: [id, vacuna, esquema, base, dosis, dimensiones]
      properties:
        id: { type: integer, description: "`reporte_vacuna.id`", example: 2051 }
        base: { $ref: "#/components/schemas/VacunaBase" }
        vacuna:
          type: object
          required: [id, codigo, nombre]
          properties:
            id: { type: integer, example: 3 }
            codigo: { type: string, example: HEXA }
            nombre: { type: string, example: Hexavalente }
        esquema:
          type: object
          required: [id, version]
          description: La versión fijada al crear el reporte
          properties:
            id: { type: string, example: 66f8a1c2e4b0a1b2c3d4e5f6 }
            version: { type: integer, example: 2 }
        dosis:
          type: array
          description: Ordenadas por `orden`; `[]` si el esquema ya no está en MongoDB
          items: { $ref: "#/components/schemas/DosisDeReporte" }
        dimensiones:
          type: array
          description: "`[]` si el esquema solo desagrega por dosis o ya no está en MongoDB"
          items: { $ref: "#/components/schemas/DimensionDeReporte" }

    Reporte:
      type: object
      required: [id, establecimiento, periodo, estado, numeroRectificacion, versionFila, revisor, creadoEn, actualizadoEn, vacunas]
      properties:
        id: { type: integer, example: 412 }
        establecimiento: { $ref: "#/components/schemas/EstablecimientoDeReporte" }
        periodo:
          type: object
          required: [id, anio, mes, estado, fechaLimiteEnvio]
          properties:
            id: { type: integer, example: 10 }
            anio: { type: integer, example: 2026 }
            mes: { type: integer, minimum: 1, maximum: 12, example: 10 }
            estado:
              allOf: [{ $ref: "#/components/schemas/EstadoPeriodo" }]
              nullable: true
              description: Estado del mes en la DDRISS del establecimiento; `null` si no está abierto en ella
            fechaLimiteEnvio: { type: string, format: date, nullable: true, example: "2026-11-10" }
        estado: { $ref: "#/components/schemas/EstadoReporte" }
        numeroRectificacion: { type: integer, example: 0 }
        versionFila: { type: integer, example: 1 }
        revisor:
          allOf: [{ $ref: "#/components/schemas/RevisorResumen" }]
          nullable: true
          description: El revisor asignado (SPEC 35), o `null` si el reporte no se ha asignado
        creadoEn: { type: string, format: date-time, example: "2026-10-25T15:04:00.000Z" }
        actualizadoEn: { type: string, format: date-time, example: "2026-10-25T15:04:00.000Z" }
        vacunas:
          type: array
          description: Ordenadas como el catálogo (`orden_informe`, `nombre`)
          items: { $ref: "#/components/schemas/VacunaDeReporte" }

    Celda:
      type: object
      description: |
        Una cantidad del formulario. Las dimensiones dependen del esquema de la vacuna: las de la desagregación
        de la dosis (la propia o la general) sin `grupo_edad`, más `grupo_edad` si la sección tiene uno. Una
        vacuna que no desagrega va con `dimensiones: {}`.
      required: [dosisCodigo, municipioProcedenciaId, dimensiones, cantidad]
      properties:
        dosisCodigo: { type: string, example: D3 }
        municipioProcedenciaId:
          type: integer
          description: "`municipio.id`: el del establecimiento (tarjeta A) o una procedencia de la tarjeta B"
          example: 1
        dimensiones:
          type: object
          additionalProperties: { type: string }
          example: { sexo: F, grupo_edad: MENOR_1 }
        claveCombinacion:
          type: string
          readOnly: true
          description: La calcula el backend con las dimensiones ordenadas por código; `''` sin dimensiones
          example: grupo_edad=MENOR_1|sexo=F
        cantidad: { type: integer, minimum: 0, maximum: 4294967295, example: 40 }

    EsquemaDeFormulario:
      type: object
      description: La forma de `EsquemaCaptura` sin los datos de creación y publicación
      required: [id, vacuna, version, territorio, estado, vigencia, procedencia, dosis, desagregacion, secciones,
        camposAdicionales, reglas]
      properties:
        id: { type: string, example: 6721a0c1a2b3c4d5e6f70901 }
        vacuna: { $ref: "#/components/schemas/EsquemaCaptura/properties/vacuna" }
        version: { type: integer, minimum: 1, example: 2 }
        territorio: { $ref: "#/components/schemas/TerritorioEsquema" }
        estado: { $ref: "#/components/schemas/EstadoEsquema" }
        vigencia: { $ref: "#/components/schemas/EsquemaCaptura/properties/vigencia" }
        versionAnteriorId: { type: string, nullable: true, example: null }
        basadoEn: { $ref: "#/components/schemas/EsquemaCaptura/properties/basadoEn" }
        procedencia: { $ref: "#/components/schemas/ProcedenciaEsquema" }
        dosis: { $ref: "#/components/schemas/EsquemaCaptura/properties/dosis" }
        desagregacion: { $ref: "#/components/schemas/EsquemaCaptura/properties/desagregacion" }
        secciones:
          allOf: [{ $ref: "#/components/schemas/EsquemaCaptura/properties/secciones" }]
          description: "`[]` en una versión anterior a la v0.4 del modelo (Hexavalente v1): se deducen de `grupo_edad`"
        incluirPorDefecto: { $ref: "#/components/schemas/EsquemaCaptura/properties/incluirPorDefecto" }
        camposAdicionales:
          type: array
          items:
            type: object
            required: [clave, etiqueta, tipo, requerido]
            properties:
              clave: { type: string, example: frascos_abiertos }
              etiqueta: { type: string, example: Frascos abiertos en el mes }
              tipo: { type: string, enum: [entero, decimal, texto, booleano, lista] }
              requerido: { type: boolean, description: Solo se muestra; no impide guardar el borrador }
              minimo: { type: number, nullable: true }
              maximo: { type: number, nullable: true }
              opciones: { type: array, items: { type: string } }
              ayuda: { type: string }
        reglas: { $ref: "#/components/schemas/EsquemaCaptura/properties/reglas" }
        presentacion: { $ref: "#/components/schemas/EsquemaCaptura/properties/presentacion" }

    VacunaBase:
      type: boolean
      description: |
        `true` si la versión fijada en `reporte_vacuna` está marcada con `incluirPorDefecto` (o no trae el campo,
        o ya no está en MongoDB): la vacuna no se puede quitar del reporte (SPEC 31).
      example: true

    VacunaDeFormulario:
      type: object
      required: [vacunaId, base, esquema, procedenciasPermitidas, celdas, datosAdicionales, totalDeclarado]
      properties:
        vacunaId: { type: integer, description: "`vacuna.id`", example: 2 }
        base: { $ref: "#/components/schemas/VacunaBase" }
        esquema:
          allOf: [{ $ref: "#/components/schemas/EsquemaDeFormulario" }]
          nullable: true
          description: La versión fijada en el reporte; `null` si el documento ya no está en MongoDB
        procedenciasPermitidas:
          type: array
          description: |
            Los `municipio.id` que se pueden elegir en la tarjeta B, en el orden de `municipios`. Según el modo
            de procedencia del esquema:
            - `MUNICIPIO_DETALLADO`: los municipios activos del departamento sede de la DDRISS del
              establecimiento, sin el propio ni el `9999`, más el `9999` si `permiteNoEspecificado` es `true`;
            - `PROPIO_Y_OTROS`: solo el `9999`, como en el 5C.

            Nunca trae el municipio propio. `[]` si `esquema` es `null`.
          items: { type: integer }
          example: [2, 3, 31]
        celdas:
          type: array
          description: Todas las filas de la vacuna, de cualquier procedencia, ordenadas por dosis y clave
          items: { $ref: "#/components/schemas/Celda" }
        datosAdicionales:
          type: object
          nullable: true
          description: "`{ clave: valor }` de los campos adicionales con valor; `null` si no hay ninguno"
          additionalProperties: true
          example: { frascos_abiertos: 12 }
        totalDeclarado:
          type: integer
          nullable: true
          description: Suma de las cantidades de la vacuna, calculada por el backend; `null` si no tiene filas
          example: 82

    FormularioReporte:
      type: object
      required: [reporteId, versionFila, editable, municipioPropio, municipios, vacunas]
      properties:
        reporteId: { type: integer, example: 287 }
        versionFila: { type: integer, description: La que se manda en cada `PUT`, example: 3 }
        editable: { type: boolean, description: "`BORRADOR` con el mes `ABIERTO` o `EN_CIERRE`", example: true }
        municipioPropio:
          type: object
          required: [id, nombre]
          description: El municipio del establecimiento, procedencia de las celdas de la tarjeta A
          properties:
            id: { type: integer, example: 1 }
            nombre: { type: string, example: San Marcos }
        municipios:
          type: array
          description: |
            Las procedencias de la tarjeta B con su nombre: el territorio de la DDRISS del establecimiento, el
            `9999` y todo municipio que aparezca en las celdas de alguna vacuna (también uno desactivado o de
            otro departamento), sin el propio. Ordenados por nombre, con el `9999` al final.
          items:
            type: object
            required: [id, codigoIne, nombre]
            properties:
              id: { type: integer, example: 2 }
              codigoIne: { type: string, example: "1202" }
              nombre: { type: string, example: San Pedro Sacatepéquez }
        vacunas:
          type: array
          description: En el orden de `GET /reportes/{id}`
          items: { $ref: "#/components/schemas/VacunaDeFormulario" }

    VacunaDisponible:
      type: object
      required: [vacunaId, codigo, nombre, esquema]
      properties:
        vacunaId: { type: integer, example: 30 }
        codigo: { type: string, example: VARICELA }
        nombre: { type: string, example: Varicela }
        esquema:
          type: object
          required: [id, version]
          description: La versión que se fijaría al agregarla (el esquema que cubre el día 1 del mes)
          properties:
            id: { type: string, example: 6721a0c1a2b3c4d5e6f70930 }
            version: { type: integer, example: 1 }

    VacunaDeReporteAgregar:
      type: object
      additionalProperties: false
      required: [vacunaId, versionFila]
      description: 'Cualquier otro campo responde 400 ("Campo no permitido: {nombre}.").'
      properties:
        vacunaId: { type: integer, minimum: 1, description: "`vacuna.id`", example: 30 }
        versionFila: { type: integer, minimum: 1, description: La del reporte, example: 5 }

    VacunaAgregada:
      type: object
      required: [versionFila, orden, vacuna, formulario]
      properties:
        versionFila: { type: integer, description: La nueva del reporte, example: 6 }
        orden:
          type: array
          description: Los `vacunaId` del reporte en el orden de `GET /reportes/{id}`, con la agregada en su lugar
          items: { type: integer }
          example: [3, 30, 12]
        vacuna: { $ref: "#/components/schemas/VacunaDeReporte" }
        formulario: { $ref: "#/components/schemas/VacunaDeFormulario" }

    VacunaDeReporteGuardar:
      type: object
      additionalProperties: false
      required: [versionFila, celdas]
      properties:
        versionFila:
          type: integer
          description: La versión del reporte que leyó el cliente (control de concurrencia optimista)
          example: 3
        celdas:
          type: array
          description: Todas las celdas con valor de la vacuna, de cualquier procedencia; las que no vienen se borran
          items: { $ref: "#/components/schemas/Celda" }
        datosAdicionales:
          type: object
          nullable: true
          description: |
            Los campos adicionales del esquema como `{ clave: valor }`, validados por su tipo, mínimo, máximo y
            opciones. Opcional: si falta o es `null`, se guarda `NULL`.
          additionalProperties: true
          example: { frascos_abiertos: 12 }

    Validacion:
      type: object
      required: [validadoEn, errores, advertencias, corregidos, resultados]
      properties:
        validadoEn:
          type: string
          format: date-time
          nullable: true
          description: |
            El instante de la corrida, aunque no se haya escrito nada. En `GET /reportes/{id}/validacion`, el
            `ejecutado_en` más reciente de los resultados, o `null` si no hay ninguno.
          example: "2026-10-30T15:42:10.000Z"
        errores: { type: integer, description: Resultados actuales de severidad `ERROR`, example: 1 }
        advertencias: { type: integer, description: Resultados actuales de severidad `ADVERTENCIA`, example: 2 }
        corregidos: { type: integer, description: Cuántos pasaron a `CORREGIDO` en esta corrida, example: 1 }
        resultados:
          type: array
          description: |
            Los resultados actuales (`ABIERTO` o `JUSTIFICADO`): primero los errores y después las advertencias;
            dentro, en el orden de las vacunas del reporte y luego por código de regla. Los de ámbito `REPORTE`
            van al final de su severidad.
          items: { $ref: "#/components/schemas/ResultadoValidacion" }

    ResultadoValidacion:
      type: object
      required: [id, regla, severidad, estado, mensaje, vacuna, dosis, celdas, campos]
      properties:
        id: { type: integer, description: "`resultado_validacion.id`", example: 412 }
        regla:
          type: object
          required: [codigo, version, nombre, tipo]
          description: La versión de la regla que produjo el resultado
          properties:
            codigo: { type: string, example: CAMPOS_COMPLETOS }
            version: { type: integer, example: 1 }
            nombre: { type: string, example: Campos completos }
            tipo: { type: string, example: CAMPOS_COMPLETOS }
        severidad: { type: string, enum: [ERROR, ADVERTENCIA], description: "`ERROR` impide enviar el reporte" }
        estado: { type: string, enum: [ABIERTO, JUSTIFICADO] }
        mensaje:
          type: string
          maxLength: 500
          description: El de la regla, con sus marcadores reemplazados
          example: "Faltan valores en Hexavalente: 1 combinaciones sin registrar."
        vacuna:
          type: object
          nullable: true
          description: "`null` en las reglas de ámbito `REPORTE`"
          required: [id, codigo, nombre]
          properties:
            id: { type: integer, example: 2 }
            codigo: { type: string, example: HEXA }
            nombre: { type: string, example: Hexavalente }
        dosis:
          type: object
          nullable: true
          description: Solo en los resultados de una sola celda (ámbito `DETALLE`)
          required: [codigo, etiqueta]
          properties:
            codigo: { type: string, example: D3 }
            etiqueta: { type: string, example: 3.ª dosis }
        celdas:
          type: array
          description: |
            Las casillas que causan el resultado. Solo van en la respuesta: no se guardan. En `SECUENCIA_DOSIS`,
            las de la dosis posterior en esa sección.
          items:
            type: object
            required: [municipioId, dosis, claveCombinacion]
            properties:
              municipioId: { type: integer, description: La procedencia (`9999` incluido), example: 1201 }
              dosis: { type: string, example: D3 }
              claveCombinacion: { type: string, example: grupo_edad=MENOR_1 }
        campos:
          type: array
          description: Las claves de los campos adicionales que faltan o no cuadran; solo en la respuesta
          items: { type: string }
          example: [total_dosis_declarado]

    EstadoRectificacion:
      type: string
      enum: [PENDIENTE, AUTORIZADA, RECHAZADA, APLICADA]

    CambioRectificacionEntrada:
      type: object
      additionalProperties: false
      description: Una celda que cambia, con el formato de `Celda` y `cantidadNueva` en lugar de `cantidad`
      required: [vacunaId, dosisCodigo, municipioProcedenciaId, dimensiones, cantidadNueva]
      properties:
        vacunaId: { type: integer, description: "`vacuna.id`", example: 3 }
        dosisCodigo: { type: string, example: D3 }
        municipioProcedenciaId: { type: integer, example: 7 }
        dimensiones:
          type: object
          additionalProperties: { type: string }
          example: { grupo_edad: MENOR_1 }
        cantidadNueva: { type: integer, minimum: 0, maximum: 4294967295, example: 93 }

    SolicitudRectificacionNueva:
      type: object
      additionalProperties: false
      required: [motivo, versionFila, cambios]
      properties:
        motivo: { type: string, minLength: 1, maxLength: 1000, description: La justificación; se recorta, example: Faltó sumar la jornada de vacunación del 28 de agosto. }
        versionFila: { type: integer, minimum: 1, description: La del reporte que vio el usuario, example: 14 }
        cambios:
          type: array
          minItems: 1
          maxItems: 500
          description: Solo las celdas que cambian, sin repetir una celda
          items: { $ref: "#/components/schemas/CambioRectificacionEntrada" }

    CambioRectificacion:
      type: object
      required: [vacuna, dosis, municipioProcedencia, dimensiones, claveCombinacion, celdaNueva, cantidadAnterior, cantidadNueva]
      properties:
        vacuna:
          type: object
          required: [id, codigo, nombre]
          properties:
            id: { type: integer, example: 3 }
            codigo: { type: string, example: HEXA }
            nombre: { type: string, example: Hexavalente }
        dosis:
          type: object
          required: [codigo, nombre]
          properties:
            codigo: { type: string, example: D3 }
            nombre: { type: string, example: 3.ª dosis }
        municipioProcedencia:
          type: object
          required: [id, nombre]
          properties:
            id: { type: integer, example: 7 }
            nombre: { type: string, example: San Marcos }
        dimensiones:
          type: array
          description: El grupo de edad primero y las demás por código; vacía si la vacuna no desagrega
          items:
            type: object
            required: [codigo, nombre, valor, etiqueta]
            properties:
              codigo: { type: string, example: grupo_edad }
              nombre: { type: string, example: Grupo de edad }
              valor: { type: string, example: MENOR_1 }
              etiqueta: { type: string, example: "< 1 año" }
        claveCombinacion: { type: string, example: grupo_edad=MENOR_1 }
        celdaNueva: { type: boolean, description: "`true` si la celda no existía (`detalle_id` `NULL`)", example: false }
        cantidadAnterior: { type: integer, minimum: 0, example: 87 }
        cantidadNueva: { type: integer, minimum: 0, example: 93 }

    ReporteDeRectificacion:
      type: object
      required: [id, establecimiento, periodo, estado]
      properties:
        id: { type: integer, example: 228 }
        establecimiento: { $ref: "#/components/schemas/EstablecimientoDeReporte" }
        periodo:
          type: object
          required: [id, anio, mes]
          properties:
            id: { type: integer, example: 8 }
            anio: { type: integer, example: 2026 }
            mes: { type: integer, minimum: 1, maximum: 12, example: 8 }
        estado: { $ref: "#/components/schemas/EstadoReporte" }

    SolicitudRectificacionResumen:
      type: object
      required: [id, reporte, estado, motivo, solicitadoPor, solicitadoEn, cambios]
      properties:
        id: { type: integer, example: 4 }
        reporte: { $ref: "#/components/schemas/ReporteDeRectificacion" }
        estado: { $ref: "#/components/schemas/EstadoRectificacion" }
        motivo: { type: string, example: Faltó sumar la jornada de vacunación del 28 de agosto. }
        solicitadoPor: { $ref: "#/components/schemas/RevisorResumen" }
        solicitadoEn: { type: string, format: date-time, example: "2026-10-31T16:00:00.000Z" }
        cambios: { type: integer, minimum: 1, description: Número de celdas que cambia, example: 2 }

    SolicitudRectificacion:
      type: object
      required: [id, reporte, estado, motivo, solicitadoPor, solicitadoEn, resueltoPor, comentarioResolucion, resueltoEn, aplicadoEn, cambios, solicitudesDelMes]
      properties:
        id: { type: integer, example: 4 }
        reporte: { $ref: "#/components/schemas/ReporteDeRectificacion" }
        estado: { $ref: "#/components/schemas/EstadoRectificacion" }
        motivo: { type: string, example: Faltó sumar la jornada de vacunación del 28 de agosto. }
        solicitadoPor: { $ref: "#/components/schemas/RevisorResumen" }
        solicitadoEn: { type: string, format: date-time, example: "2026-10-31T16:00:00.000Z" }
        resueltoPor:
          allOf: [{ $ref: "#/components/schemas/RevisorResumen" }]
          nullable: true
          description: "`null` mientras está `PENDIENTE`; el revisor que la aprobó o rechazó"
        comentarioResolucion: { type: string, nullable: true, description: "El comentario al aprobar (opcional) o el motivo del rechazo", example: null }
        resueltoEn: { type: string, format: date-time, nullable: true, example: null }
        aplicadoEn: { type: string, format: date-time, nullable: true, example: null }
        cambios:
          type: array
          description: Vacía solo en solicitudes anteriores al SPEC 40
          items: { $ref: "#/components/schemas/CambioRectificacion" }
        totales:
          type: array
          description: |
            Solo en una `PENDIENTE`: las vacunas con cambios cuyo total declarado no coincidiría con la suma de sus
            celdas después de aplicar. Vacía si todo cuadra.
          items: { $ref: "#/components/schemas/TotalRectificacion" }
        solicitudesDelMes:
          allOf: [{ $ref: "#/components/schemas/ConteoRectificacionesDelMes" }]
          description: |
            Las solicitudes del establecimiento en el mes de Guatemala del `solicitadoEn` de esta, incluida esta y
            las posteriores de ese mes, en cualquier estado.

    ConteoRectificacionesDelMes:
      type: object
      required: [anio, mes, cantidad, umbral]
      properties:
        anio: { type: integer, example: 2026 }
        mes: { type: integer, minimum: 1, maximum: 12, example: 11 }
        cantidad: { type: integer, minimum: 0, description: "En el conteo previo, las que ya existen (sin la que se va a crear)", example: 4 }
        umbral: { type: integer, description: "Solicitudes al mes desde las que se avisa; la que llega a este número crea la alerta", example: 5 }

    SolicitudRectificacionAplicada:
      allOf:
        - { $ref: "#/components/schemas/SolicitudRectificacion" }
        - type: object
          required: [corridas]
          properties:
            corridas:
              type: array
              description: Las corridas `RECTIFICACION`, del mes del reporte en adelante
              items: { $ref: "#/components/schemas/CorridaDeCierre" }

    TotalRectificacion:
      type: object
      required: [vacunaId, vacuna, totalDeclarado, sumaActual, sumaConCambios]
      properties:
        vacunaId: { type: integer, example: 3 }
        vacuna: { type: string, example: Hexavalente }
        totalDeclarado: { type: integer, minimum: 0, description: "El campo adicional `total_dosis_declarado`", example: 201 }
        sumaActual: { type: integer, minimum: 0, example: 201 }
        sumaConCambios: { type: integer, minimum: 0, example: 207 }

    ResolucionRectificacionAprobar:
      type: object
      additionalProperties: false
      properties:
        comentario: { type: string, maxLength: 500, description: Opcional; se recorta y vacío cuenta como ausente, example: Se verificó con el libro de vacunación. }

    ResolucionRectificacionRechazar:
      type: object
      additionalProperties: false
      required: [comentario]
      properties:
        comentario: { type: string, minLength: 1, maxLength: 500, description: El motivo del rechazo; se recorta, example: El libro de vacunación no muestra esas dosis. }

    PaginaRectificaciones:
      description: Página de solicitudes de rectificación, con la forma paginada común (ver `PaginaUsuarios`)
      type: object
      required: [elementos, total, pagina, porPagina]
      properties:
        elementos:
          type: array
          items: { $ref: "#/components/schemas/SolicitudRectificacionResumen" }
        total: { type: integer, minimum: 0, example: 1 }
        pagina: { type: integer, minimum: 1, example: 1 }
        porPagina: { type: integer, minimum: 1, maximum: 100, example: 20 }

    CorridaNueva:
      type: object
      required: [anio, mesHasta]
      additionalProperties: false
      properties:
        anio: { type: integer, minimum: 2000, maximum: 2100, example: 2026 }
        mesHasta: { type: integer, minimum: 1, maximum: 12, description: Mes de corte del acumulado, example: 8 }

    Corrida:
      type: object
      required: [id, ddriss, anio, mesHasta, motivo, estado, vigente, parcial, mesesSinCerrar, disparadaPor, iniciadaEn, finalizadaEn, indicadores, omitidos, totalResultados]
      properties:
        id: { type: integer, example: 7 }
        ddriss:
          type: object
          required: [id, codigo]
          properties:
            id: { type: integer, example: 1 }
            codigo: { type: string, example: DDRISS_SM }
        anio: { type: integer, example: 2026 }
        mesHasta: { type: integer, minimum: 1, maximum: 12, example: 8 }
        motivo: { type: string, enum: [CIERRE_PERIODO, RECTIFICACION, MANUAL, PROGRAMADA], example: MANUAL }
        estado: { type: string, enum: [COMPLETADA, FALLIDA], example: COMPLETADA }
        vigente: { type: boolean, description: La última `COMPLETADA` de su DDRISS, año y mes, example: true }
        parcial:
          type: boolean
          description: |
            `true` si algún mes de enero al corte no estaba `CERRADO` en la DDRISS cuando empezó la corrida (se
            deduce de `cierre_periodo.cerrado_en`; no se guarda)
          example: false
        mesesSinCerrar:
          type: array
          description: Los meses (1 a 12) que hacen parcial la corrida
          items: { type: integer, minimum: 1, maximum: 12 }
          example: []
        disparadaPor:
          allOf: [{ $ref: "#/components/schemas/RevisorResumen" }]
          nullable: true
          description: Quien la pidió, cerró el mes o aprobó la rectificación; `null` si no tuvo usuario
        iniciadaEn: { type: string, format: date-time, example: "2026-11-03T16:05:00.000Z" }
        finalizadaEn: { type: string, format: date-time, nullable: true, example: "2026-11-03T16:05:02.000Z" }
        indicadores:
          type: array
          description: Los indicadores calculados con la versión usada (en la corrida de la semilla, sin bitácora, salen de sus resultados)
          items:
            type: object
            required: [codigo, version, nombre, tipoCalculo, esIndicadorMapa, umbrales, umbralesProvisionales, prorrateo, clasificacionPoblacion, descripcionPoblacion]
            properties:
              codigo: { type: string, example: COB_HEXA3 }
              version: { type: integer, example: 1 }
              nombre: { type: string, nullable: true, description: "`null` si la versión ya no está en MongoDB", example: Cobertura de Hexavalente 3.ª dosis }
              tipoCalculo: { type: string, nullable: true, example: COBERTURA }
              esIndicadorMapa:
                type: boolean
                description: De la versión usada (SPEC 50); `false` si no lo tiene o si la versión ya no está en MongoDB
                example: false
              umbrales:
                type: array
                description: Las franjas del semáforo de la versión usada (la leyenda del mapa); vacío si no tiene
                items: { $ref: "#/components/schemas/UmbralIndicador" }
              umbralesProvisionales:
                type: boolean
                description: De la versión usada; `false` si no lo tiene
                example: true
              prorrateo:
                type: string
                nullable: true
                enum: [NINGUNO, MENSUAL_LINEAL, null]
                description: |
                  `denominador.prorrateo` de la versión usada (SPEC 60). `NINGUNO` en una cobertura es la cobertura
                  anual. `null` en los tipos sin prorrateo o si la versión ya no está en MongoDB.
                example: NINGUNO
              clasificacionPoblacion:
                type: string
                nullable: true
                description: |
                  `aplica_a[0].clasificacion_poblacion` de la versión usada (SPEC 60), para agrupar las columnas de la
                  tabla de la red. `null` en los tipos sin población o si la versión ya no está en MongoDB.
                example: MENOR_1
              descripcionPoblacion:
                type: string
                nullable: true
                description: |
                  La descripción de `clasificacionPoblacion` en el catálogo `clasificacion_poblacion` (SPEC 60), para
                  los encabezados de la tabla de la red sin pedir otro permiso. `null` si no hay clasificación o si
                  el código no está en el catálogo.
                example: Menores de 1 año
        omitidos:
          type: array
          description: Los indicadores que aplicaban y no se calcularon, con el motivo
          items:
            type: object
            required: [codigo, motivo]
            properties:
              codigo: { type: string, example: PROY_COB_HEXA3 }
              motivo: { type: string, example: El indicador base COB_HEXA3 no aplica a la DDRISS. }
        totalResultados: { type: integer, minimum: 0, example: 62 }

    CorridaConResultados:
      allOf:
        - { $ref: "#/components/schemas/Corrida" }
        - type: object
          required: [resultados]
          properties:
            resultados:
              type: array
              items: { $ref: "#/components/schemas/ResultadoIndicador" }

    PaginaCorridas:
      description: Página de corridas, con la forma paginada común (ver `PaginaUsuarios`)
      type: object
      required: [elementos, total, pagina, porPagina]
      properties:
        elementos:
          type: array
          items: { $ref: "#/components/schemas/Corrida" }
        total: { type: integer, minimum: 0, example: 1 }
        pagina: { type: integer, minimum: 1, example: 1 }
        porPagina: { type: integer, minimum: 1, maximum: 100, example: 20 }

    ResultadosVigentes:
      type: object
      required: [corrida, resultados]
      properties:
        corrida:
          allOf: [{ $ref: "#/components/schemas/Corrida" }]
          nullable: true
          description: "`null` si el mes todavía no tiene corrida vigente"
        resultados:
          type: array
          items: { $ref: "#/components/schemas/ResultadoIndicador" }

    SerieIndicador:
      type: object
      required: [puntos]
      properties:
        puntos:
          type: array
          description: De enero a diciembre, solo los meses con corrida vigente que tiene el indicador
          items:
            type: object
            required: [mes, corridaId, parcial, poblacionAnual, resultado]
            properties:
              mes: { type: integer, minimum: 1, maximum: 12, description: Mes de corte de la corrida, example: 1 }
              corridaId: { type: integer, example: 210 }
              parcial:
                type: boolean
                description: Como `Corrida.parcial`
                example: false
              poblacionAnual:
                type: number
                nullable: true
                description: |
                  Población del año del grupo del indicador, sin prorrateo (de la DDRISS o del municipio pedido).
                  `null` sin grupo de población (`DESERCION`) o si el año no tiene esa población.
                example: 24550
              resultado: { $ref: "#/components/schemas/ResultadoIndicador" }

    MesesCalculados:
      type: object
      required: [anios]
      properties:
        anios:
          type: array
          description: Del año más reciente al más antiguo; vacío si la DDRISS no tiene corridas vigentes
          items:
            type: object
            required: [anio, meses]
            properties:
              anio: { type: integer, example: 2026 }
              meses:
                type: array
                description: Meses de corte con corrida vigente `COMPLETADA`, en orden
                items: { type: integer, minimum: 1, maximum: 12 }
                example: [1, 2, 3, 4, 5, 6, 7, 8, 9]

    ResultadoIndicador:
      type: object
      required: [indicadorCodigo, indicadorVersion, tipoCalculo, municipio, red, vacuna, dosis, filtroDimensiones, anio, mes, numerador, denominador, valor, meta, brechaDosis, cumpleMeta, calculable, color, esperado, esProyeccion, mayorACien, metaDosis, excedenteDosis, sumaBrechasMunicipales, proyeccion]
      properties:
        indicadorCodigo: { type: string, example: AVANCE_HEXA3 }
        indicadorVersion: { type: integer, description: Versión de `configuracion_indicadores` usada, example: 1 }
        tipoCalculo: { type: string, nullable: true, description: "`null` si la versión ya no está en MongoDB", example: AVANCE_META_MES }
        municipio:
          type: object
          nullable: true
          description: "`null` en la fila departamental (toda la DDRISS)"
          required: [id, nombre, codigoIne]
          properties:
            id: { type: integer, example: 1 }
            nombre: { type: string, example: San Marcos }
            codigoIne: { type: string, description: La llave del GeoJSON del mapa (SPEC 50), example: "1201" }
        red:
          type: object
          nullable: true
          description: "Solo en la fila «Total de la red» (SPEC 60, con `redId`), que lleva `municipio: null`; `null` en las demás"
          required: [id, nombre]
          properties:
            id: { type: integer, example: 1 }
            nombre: { type: string, example: Red No. 1 }
        vacuna:
          type: object
          required: [codigo, nombre]
          properties:
            codigo: { type: string, example: HEXA }
            nombre: { type: string, example: Hexavalente }
        dosis: { type: string, nullable: true, description: "La dosis evaluada; en `DESERCION`, la final; en `PROYECCION`, la del indicador base", example: D3 }
        filtroDimensiones: { type: string, description: "Filtro aplicado en forma canónica; vacío sin filtro", example: grupo_edad=MENOR_1 }
        anio: { type: integer, example: 2026 }
        mes: { type: integer, description: Mes de corte, example: 8 }
        numerador:
          type: number
          nullable: true
          description: |
            Dosis acumuladas. En `DESERCION`, la pérdida: dosis iniciales − dosis finales (puede ser negativa). En
            `PROYECCION`, las dosis proyectadas a diciembre (con decimales); `null` sin meses cerrados en la ventana.
          example: 975
        denominador:
          type: number
          nullable: true
          description: |
            Población (prorrateada al mes con `MENSUAL_LINEAL`); `null` sin población. En `DESERCION`, las dosis
            iniciales (las finales son `denominador − numerador`). En `PROYECCION`, la población anual del grupo
            del indicador base, sin prorrateo.
          example: 966.67
        valor: { type: number, nullable: true, description: "Porcentaje; en `DESERCION`, la tasa de deserción (puede ser negativa); en `PROYECCION`, la cobertura estimada a diciembre", example: 100.8621 }
        meta: { type: number, nullable: true, example: 100 }
        brechaDosis: { type: integer, nullable: true, description: "Dosis que faltan para la meta (0 si se alcanzó); `null` en `DESERCION`; en `PROYECCION`, las que faltarían en diciembre", example: 0 }
        cumpleMeta: { type: boolean, nullable: true, description: "En `PROYECCION`, si el municipio llegaría a la meta en diciembre", example: true }
        calculable: { type: boolean, description: "`false` si falta la población, en `DESERCION` si no hubo dosis iniciales y en `PROYECCION` si no hubo meses cerrados en la ventana (`valor` es `null`)", example: true }
        color:
          type: string
          nullable: true
          enum: [verde, amarillo, rojo, null]
          description: |
            Franja del semáforo de la versión usada; `null` sin umbrales o sin valor. En una `COBERTURA` con
            prorrateo `NINGUNO` (SPEC 60), los cortes se aplican al cumplimiento de lo esperado del mes
            (`valor` ÷ `esperado` × 100), no al valor. Se calcula al leer.
          example: verde
        esperado:
          type: number
          nullable: true
          description: |
            Solo en una `COBERTURA` con prorrateo `NINGUNO` (SPEC 60): el porcentaje de la población anual que se
            espera al mes de corte, 100 ÷ 12 × `mes`, a 2 decimales (58.33 a julio). `null` en los demás. Se calcula
            al leer.
          example: 58.33
        esProyeccion: { type: boolean, description: "`true` en `PROYECCION`: es una estimación, no un dato registrado", example: false }
        mayorACien:
          type: boolean
          description: |
            `true` si el tipo es `COBERTURA`, `AVANCE_META_MES` o `BRECHA`, la fila no es una proyección y `valor` es
            mayor a 100 (SPEC 52): pide revisar la población (denominador) o los registros. Compara el `valor`
            guardado, así que 100.0001 se marca aunque se muestre como 100.0 %. `false` en la deserción, la
            proyección, las filas no calculables y si la versión ya no está en MongoDB. Se calcula al leer.
          example: false
        metaDosis:
          type: integer
          nullable: true
          description: |
            La meta en dosis: ⌈meta ÷ 100 × denominador⌉. Se calcula al leer; `null` si la fila no es calculable.
            Siempre se cumple `metaDosis − numerador = brechaDosis − excedenteDosis`.
          example: 967
        excedenteDosis:
          type: integer
          nullable: true
          description: |
            Dosis por encima de la meta: máx(0, numerador − `metaDosis`). Se calcula al leer; `null` si la fila no
            es calculable. Si es mayor que 0, `brechaDosis` es 0.
          example: 8
        sumaBrechasMunicipales:
          type: integer
          nullable: true
          description: |
            Solo en la fila departamental: la suma de `brechaDosis` de los municipios del mismo indicador, donde los
            que pasaron la meta no compensan a los demás (a diferencia de `brechaDosis` de esa fila, que compara el
            total del departamento). Se calcula al leer; `null` en las filas municipales y si la departamental no
            es calculable.
          example: null
        proyeccion:
          type: object
          nullable: true
          description: |
            Solo en `PROYECCION` (SPEC 47); `null` en los demás tipos. Se arma al leer, no se guarda.
          required: [indicadorBase, mesesVentana, mesesUsados, dosisAcumuladas, ritmoMensual]
          properties:
            indicadorBase: { type: string, description: "`parametros.indicador_base` de la versión usada", example: COB_HEXA3 }
            mesesVentana: { type: integer, description: "`parametros.meses_ventana` de la versión usada", example: 3 }
            mesesUsados:
              type: array
              description: |
                Los meses de la ventana: los últimos `mesesVentana` meses de enero al corte que estaban `CERRADO`
                al iniciar la corrida. Vacío si no hubo ninguno.
              items: { type: integer, minimum: 1, maximum: 12 }
              example: [6, 7, 8]
            dosisAcumuladas:
              type: number
              nullable: true
              description: El `numerador` de la fila del indicador base del mismo municipio en la misma corrida; `null` si no está
              example: 975
            ritmoMensual:
              type: number
              nullable: true
              description: |
                (`numerador` − `dosisAcumuladas`) ÷ (12 − `mes`), a 2 decimales. `null` con corte en diciembre o si
                falta el `numerador` o `dosisAcumuladas`.
              example: 121.33

    CorridaDeCierre:
      type: object
      required: [id, mesHasta, estado]
      description: Corrida de indicadores que se calculó después de confirmar el cierre o la rectificación
      properties:
        id: { type: integer, example: 8 }
        mesHasta: { type: integer, minimum: 1, maximum: 12, example: 8 }
        estado: { type: string, enum: [COMPLETADA, FALLIDA], example: COMPLETADA }
