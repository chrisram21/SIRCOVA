openapi: 3.0.3
info:
  title: API del sistema web de producción de vacunación (DDRISS San Marcos)
  version: 0.1.0
  description: |
    Versión preliminar. Endpoints principales para que el sistema funcione de punta a punta:
    acceso, catálogos, configuración de formularios, registro de producción, revisión y cierre,
    indicadores, alertas y auditoría.

    El modelo de datos está descrito en `05_contexto_base_de_datos.md`.
    El sistema maneja solo datos agregados: ningún endpoint recibe ni devuelve datos de pacientes.

    Todas las rutas, salvo `/salud` y `/auth/login`, exigen el encabezado `Authorization: Bearer <token>`.
    En cada petición se revisa además la cuenta del token: si la cuenta o su empleado están desactivados
    responde 401 `CUENTA_DESACTIVADA`, y si el rol, el establecimiento o el municipio ya no son los del
    token responde 401 `SESION_DESACTUALIZADA`. En los dos casos hay que iniciar sesión de nuevo.

    **Cambio obligatorio de contraseña.** Mientras la cuenta tenga `debeCambiarContrasena` (por ejemplo,
    con la contraseña temporal que le dio el administrador), todo endpoint protegido responde
    403 `CAMBIO_CONTRASENA_REQUERIDO` (respuesta `CambioContrasenaRequerido`), salvo `POST /auth/contrasena`,
    `POST /auth/logout` y `GET /auth/yo`. Ese 403 no se registra en la bitácora.

    **Permisos.** Cada función exige su propio permiso, con la forma `ENTIDAD_ACCION` (por ejemplo,
    `USUARIO_CREAR`). Cada operación protegida declara el suyo con la extensión `x-permiso: CODIGO` y
    documenta la respuesta `"403": { $ref: "#/components/responses/SinPermiso" }`. El rol `AUTORIDAD`
    es de solo consulta: recibe 403 en cualquier método distinto de `GET` aunque tenga el permiso.
    `/salud`, `POST /auth/login`, `POST /auth/logout`, `POST /auth/contrasena` y `GET /auth/yo` no llevan permiso.
    Un recurso fuera del ámbito del usuario (su establecimiento o su DDRISS) responde 404, igual que
    uno que no existe.

    **Bitácora.** Toda escritura, cada exportación y cada acceso denegado quedan en la bitácora, que no se puede modificar ni borrar.
servers:
  - url: http://localhost:3000/api/v1
    description: Desarrollo local

tags:
  - name: Sistema
  - name: Autenticación
  - name: Usuarios
  - name: Catálogos
  - name: Configuración
  - name: Producción
  - name: Revisión
  - name: Indicadores
  - name: Alertas y auditoría

security:
  - bearerAuth: []

paths:
  /salud:
    get:
      tags: [Sistema]
      summary: Estado de la API y de las conexiones a MySQL y MongoDB
      description: |
        Comprueba cada base con un tiempo límite de 5 segundos. Solo informa `ok` o `error`;
        el detalle técnico de la falla queda en el registro del servidor, nunca en la respuesta.
      security: []
      responses:
        "200":
          description: La API y las bases de datos responden
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado: { type: string, example: ok }
                  mysql: { type: string, enum: [ok, error], example: ok }
                  mongo: { type: string, enum: [ok, error], example: ok }
        "503":
          description: Una o ambas bases de datos no responden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  codigo: BD_NO_DISPONIBLE
                  mensaje: Una o más bases de datos no responden.
                  detalles:
                    - { mysql: ok, mongo: error }

  # ---------------------------------------------------------------- Autenticación
  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      description: |
        Devuelve un JWT (HS256) que vence según `JWT_EXPIRACION` y contiene `sub`, `rol`, `permisos`,
        `ddrissId`, `establecimientoId` y `municipioId`.

        Al 5.º intento fallido seguido la cuenta se bloquea 15 minutos; ese mismo intento ya responde 423.
        Un usuario inexistente y una contraseña incorrecta responden el mismo 401.
        Los 403 solo se devuelven si la contraseña es correcta.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombreUsuario, contrasena]
              properties:
                nombreUsuario: { type: string, example: jperez }
                contrasena: { type: string, format: password }
      responses:
        "200":
          description: Sesión iniciada
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... }
                  usuario: { $ref: "#/components/schemas/UsuarioSesion" }
        "400":
          description: Falta el nombre de usuario o la contraseña
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: Debe indicar el nombre de usuario y la contraseña. }
        "401":
          description: Usuario inexistente o contraseña incorrecta (mismo cuerpo en ambos casos)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: CREDENCIALES_INVALIDAS, mensaje: Usuario o contraseña incorrectos. }
        "403":
          description: Contraseña correcta, pero la cuenta está desactivada o no tiene alcance asignado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                desactivada:
                  value:
                    error: { codigo: CUENTA_DESACTIVADA, mensaje: Su cuenta está desactivada; contacte al administrador. }
                sinAlcance:
                  value:
                    error: { codigo: CUENTA_SIN_ALCANCE, mensaje: Su cuenta no tiene una DDRISS o un establecimiento asignado; contacte al administrador. }
        "423":
          description: Cuenta bloqueada por intentos fallidos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: CUENTA_BLOQUEADA, mensaje: Su usuario ha sido bloqueado. Contáctese con su administrador de DDRISS o intente de nuevo en 15 minutos. }

  /auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar sesión
      description: |
        Registra el cierre en la bitácora (acción `LOGOUT` con el motivo). No revoca el token:
        sigue siendo válido hasta su `exp`, pero el frontend ya lo borró.

        El cuerpo es opcional; sin `motivo` se registra `MANUAL`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CierreSesionEntrada" }
      responses:
        "204": { description: Cierre de sesión registrado }
        "400":
          description: El motivo no es MANUAL ni INACTIVIDAD
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: El motivo del cierre de sesión no es válido. }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /auth/contrasena:
    post:
      tags: [Autenticación]
      summary: Cambiar la contraseña propia
      description: |
        Exige la contraseña actual. La nueva debe tener al menos 12 caracteres y como máximo 72 bytes
        en UTF-8 (límite de bcrypt), obtener 3 o más (de 0 a 4) en zxcvbn y no contener ninguna palabra
        de 3 letras o más del nombre de usuario, los nombres o los apellidos (sin importar mayúsculas
        ni tildes). No se exigen mayúsculas, números ni símbolos.

        Se revisa en este orden: formato, contraseña actual, nueva igual a la actual y política.
        Una contraseña actual incorrecta no suma a los intentos fallidos ni se registra en la bitácora.

        El cambio deja `debeCambiarContrasena` en `false` y queda en la bitácora (acción `CAMBIO_CONTRASENA`)
        sin las contraseñas. El token sigue siendo válido hasta su `exp`; el frontend cierra la sesión.
        Es una de las rutas que se pueden usar mientras la cuenta deba cambiar la contraseña.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CambioContrasenaEntrada" }
      responses:
        "204": { description: Contraseña cambiada }
        "400":
          description: Falta un campo, no es texto o viene un campo que no se acepta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: Debe indicar la contraseña actual y la nueva. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "422":
          description: La contraseña actual no coincide, la nueva es igual a la actual o no cumple la política
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                actualIncorrecta:
                  value:
                    error: { codigo: CONTRASENA_ACTUAL_INCORRECTA, mensaje: La contraseña actual no es correcta. }
                repetida:
                  value:
                    error: { codigo: CONTRASENA_REPETIDA, mensaje: La contraseña nueva debe ser distinta de la actual. }
                debil:
                  value:
                    error: { codigo: CONTRASENA_DEBIL, mensaje: Debe tener al menos 12 caracteres. }

  /auth/yo:
    get:
      tags: [Autenticación]
      summary: Datos de la sesión actual (usuario, empleado, rol y permisos)
      responses:
        "200":
          description: Sesión actual
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioSesion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  # ---------------------------------------------------------------- Usuarios
  /empleados:
    get:
      tags: [Usuarios]
      summary: Listar empleados
      parameters:
        - { $ref: "#/components/parameters/Pagina" }
        - { $ref: "#/components/parameters/PorPagina" }
      responses:
        "200": { description: Lista paginada de empleados }
    post:
      tags: [Usuarios]
      summary: Registrar un empleado de la DDRISS del administrador (puede existir sin cuenta)
      description: |
        La DDRISS del empleado es siempre la del usuario que lo registra; no viene en el cuerpo.
        Con establecimiento, el municipio se toma del establecimiento; `municipioId` solo se acepta
        sin establecimiento y debe ser del departamento sede de la DDRISS. Los textos vacíos se guardan como `null`.
      x-permiso: EMPLEADO_CREAR
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmpleadoEntrada" }
      responses:
        "201":
          description: Empleado creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Empleado" }
        "400": { $ref: "#/components/responses/EntradaInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "409":
          description: Correo o código de empleado repetido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                correo:
                  value:
                    error: { codigo: CORREO_DUPLICADO, mensaje: Ya hay un empleado con ese correo. }
                codigo:
                  value:
                    error: { codigo: CODIGO_EMPLEADO_DUPLICADO, mensaje: Ya hay un empleado con ese código. }
        "422":
          description: Establecimiento o municipio fuera del ámbito, inexistente o inactivo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                establecimiento:
                  value:
                    error: { codigo: ESTABLECIMIENTO_INVALIDO, mensaje: El establecimiento no existe, está inactivo o no es de su DDRISS. }
                municipio:
                  value:
                    error: { codigo: MUNICIPIO_INVALIDO, mensaje: El municipio no existe, está inactivo o no es del departamento de su DDRISS. }

  /empleados/{id}:
    patch:
      tags: [Usuarios]
      summary: Editar los datos de un empleado de la DDRISS del administrador
      description: |
        Cambio parcial: solo se envían los campos que cambian, y al menos uno. `null` o un texto vacío borran
        un campo opcional. Las reglas de establecimiento y municipio se aplican al resultado (lo guardado más
        lo que llega): con establecimiento, el municipio se toma de él. Si la cuenta del empleado tiene rol
        `ESTABLECIMIENTO`, no se le puede quitar el establecimiento. Si la cuenta del empleado está
        desactivada, primero hay que restaurarla. Una petición que no cambia nada responde 200 sin
        registrar nada en la bitácora.
      x-permiso: EMPLEADO_EDITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmpleadoCambios" }
      responses:
        "200":
          description: Empleado actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Empleado" }
        "400": { $ref: "#/components/responses/EntradaInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: Correo o código de empleado repetido, o la cuenta del empleado está desactivada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                correo:
                  value:
                    error: { codigo: CORREO_DUPLICADO, mensaje: Ya hay un empleado con ese correo. }
                codigo:
                  value:
                    error: { codigo: CODIGO_EMPLEADO_DUPLICADO, mensaje: Ya hay un empleado con ese código. }
                cuentaDesactivada:
                  value:
                    error: { codigo: CUENTA_DESACTIVADA, mensaje: La cuenta está desactivada; restáurela para editarla. }
        "422":
          description: Establecimiento o municipio inválido, o se quita el establecimiento a una cuenta ESTABLECIMIENTO
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                establecimiento:
                  value:
                    error: { codigo: ESTABLECIMIENTO_INVALIDO, mensaje: El establecimiento no existe, está inactivo o no es de su DDRISS. }
                municipio:
                  value:
                    error: { codigo: MUNICIPIO_INVALIDO, mensaje: El municipio no existe, está inactivo o no es del departamento de su DDRISS. }
                sinEstablecimiento:
                  value:
                    error: { codigo: EMPLEADO_SIN_ESTABLECIMIENTO, mensaje: Para el rol de personal del establecimiento, el empleado debe tener un establecimiento. }

  /usuarios:
    get:
      tags: [Usuarios]
      summary: Listar las cuentas de la DDRISS del usuario, activas y desactivadas
      description: |
        Versión mínima, sin búsqueda, filtros ni paginación (HU-07 los agrega). Ordenadas por apellidos y
        nombres del empleado. Nunca devuelve la contraseña, su hash, los intentos fallidos ni la fecha del
        bloqueo; solo `bloqueada`.
      x-permiso: USUARIO_CONSULTAR
      responses:
        "200":
          description: Cuentas del ámbito del usuario
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UsuarioDetalle" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
    post:
      tags: [Usuarios]
      summary: Crear la cuenta de acceso de un empleado (solo Administrador)
      description: |
        El sistema genera la contraseña temporal (12 caracteres que cumplen la política de contraseñas),
        la guarda con bcrypt y la devuelve una sola vez en la respuesta. La cuenta queda con
        `debeCambiarContrasena: true`. La bitácora no guarda la contraseña.
        El empleado debe estar activo, ser de la DDRISS del administrador y no tener cuenta.
        El rol `ESTABLECIMIENTO` exige que el empleado tenga establecimiento.
      x-permiso: USUARIO_CREAR
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsuarioEntrada" }
      responses:
        "201":
          description: Cuenta creada, con la contraseña temporal generada; nunca devuelve su hash
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioCreado" }
        "400":
          description: La solicitud no cumple el formato esperado, o trae `contrasenaTemporal`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: La contraseña temporal la genera el sistema; no la envíe. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: El empleado ya tiene cuenta o el nombre de usuario ya existe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                empleadoConCuenta:
                  value:
                    error: { codigo: EMPLEADO_CON_CUENTA, mensaje: El empleado ya tiene una cuenta. }
                nombreUsuario:
                  value:
                    error: { codigo: NOMBRE_USUARIO_DUPLICADO, mensaje: Ya existe ese nombre de usuario. }
        "422":
          description: Rol inexistente o rol ESTABLECIMIENTO para un empleado sin establecimiento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                rol:
                  value:
                    error: { codigo: ROL_INVALIDO, mensaje: El rol no existe. }
                sinEstablecimiento:
                  value:
                    error: { codigo: EMPLEADO_SIN_ESTABLECIMIENTO, mensaje: Para el rol de personal del establecimiento, el empleado debe tener un establecimiento. }

  /roles:
    get:
      tags: [Usuarios]
      summary: Listar los roles
      x-permiso: ROL_CONSULTAR
      responses:
        "200":
          description: Los cinco roles
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    codigo: { type: string, example: REVISOR }
                    nombre: { type: string, example: Estadígrafa / revisor DDRISS }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /usuarios/{id}:
    get:
      tags: [Usuarios]
      summary: Consultar una cuenta de la DDRISS del usuario
      x-permiso: USUARIO_CONSULTAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: La cuenta con los datos de su empleado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioDetalle" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
    patch:
      tags: [Usuarios]
      summary: Cambiar el rol de una cuenta
      description: |
        Solo cambia el rol; para desactivar o restaurar se usan `/desactivar` y `/restaurar`.
        No se puede cambiar el rol propio ni el de una cuenta desactivada. El rol `ESTABLECIMIENTO` exige
        que el empleado tenga establecimiento. Se revisa en este orden: cuenta (404), cuenta desactivada (409),
        cuenta propia (422), rol (422) y establecimiento (422). El mismo rol responde 200 sin registrar nada
        en la bitácora.
      x-permiso: USUARIO_EDITAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rolId]
              additionalProperties: false
              properties:
                rolId: { type: integer }
      responses:
        "200":
          description: Cuenta actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioDetalle" }
        "400": { $ref: "#/components/responses/EntradaInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: La cuenta está desactivada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: CUENTA_DESACTIVADA, mensaje: La cuenta está desactivada; restáurela para editarla. }
        "422":
          description: Cuenta propia, rol inexistente o rol ESTABLECIMIENTO para un empleado sin establecimiento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                cuentaPropia:
                  value:
                    error: { codigo: CUENTA_PROPIA, mensaje: No puede cambiar su propio rol. }
                rol:
                  value:
                    error: { codigo: ROL_INVALIDO, mensaje: El rol no existe. }
                sinEstablecimiento:
                  value:
                    error: { codigo: EMPLEADO_SIN_ESTABLECIMIENTO, mensaje: Para el rol de personal del establecimiento, el empleado debe tener un establecimiento. }

  /usuarios/{id}/desactivar:
    post:
      tags: [Usuarios]
      summary: Desactivar una cuenta (desactivación lógica; el empleado y su historial no cambian)
      description: |
        Pone `activo: false` y la fecha de desactivación. La cuenta ya no puede iniciar sesión, y su sesión
        abierta recibe 401 `CUENTA_DESACTIVADA` en la siguiente petición. No se puede desactivar la cuenta
        propia. Una cuenta ya desactivada responde 200 sin registrar nada en la bitácora.
      x-permiso: USUARIO_DESACTIVAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Cuenta desactivada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioDetalle" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "422":
          description: Es la cuenta propia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: CUENTA_PROPIA, mensaje: No puede desactivar su propia cuenta. }

  /usuarios/{id}/restaurar:
    post:
      tags: [Usuarios]
      summary: Restaurar una cuenta desactivada
      description: |
        Pone `activo: true` y limpia la fecha de desactivación, los intentos fallidos y el bloqueo.
        Una cuenta ya activa responde 200 sin registrar nada en la bitácora.
      x-permiso: USUARIO_DESACTIVAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Cuenta restaurada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioDetalle" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: El empleado de la cuenta está inactivo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: EMPLEADO_INACTIVO, mensaje: El empleado de esta cuenta está inactivo. }

  /usuarios/{id}/desbloquear:
    post:
      tags: [Usuarios]
      summary: Quitar el bloqueo por intentos fallidos de una cuenta (HU-62)
      description: |
        Pone los intentos fallidos en 0 y quita el bloqueo, para que la persona entre sin esperar a que venza.
        Se permite desbloquear la cuenta propia. Se revisa en este orden: cuenta (404), cuenta desactivada (409)
        y cuenta no bloqueada (409). Cada desbloqueo queda en la bitácora (`DESBLOQUEAR`).
      x-permiso: USUARIO_DESBLOQUEAR
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Cuenta desbloqueada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioDetalle" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: La cuenta está desactivada o no está bloqueada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                desactivada:
                  value:
                    error: { codigo: CUENTA_DESACTIVADA, mensaje: La cuenta está desactivada; al restaurarla se quita el bloqueo. }
                noBloqueada:
                  value:
                    error: { codigo: CUENTA_NO_BLOQUEADA, mensaje: La cuenta no está bloqueada. }

  /usuarios/{id}/restablecer-contrasena:
    post:
      tags: [Usuarios]
      summary: Restablecer la contraseña de una cuenta con una temporal generada por el sistema (HU-63)
      description: |
        Genera una contraseña temporal (12 caracteres que cumplen la política de contraseñas), guarda su hash,
        deja la cuenta con `debeCambiarContrasena: true` y quita el bloqueo si lo hay. La contraseña se
        devuelve una sola vez y la anterior deja de servir. La sesión abierta de esa cuenta recibe 403
        `CAMBIO_CONTRASENA_REQUERIDO` en la siguiente petición. Se revisa en este orden: cuenta (404), cuenta
        desactivada (409) y cuenta propia (422). Cada restablecimiento queda en la bitácora
        (`RESTABLECER_CONTRASENA`), sin la contraseña, aunque no cambie ningún otro dato.
      x-permiso: USUARIO_RESTABLECER_CONTRASENA
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Contraseña restablecida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestablecimientoContrasena" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: La cuenta está desactivada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: CUENTA_DESACTIVADA, mensaje: La cuenta está desactivada; restáurela antes de restablecer su contraseña. }
        "422":
          description: Es la cuenta propia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: CUENTA_PROPIA, mensaje: Para cambiar su propia contraseña use «Cambiar contraseña». }

  # ---------------------------------------------------------------- Catálogos
  /ddriss:
    get:
      tags: [Catálogos]
      summary: Listar las DDRISS activas del ámbito del usuario
      description: Devuelve la DDRISS del usuario; la autoridad nacional (sin DDRISS) recibe todas.
      x-permiso: DDRISS_CONSULTAR
      responses:
        "200":
          description: Lista de DDRISS
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    codigo: { type: string, example: DDRISS_SM }
                    nombre: { type: string }
                    departamentoId: { type: integer }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /municipios:
    get:
      tags: [Catálogos]
      summary: Listar los municipios activos del ámbito del usuario (codigo_ine es la llave del GeoJSON)
      description: |
        Devuelve los municipios del departamento sede de la DDRISS del usuario, ordenados por nombre;
        la autoridad nacional (sin DDRISS) recibe todos. Versión mínima de HU-04; HU-08 la amplía.
      x-permiso: MUNICIPIO_CONSULTAR
      responses:
        "200":
          description: Lista de municipios
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    departamentoId: { type: integer }
                    codigoIne: { type: string }
                    nombre: { type: string }
                    activo: { type: boolean }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }


  /establecimientos:
    get:
      tags: [Catálogos]
      summary: Listar establecimientos e instituciones del ámbito del usuario
      description: |
        Ordenados por nombre. El personal de establecimiento solo recibe el suyo; los demás roles, los de su DDRISS;
        la autoridad nacional, todos. Versión mínima de HU-04; HU-09 la amplía.
      x-permiso: ESTABLECIMIENTO_CONSULTAR
      parameters:
        - { name: municipioId, in: query, schema: { type: integer } }
        - { name: activo, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Lista de establecimientos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    codigo: { type: string }
                    nombre: { type: string }
                    tipoEstablecimientoId: { type: integer }
                    tipoEstablecimientoNombre: { type: string }
                    distritoSaludId: { type: integer, nullable: true }
                    municipioId: { type: integer }
                    municipioNombre: { type: string }
                    reportaProduccion: { type: boolean }
                    esExterno: { type: boolean }
                    activo: { type: boolean }
        "400":
          $ref: "#/components/responses/EntradaInvalida"
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "500":
          description: Error interno al consultar establecimientos
    post:
      tags: [Catálogos]
      summary: Crear un establecimiento (Administrador)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstablecimientoEntrada" }
      responses:
        "201": { description: Establecimiento creado }
        "409": { $ref: "#/components/responses/Conflicto" }

  /establecimientos/{id}:
    patch:
      tags: [Catálogos]
      summary: Actualizar o desactivar un establecimiento
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstablecimientoEntrada" }
      responses:
        "200": { description: Establecimiento actualizado }

  /vacunas:
    get:
      tags: [Catálogos]
      summary: Listar vacunas con sus dosis
      responses:
        "200":
          description: Lista de vacunas con sus dosis
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    codigo: { type: string }
                    nombre: { type: string }
                    descripcion: { type: string, nullable: true }
                    ordenInforme: { type: integer }
                    activa: { type: boolean }
                    dosis:
                      type: array
                      items:
                        type: object
                        properties:
                          id: { type: integer }
                          codigo: { type: string }
                          nombre: { type: string }
                          orden: { type: integer }
                          activa: { type: boolean }
    post:
      tags: [Catálogos]
      summary: Registrar una vacuna nueva con sus dosis (Administrador)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, nombre, dosis]
              properties:
                codigo: { type: string, example: PENTA }
                nombre: { type: string, example: Pentavalente }
                dosis:
                  type: array
                  items:
                    type: object
                    properties:
                      codigo: { type: string, example: D1 }
                      nombre: { type: string, example: Primera dosis }
                      orden: { type: integer, example: 1 }
      responses:
        "201": { description: Vacuna creada }

  /periodos:
    get:
      tags: [Catálogos]
      summary: Listar periodos mensuales de reporte
      parameters:
        - { name: anio, in: query, schema: { type: integer } }
      
      responses:
        "200":
          description: Lista de períodos mensuales
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    anio: { type: integer }
                    mes: { type: integer }
                    fechaInicio: { type: string, format: date }
                    fechaFin: { type: string, format: date }
                    fechaLimiteEnvio: { type: string, format: date }
                    estado:
                      type: string
                      enum: [ABIERTO, EN_CIERRE, CERRADO]
        "400":
          $ref: "#/components/responses/EntradaInvalida"
        "500":
          description: Error interno al consultar períodos

    post:
      tags: [Catálogos]
      summary: Abrir un periodo mensual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anio, mes, fechaLimiteEnvio]
              properties:
                anio: { type: integer, example: 2026 }
                mes: { type: integer, minimum: 1, maximum: 12 }
                fechaLimiteEnvio: { type: string, format: date }
      responses:
        "201": { description: Periodo creado }
        "409": { $ref: "#/components/responses/Conflicto" }

  /poblaciones-objetivo:
    get:
      tags: [Catálogos]
      summary: Consultar denominadores de cobertura
      parameters:
        - { name: anio, in: query, schema: { type: integer } }
        - { name: municipioId, in: query, schema: { type: integer } }
      responses:
        "200": { description: Lista de poblaciones objetivo }
    post:
      tags: [Catálogos]
      summary: Registrar o actualizar la población objetivo de un municipio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [municipioId, anio, vacunaId, clasificacionPoblacion, cantidad]
              properties:
                municipioId: { type: integer }
                anio: { type: integer }
                clasificacionPoblacion: { type: string, example: MENOR_1 }
                cantidad: { type: integer, minimum: 0 }
                fuente: { type: string }
      responses:
        "201": { description: Población registrada }

  # ---------------------------------------------------------------- Configuración (MongoDB)
  /dimensiones:
    get:
      tags: [Configuración]
      summary: Catálogo de dimensiones de desagregación y sus valores
      responses:
        "200":
          description: Lista de dimensiones configuradas
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    codigo: { type: string }
                    nombre: { type: string }
                    descripcion: { type: string, nullable: true }
                    tipo: { type: string }
                    activo: { type: boolean }
                    valores:
                      type: array
                      items:
                        type: object
                        properties:
                          codigo: { type: string }
                          etiqueta: { type: string }
                          orden: { type: integer }
                          activo: { type: boolean }
                          edadMinMeses: { type: integer }
                          edadMaxMeses: { type: integer }
        "500":
          description: Error al consultar las dimensiones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /vacunas/{codigo}/esquema-vigente:
    get:
      tags: [Configuración]
      summary: Esquema de captura VIGENTE de una vacuna (molde del formulario)
      parameters:
        - { name: codigo, in: path, required: true, schema: { type: string, example: PENTA } }
      responses:
        "200": { description: Documento de esquemas_captura }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /esquemas-captura:
    post:
      tags: [Configuración]
      summary: Crear una versión nueva (BORRADOR) del esquema de una vacuna
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Estructura de esquemas_captura (ver 05_contexto_base_de_datos.md, sección 6)
      responses:
        "201": { description: Versión creada en BORRADOR }
        "422": { $ref: "#/components/responses/ReglaNegocio" }

  /esquemas-captura/{id}/publicar:
    post:
      tags: [Configuración]
      summary: Publicar una versión (pasa a VIGENTE y la anterior a HISTORICO)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, description: ObjectId } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                motivoCambio: { type: string }
      responses:
        "200": { description: Versión publicada }
        "422": { $ref: "#/components/responses/ReglaNegocio" }

  # ---------------------------------------------------------------- Producción
  /reportes:
    get:
      tags: [Producción]
      summary: Listar reportes (limitado al alcance del usuario)
      parameters:
        - { name: periodoId, in: query, schema: { type: integer } }
        - { name: establecimientoId, in: query, schema: { type: integer } }
        - { name: estado, in: query, schema: { $ref: "#/components/schemas/EstadoReporte" } }
        - { $ref: "#/components/parameters/Pagina" }
        - { $ref: "#/components/parameters/PorPagina" }
      responses:
        "200": { description: Lista paginada de reportes }
    post:
      tags: [Producción]
      summary: Crear el reporte mensual de un establecimiento (inicia en BORRADOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [establecimientoId, periodoId]
              properties:
                establecimientoId: { type: integer }
                periodoId: { type: integer }
      responses:
        "201":
          description: Reporte creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reporte" }
        "409": { $ref: "#/components/responses/Conflicto" }

  /reportes/{id}:
    get:
      tags: [Producción]
      summary: Detalle de un reporte
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Reporte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reporte" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /reportes/{id}/formulario:
    get:
      tags: [Producción]
      summary: Formulario dinámico del reporte (esquemas por vacuna y celdas ya guardadas)
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200": { description: Esquemas aplicables y valores capturados }

  /reportes/{id}/vacunas/{vacunaId}:
    put:
      tags: [Producción]
      summary: Guardar las cantidades de una vacuna del reporte
      description: |
        Solo si el reporte está en BORRADOR. Valida dosis, dimensiones y procedencia contra el
        esquema de la vacuna y escribe detalle_produccion y detalle_dimension en una transacción.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: vacunaId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [versionFila, celdas]
              properties:
                versionFila:
                  type: integer
                  description: Versión del reporte que leyó el cliente (control de concurrencia)
                totalDeclarado: { type: integer, minimum: 0 }
                celdas:
                  type: array
                  items: { $ref: "#/components/schemas/Celda" }
      responses:
        "200": { description: Cantidades guardadas }
        "409": { $ref: "#/components/responses/Conflicto" }
        "422": { $ref: "#/components/responses/ReglaNegocio" }

  # ---------------------------------------------------------------- Revisión
  /reportes/{id}/validar:
    post:
      tags: [Revisión]
      summary: Ejecutar las reglas de validación sin cambiar el estado
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Resultados de validación
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ResultadoValidacion" }

  /reportes/{id}/transiciones:
    post:
      tags: [Revisión]
      summary: Cambiar el estado del reporte (enviar, asignar, pedir corrección, aprobar, cerrar)
      description: |
        Única vía para cambiar el estado. La transición se valida contra la tabla transicion_estado
        según el rol del usuario. Pasar a ENVIADO ejecuta antes las reglas y se rechaza si quedan errores.
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estadoDestino]
              properties:
                estadoDestino: { $ref: "#/components/schemas/EstadoReporte" }
                comentario: { type: string }
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reporte" }
        "422": { $ref: "#/components/responses/ReglaNegocio" }

  /reportes/{id}/historial:
    get:
      tags: [Revisión]
      summary: Historial de estados del reporte
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200": { description: "Lista de cambios de estado con usuario, fecha y comentario" }

  /reportes/{id}/observaciones:
    post:
      tags: [Revisión]
      summary: Registrar una observación de revisión (general, por vacuna o por celda)
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                texto: { type: string }
                reporteVacunaId: { type: integer }
                detalleId: { type: integer }
      responses:
        "201": { description: Observación registrada }

  /periodos/{id}/cerrar:
    post:
      tags: [Revisión]
      summary: Cerrar el periodo (cierra los reportes aprobados y dispara el cálculo de indicadores)
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200": { description: Periodo cerrado }
        "422": { $ref: "#/components/responses/ReglaNegocio" }

  /reportes/{id}/rectificaciones:
    post:
      tags: [Revisión]
      summary: Solicitar la rectificación de un reporte CERRADO
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string }
      responses:
        "201": { description: Solicitud creada en estado PENDIENTE }

  # ---------------------------------------------------------------- Indicadores
  /indicadores/corridas:
    post:
      tags: [Indicadores]
      summary: Ejecutar manualmente el cálculo de indicadores
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anio, mesHasta]
              properties:
                anio: { type: integer }
                mesHasta: { type: integer, minimum: 1, maximum: 12 }
      responses:
        "202": { description: Corrida iniciada }

  /indicadores/resultados:
    get:
      tags: [Indicadores]
      summary: Cobertura, brecha, deserción y proyección (de la corrida vigente)
      parameters:
        - { name: indicador, in: query, schema: { type: string, example: COB_PENTA3 } }
        - { name: anio, in: query, schema: { type: integer } }
        - { name: mes, in: query, schema: { type: integer } }
        - { name: municipioId, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Resultados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ResultadoIndicador" }

  # ---------------------------------------------------------------- Alertas y auditoría
  /alertas:
    get:
      tags: [Alertas y auditoría]
      summary: Alertas activas para el rol y alcance del usuario
      parameters:
        - { name: estado, in: query, schema: { type: string, enum: [ACTIVA, ATENDIDA, DESCARTADA] } }
      responses:
        "200": { description: Lista de alertas }

  /auditoria/bitacora:
    get:
      tags: [Alertas y auditoría]
      summary: Consultar la bitácora (solo lectura; no existe endpoint para modificarla)
      parameters:
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: usuarioId, in: query, schema: { type: integer } }
        - { name: modulo, in: query, schema: { type: string } }
        - { name: accion, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Pagina" }
        - { $ref: "#/components/parameters/PorPagina" }
      responses:
        "200": { description: Lista paginada de registros de bitácora }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Pagina:
      name: pagina
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    PorPagina:
      name: porPagina
      in: query
      schema: { type: integer, default: 20, maximum: 100 }

  responses:
    EntradaInvalida:
      description: La solicitud no cumple el formato esperado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoAutenticado:
      description: |
        Falta el token, no es válido o su cuenta no existe (NO_AUTENTICADO), el token venció (SESION_VENCIDA),
        la cuenta o su empleado están desactivados (CUENTA_DESACTIVADA), o el rol, el establecimiento o el
        municipio cambiaron desde que se emitió el token (SESION_DESACTUALIZADA)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            noAutenticado:
              value:
                error: { codigo: NO_AUTENTICADO, mensaje: Debe iniciar sesión. }
            sesionVencida:
              value:
                error: { codigo: SESION_VENCIDA, mensaje: Su sesión venció; inicie sesión de nuevo. }
            cuentaDesactivada:
              value:
                error: { codigo: CUENTA_DESACTIVADA, mensaje: Su cuenta está desactivada; contacte al administrador. }
            sesionDesactualizada:
              value:
                error: { codigo: SESION_DESACTUALIZADA, mensaje: Sus datos de acceso cambiaron; inicie sesión de nuevo. }
    SinPermiso:
      description: El usuario no tiene el permiso de la operación, o su rol es de solo consulta
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { codigo: SIN_PERMISO, mensaje: No tiene permiso para realizar esta acción. }
    CambioContrasenaRequerido:
      description: |
        La cuenta debe cambiar su contraseña (por ejemplo, la temporal) antes de usar este endpoint.
        Lo responde cualquier endpoint protegido salvo `POST /auth/contrasena`, `POST /auth/logout` y `GET /auth/yo`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { codigo: CAMBIO_CONTRASENA_REQUERIDO, mensaje: Debe cambiar su contraseña temporal antes de continuar. }
    NoEncontrado:
      description: No existe o está fuera del alcance del usuario
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { codigo: NO_ENCONTRADO, mensaje: El recurso solicitado no existe. }
    Conflicto:
      description: Duplicado o versionFila desactualizada
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ReglaNegocio:
      description: Se incumple una regla del negocio (transición no permitida, errores de validación, reporte no editable)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            codigo: { type: string, example: TRANSICION_NO_PERMITIDA }
            mensaje: { type: string }
            detalles: { type: array, items: { type: object } }

    EstadoReporte:
      type: string
      enum: [BORRADOR, ENVIADO, EN_REVISION, CORRECCION_SOLICITADA, APROBADO, CERRADO, RECTIFICACION]

    UsuarioSesion:
      type: object
      properties:
        id: { type: integer }
        nombreUsuario: { type: string }
        rol: { type: string, enum: [ESTABLECIMIENTO, REVISOR, EPIDEMIOLOGIA, ADMINISTRADOR, AUTORIDAD] }
        rolNombre:
          type: string
          description: Nombre del rol (`rol.nombre`) para mostrarlo; no va en el JWT
          example: Estadígrafa / revisor DDRISS
        permisos: { type: array, items: { type: string } }
        debeCambiarContrasena:
          type: boolean
          description: Si es `true`, la cuenta solo puede cambiar su contraseña o cerrar sesión; no va en el JWT
        empleado:
          type: object
          properties:
            nombres: { type: string }
            apellidos: { type: string }
            ddrissId: { type: integer, nullable: true, description: NULL solo para AUTORIDAD de nivel nacional }
            establecimientoId: { type: integer, nullable: true }
            municipioId: { type: integer, nullable: true }

    CambioContrasenaEntrada:
      type: object
      additionalProperties: false
      required: [contrasenaActual, contrasenaNueva]
      properties:
        contrasenaActual: { type: string, format: password }
        contrasenaNueva:
          type: string
          format: password
          minLength: 12
          description: Al menos 12 caracteres, como máximo 72 bytes en UTF-8 y puntaje de zxcvbn de 3 o más

    CierreSesionEntrada:
      type: object
      properties:
        motivo:
          type: string
          enum: [MANUAL, INACTIVIDAD]
          default: MANUAL
          description: MANUAL si el usuario pulsó "Cerrar sesión"; INACTIVIDAD si el frontend la cerró por inactividad

    EmpleadoEntrada:
      type: object
      required: [nombres, apellidos]
      properties:
        nombres: { type: string, minLength: 1, maxLength: 100 }
        apellidos: { type: string, minLength: 1, maxLength: 100 }
        codigoEmpleado: { type: string, maxLength: 20, description: Único si se indica }
        cargo: { type: string, maxLength: 100 }
        correo: { type: string, format: email, maxLength: 150, description: Único si se indica }
        telefono: { type: string, maxLength: 20 }
        establecimientoId:
          type: integer
          description: Activo y de la DDRISS del administrador; el municipio se toma de él
        municipioId:
          type: integer
          description: Solo sin establecimiento; activo y del departamento sede de la DDRISS

    Empleado:
      type: object
      properties:
        id: { type: integer }
        codigoEmpleado: { type: string, nullable: true }
        nombres: { type: string }
        apellidos: { type: string }
        cargo: { type: string, nullable: true }
        correo: { type: string, nullable: true }
        telefono: { type: string, nullable: true }
        establecimientoId: { type: integer, nullable: true }
        municipioId: { type: integer, nullable: true }
        ddrissId: { type: integer }
        activo: { type: boolean }

    EmpleadoCambios:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Cambio parcial; `ddrissId` y `activo` no se aceptan
      properties:
        nombres: { type: string, minLength: 1, maxLength: 100 }
        apellidos: { type: string, minLength: 1, maxLength: 100 }
        codigoEmpleado: { type: string, nullable: true, maxLength: 20, description: Único si se indica; null o vacío lo borra }
        cargo: { type: string, nullable: true, maxLength: 100 }
        correo: { type: string, nullable: true, format: email, maxLength: 150, description: Único si se indica; null o vacío lo borra }
        telefono: { type: string, nullable: true, maxLength: 20 }
        establecimientoId:
          type: integer
          nullable: true
          description: Activo y de la DDRISS del administrador; el municipio se toma de él. null lo quita
        municipioId:
          type: integer
          nullable: true
          description: Solo sin establecimiento; activo y del departamento sede de la DDRISS. No puede venir con valor junto a establecimientoId

    UsuarioEntrada:
      type: object
      description: No lleva contraseña; la genera el sistema. Si llega `contrasenaTemporal`, responde 400
      required: [empleadoId, nombreUsuario, rolId]
      properties:
        empleadoId: { type: integer }
        nombreUsuario: { type: string, pattern: '^\S{3,50}$', description: 3 a 50 caracteres sin espacios }
        rolId: { type: integer }

    Usuario:
      type: object
      properties:
        id: { type: integer }
        empleadoId: { type: integer }
        nombreUsuario: { type: string }
        rol: { type: string, enum: [ESTABLECIMIENTO, REVISOR, EPIDEMIOLOGIA, ADMINISTRADOR, AUTORIDAD] }
        rolNombre: { type: string }
        activo: { type: boolean }
        debeCambiarContrasena: { type: boolean }

    UsuarioCreado:
      description: Cuenta recién creada, con la contraseña temporal que generó el sistema; se devuelve una sola vez
      allOf:
        - { $ref: "#/components/schemas/Usuario" }
        - type: object
          properties:
            contrasenaTemporal: { type: string, format: password, minLength: 12, maxLength: 12 }

    RestablecimientoContrasena:
      type: object
      description: La contraseña temporal se devuelve una sola vez
      properties:
        usuario: { $ref: "#/components/schemas/UsuarioDetalle" }
        contrasenaTemporal: { type: string, format: password, minLength: 12, maxLength: 12 }

    UsuarioDetalle:
      description: Cuenta con los datos de su empleado; nunca trae la contraseña, su hash, los intentos fallidos ni la fecha del bloqueo
      allOf:
        - { $ref: "#/components/schemas/Usuario" }
        - type: object
          properties:
            bloqueada:
              type: boolean
              description: Si la cuenta está bloqueada ahora por intentos fallidos
            ultimoAcceso: { type: string, format: date-time, nullable: true }
            desactivadoEn: { type: string, format: date-time, nullable: true }
            empleado:
              allOf:
                - { $ref: "#/components/schemas/Empleado" }
                - type: object
                  properties:
                    establecimientoNombre: { type: string, nullable: true }
                    municipioNombre: { type: string, nullable: true }

    EstablecimientoEntrada:
      type: object
      properties:
        codigo: { type: string }
        nombre: { type: string }
        tipoEstablecimientoId: { type: integer }
        distritoSaludId: { type: integer, nullable: true }
        municipioId: { type: integer }
        reportaProduccion: { type: boolean }
        esExterno: { type: boolean }
        direccion: { type: string }
        telefono: { type: string }
        correo: { type: string }
        nombreContacto: { type: string }
        activo: { type: boolean }

    Reporte:
      type: object
      properties:
        id: { type: integer }
        establecimientoId: { type: integer }
        periodoId: { type: integer }
        estado: { $ref: "#/components/schemas/EstadoReporte" }
        revisorId: { type: integer, nullable: true }
        numeroRectificacion: { type: integer }
        versionFila: { type: integer }

    Celda:
      type: object
      description: Una cantidad del formulario. Las dimensiones dependen del esquema de la vacuna.
      required: [dosisCodigo, municipioProcedenciaId, cantidad]
      properties:
        dosisCodigo: { type: string, example: D3 }
        municipioProcedenciaId: { type: integer }
        dimensiones:
          type: object
          additionalProperties: { type: string }
          example: { sexo: F, grupo_edad: MENOR_1 }
        cantidad: { type: integer, minimum: 0, example: 40 }

    ResultadoValidacion:
      type: object
      properties:
        reglaCodigo: { type: string, example: TOTAL_CUADRA }
        reglaVersion: { type: integer }
        severidad: { type: string, enum: [ERROR, ADVERTENCIA] }
        mensaje: { type: string }
        estado: { type: string, enum: [ABIERTO, CORREGIDO, JUSTIFICADO] }

    ResultadoIndicador:
      type: object
      properties:
        indicadorCodigo: { type: string }
        municipioId: { type: integer, nullable: true, description: null = departamental }
        anio: { type: integer }
        mes: { type: integer }
        numerador: { type: number }
        denominador: { type: number }
        valor: { type: number }
        meta: { type: number }
        cumpleMeta: { type: boolean }
        esProyeccion: { type: boolean }
