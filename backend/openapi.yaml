openapi: 3.0.3
info:
  title: API del sistema web de producción de vacunación (DDRISS San Marcos)
  version: 0.1.0
  description: |
    Versión preliminar. Endpoints principales para que el sistema funcione de punta a punta:
    acceso, catálogos, configuración de formularios, registro de producción, revisión y cierre,
    indicadores, alertas y auditoría.

    El modelo de datos está descrito en `05_contexto_base_de_datos.md`.
    El sistema maneja solo datos agregados: ningún endpoint recibe ni devuelve datos de pacientes.

    Todas las rutas, salvo `/salud` y `/auth/login`, exigen el encabezado `Authorization: Bearer <token>`.

    **Permisos.** Cada función exige su propio permiso, con la forma `ENTIDAD_ACCION` (por ejemplo,
    `USUARIO_CREAR`). Cada operación protegida declara el suyo con la extensión `x-permiso: CODIGO` y
    documenta la respuesta `"403": { $ref: "#/components/responses/SinPermiso" }`. El rol `AUTORIDAD`
    es de solo consulta: recibe 403 en cualquier método distinto de `GET` aunque tenga el permiso.
    `/salud`, `POST /auth/login`, `POST /auth/logout` y `GET /auth/yo` no llevan permiso.
    Un recurso fuera del ámbito del usuario (su establecimiento o su DDRISS) responde 404, igual que
    uno que no existe.

    **Bitácora.** Toda escritura, cada exportación y cada acceso denegado quedan en la bitácora, que no se puede modificar ni borrar.
servers:
  - url: http://localhost:3000/api/v1
    description: Desarrollo local

tags:
  - name: Sistema
  - name: Autenticación
  - name: Usuarios
  - name: Catálogos
  - name: Configuración
  - name: Producción
  - name: Revisión
  - name: Indicadores
  - name: Alertas y auditoría

security:
  - bearerAuth: []

paths:
  /salud:
    get:
      tags: [Sistema]
      summary: Estado de la API y de las conexiones a MySQL y MongoDB
      description: |
        Comprueba cada base con un tiempo límite de 5 segundos. Solo informa `ok` o `error`;
        el detalle técnico de la falla queda en el registro del servidor, nunca en la respuesta.
      security: []
      responses:
        "200":
          description: La API y las bases de datos responden
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado: { type: string, example: ok }
                  mysql: { type: string, enum: [ok, error], example: ok }
                  mongo: { type: string, enum: [ok, error], example: ok }
        "503":
          description: Una o ambas bases de datos no responden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  codigo: BD_NO_DISPONIBLE
                  mensaje: Una o más bases de datos no responden.
                  detalles:
                    - { mysql: ok, mongo: error }

  # ---------------------------------------------------------------- Autenticación
  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      description: |
        Devuelve un JWT (HS256) que vence según `JWT_EXPIRACION` y contiene `sub`, `rol`, `permisos`,
        `ddrissId`, `establecimientoId` y `municipioId`.

        Al 5.º intento fallido seguido la cuenta se bloquea 15 minutos; ese mismo intento ya responde 423.
        Un usuario inexistente y una contraseña incorrecta responden el mismo 401.
        Los 403 solo se devuelven si la contraseña es correcta.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombreUsuario, contrasena]
              properties:
                nombreUsuario: { type: string, example: jperez }
                contrasena: { type: string, format: password }
      responses:
        "200":
          description: Sesión iniciada
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... }
                  usuario: { $ref: "#/components/schemas/UsuarioSesion" }
        "400":
          description: Falta el nombre de usuario o la contraseña
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: Debe indicar el nombre de usuario y la contraseña. }
        "401":
          description: Usuario inexistente o contraseña incorrecta (mismo cuerpo en ambos casos)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: CREDENCIALES_INVALIDAS, mensaje: Usuario o contraseña incorrectos. }
        "403":
          description: Contraseña correcta, pero la cuenta está desactivada o no tiene alcance asignado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                desactivada:
                  value:
                    error: { codigo: CUENTA_DESACTIVADA, mensaje: Su cuenta está desactivada; contacte al administrador. }
                sinAlcance:
                  value:
                    error: { codigo: CUENTA_SIN_ALCANCE, mensaje: Su cuenta no tiene una DDRISS o un establecimiento asignado; contacte al administrador. }
        "423":
          description: Cuenta bloqueada por intentos fallidos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: CUENTA_BLOQUEADA, mensaje: Su cuenta está bloqueada por 15 minutos por intentos fallidos. }

  /auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar sesión
      description: |
        Registra el cierre en la bitácora (acción `LOGOUT` con el motivo). No revoca el token:
        sigue siendo válido hasta su `exp`, pero el frontend ya lo borró.

        El cuerpo es opcional; sin `motivo` se registra `MANUAL`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CierreSesionEntrada" }
      responses:
        "204": { description: Cierre de sesión registrado }
        "400":
          description: El motivo no es MANUAL ni INACTIVIDAD
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { codigo: ENTRADA_INVALIDA, mensaje: El motivo del cierre de sesión no es válido. }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /auth/yo:
    get:
      tags: [Autenticación]
      summary: Datos de la sesión actual (usuario, empleado, rol y permisos)
      responses:
        "200":
          description: Sesión actual
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioSesion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  # ---------------------------------------------------------------- Usuarios
  /empleados:
    get:
      tags: [Usuarios]
      summary: Listar empleados
      parameters:
        - { $ref: "#/components/parameters/Pagina" }
        - { $ref: "#/components/parameters/PorPagina" }
      responses:
        "200": { description: Lista paginada de empleados }
    post:
      tags: [Usuarios]
      summary: Registrar un empleado de la DDRISS del administrador (puede existir sin cuenta)
      description: |
        La DDRISS del empleado es siempre la del usuario que lo registra; no viene en el cuerpo.
        Con establecimiento, el municipio se toma del establecimiento; `municipioId` solo se acepta
        sin establecimiento y debe ser del departamento sede de la DDRISS. Los textos vacíos se guardan como `null`.
      x-permiso: EMPLEADO_CREAR
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmpleadoEntrada" }
      responses:
        "201":
          description: Empleado creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Empleado" }
        "400": { $ref: "#/components/responses/EntradaInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "409":
          description: Correo o código de empleado repetido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                correo:
                  value:
                    error: { codigo: CORREO_DUPLICADO, mensaje: Ya hay un empleado con ese correo. }
                codigo:
                  value:
                    error: { codigo: CODIGO_EMPLEADO_DUPLICADO, mensaje: Ya hay un empleado con ese código. }
        "422":
          description: Establecimiento o municipio fuera del ámbito, inexistente o inactivo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                establecimiento:
                  value:
                    error: { codigo: ESTABLECIMIENTO_INVALIDO, mensaje: El establecimiento no existe, está inactivo o no es de su DDRISS. }
                municipio:
                  value:
                    error: { codigo: MUNICIPIO_INVALIDO, mensaje: El municipio no existe, está inactivo o no es del departamento de su DDRISS. }

  /usuarios:
    get:
      tags: [Usuarios]
      summary: Listar cuentas de usuario
      parameters:
        - { $ref: "#/components/parameters/Pagina" }
        - { $ref: "#/components/parameters/PorPagina" }
      responses:
        "200": { description: Lista paginada de cuentas }
    post:
      tags: [Usuarios]
      summary: Crear la cuenta de acceso de un empleado (solo Administrador)
      description: |
        La contraseña se guarda con bcrypt y la cuenta queda con `debeCambiarContrasena: true`.
        El empleado debe estar activo, ser de la DDRISS del administrador y no tener cuenta.
        El rol `ESTABLECIMIENTO` exige que el empleado tenga establecimiento.
      x-permiso: USUARIO_CREAR
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsuarioEntrada" }
      responses:
        "201":
          description: Cuenta creada; nunca devuelve la contraseña ni su hash
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        "400": { $ref: "#/components/responses/EntradaInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: El empleado ya tiene cuenta o el nombre de usuario ya existe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                empleadoConCuenta:
                  value:
                    error: { codigo: EMPLEADO_CON_CUENTA, mensaje: El empleado ya tiene una cuenta. }
                nombreUsuario:
                  value:
                    error: { codigo: NOMBRE_USUARIO_DUPLICADO, mensaje: Ya existe ese nombre de usuario. }
        "422":
          description: Rol inexistente o rol ESTABLECIMIENTO para un empleado sin establecimiento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                rol:
                  value:
                    error: { codigo: ROL_INVALIDO, mensaje: El rol no existe. }
                sinEstablecimiento:
                  value:
                    error: { codigo: EMPLEADO_SIN_ESTABLECIMIENTO, mensaje: Para el rol de personal del establecimiento, el empleado debe tener un establecimiento. }

  /roles:
    get:
      tags: [Usuarios]
      summary: Listar los roles
      x-permiso: ROL_CONSULTAR
      responses:
        "200":
          description: Los cinco roles
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    codigo: { type: string, example: REVISOR }
                    nombre: { type: string, example: Estadígrafa / revisor DDRISS }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /usuarios/{id}:
    patch:
      tags: [Usuarios]
      summary: Cambiar rol, desactivar o reactivar una cuenta (desactivación lógica)
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rolId: { type: integer }
                activo: { type: boolean }
      responses:
        "200": { description: Cuenta actualizada }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  # ---------------------------------------------------------------- Catálogos
  /ddriss:
    get:
      tags: [Catálogos]
      summary: Listar las DDRISS activas del ámbito del usuario
      description: Devuelve la DDRISS del usuario; la autoridad nacional (sin DDRISS) recibe todas.
      x-permiso: DDRISS_CONSULTAR
      responses:
        "200":
          description: Lista de DDRISS
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    codigo: { type: string, example: DDRISS_SM }
                    nombre: { type: string }
                    departamentoId: { type: integer }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /municipios:
    get:
      tags: [Catálogos]
      summary: Listar los municipios activos del ámbito del usuario (codigo_ine es la llave del GeoJSON)
      description: |
        Devuelve los municipios del departamento sede de la DDRISS del usuario, ordenados por nombre;
        la autoridad nacional (sin DDRISS) recibe todos. Versión mínima de HU-04; HU-08 la amplía.
      x-permiso: MUNICIPIO_CONSULTAR
      responses:
        "200":
          description: Lista de municipios
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    departamentoId: { type: integer }
                    codigoIne: { type: string }
                    nombre: { type: string }
                    activo: { type: boolean }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }


  /establecimientos:
    get:
      tags: [Catálogos]
      summary: Listar establecimientos e instituciones del ámbito del usuario
      description: |
        Ordenados por nombre. El personal de establecimiento solo recibe el suyo; los demás roles, los de su DDRISS;
        la autoridad nacional, todos. Versión mínima de HU-04; HU-09 la amplía.
      x-permiso: ESTABLECIMIENTO_CONSULTAR
      parameters:
        - { name: municipioId, in: query, schema: { type: integer } }
        - { name: activo, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Lista de establecimientos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    codigo: { type: string }
                    nombre: { type: string }
                    tipoEstablecimientoId: { type: integer }
                    tipoEstablecimientoNombre: { type: string }
                    distritoSaludId: { type: integer, nullable: true }
                    municipioId: { type: integer }
                    municipioNombre: { type: string }
                    reportaProduccion: { type: boolean }
                    esExterno: { type: boolean }
                    activo: { type: boolean }
        "400":
          $ref: "#/components/responses/EntradaInvalida"
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "500":
          description: Error interno al consultar establecimientos
    post:
      tags: [Catálogos]
      summary: Crear un establecimiento (Administrador)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstablecimientoEntrada" }
      responses:
        "201": { description: Establecimiento creado }
        "409": { $ref: "#/components/responses/Conflicto" }

  /establecimientos/{id}:
    patch:
      tags: [Catálogos]
      summary: Actualizar o desactivar un establecimiento
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstablecimientoEntrada" }
      responses:
        "200": { description: Establecimiento actualizado }

  /vacunas:
    get:
      tags: [Catálogos]
      summary: Listar vacunas con sus dosis
      responses:
        "200":
          description: Lista de vacunas con sus dosis
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    codigo: { type: string }
                    nombre: { type: string }
                    descripcion: { type: string, nullable: true }
                    ordenInforme: { type: integer }
                    activa: { type: boolean }
                    dosis:
                      type: array
                      items:
                        type: object
                        properties:
                          id: { type: integer }
                          codigo: { type: string }
                          nombre: { type: string }
                          orden: { type: integer }
                          activa: { type: boolean }
    post:
      tags: [Catálogos]
      summary: Registrar una vacuna nueva con sus dosis (Administrador)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, nombre, dosis]
              properties:
                codigo: { type: string, example: PENTA }
                nombre: { type: string, example: Pentavalente }
                dosis:
                  type: array
                  items:
                    type: object
                    properties:
                      codigo: { type: string, example: D1 }
                      nombre: { type: string, example: Primera dosis }
                      orden: { type: integer, example: 1 }
      responses:
        "201": { description: Vacuna creada }

  /periodos:
    get:
      tags: [Catálogos]
      summary: Listar periodos mensuales de reporte
      parameters:
        - { name: anio, in: query, schema: { type: integer } }
      
      responses:
        "200":
          description: Lista de períodos mensuales
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    anio: { type: integer }
                    mes: { type: integer }
                    fechaInicio: { type: string, format: date }
                    fechaFin: { type: string, format: date }
                    fechaLimiteEnvio: { type: string, format: date }
                    estado:
                      type: string
                      enum: [ABIERTO, EN_CIERRE, CERRADO]
        "400":
          $ref: "#/components/responses/EntradaInvalida"
        "500":
          description: Error interno al consultar períodos

    post:
      tags: [Catálogos]
      summary: Abrir un periodo mensual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anio, mes, fechaLimiteEnvio]
              properties:
                anio: { type: integer, example: 2026 }
                mes: { type: integer, minimum: 1, maximum: 12 }
                fechaLimiteEnvio: { type: string, format: date }
      responses:
        "201": { description: Periodo creado }
        "409": { $ref: "#/components/responses/Conflicto" }

  /poblaciones-objetivo:
    get:
      tags: [Catálogos]
      summary: Consultar denominadores de cobertura
      parameters:
        - { name: anio, in: query, schema: { type: integer } }
        - { name: municipioId, in: query, schema: { type: integer } }
      responses:
        "200": { description: Lista de poblaciones objetivo }
    post:
      tags: [Catálogos]
      summary: Registrar o actualizar la población objetivo de un municipio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [municipioId, anio, vacunaId, clasificacionPoblacion, cantidad]
              properties:
                municipioId: { type: integer }
                anio: { type: integer }
                clasificacionPoblacion: { type: string, example: MENOR_1 }
                cantidad: { type: integer, minimum: 0 }
                fuente: { type: string }
      responses:
        "201": { description: Población registrada }

  # ---------------------------------------------------------------- Configuración (MongoDB)
  /dimensiones:
    get:
      tags: [Configuración]
      summary: Catálogo de dimensiones de desagregación y sus valores
      responses:
        "200":
          description: Lista de dimensiones configuradas
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    codigo: { type: string }
                    nombre: { type: string }
                    descripcion: { type: string, nullable: true }
                    tipo: { type: string }
                    activo: { type: boolean }
                    valores:
                      type: array
                      items:
                        type: object
                        properties:
                          codigo: { type: string }
                          etiqueta: { type: string }
                          orden: { type: integer }
                          activo: { type: boolean }
                          edadMinMeses: { type: integer }
                          edadMaxMeses: { type: integer }
        "500":
          description: Error al consultar las dimensiones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /vacunas/{codigo}/esquema-vigente:
    get:
      tags: [Configuración]
      summary: Esquema de captura VIGENTE de una vacuna (molde del formulario)
      parameters:
        - { name: codigo, in: path, required: true, schema: { type: string, example: PENTA } }
      responses:
        "200": { description: Documento de esquemas_captura }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /esquemas-captura:
    post:
      tags: [Configuración]
      summary: Crear una versión nueva (BORRADOR) del esquema de una vacuna
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Estructura de esquemas_captura (ver 05_contexto_base_de_datos.md, sección 6)
      responses:
        "201": { description: Versión creada en BORRADOR }
        "422": { $ref: "#/components/responses/ReglaNegocio" }

  /esquemas-captura/{id}/publicar:
    post:
      tags: [Configuración]
      summary: Publicar una versión (pasa a VIGENTE y la anterior a HISTORICO)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, description: ObjectId } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                motivoCambio: { type: string }
      responses:
        "200": { description: Versión publicada }
        "422": { $ref: "#/components/responses/ReglaNegocio" }

  # ---------------------------------------------------------------- Producción
  /reportes:
    get:
      tags: [Producción]
      summary: Listar reportes (limitado al alcance del usuario)
      parameters:
        - { name: periodoId, in: query, schema: { type: integer } }
        - { name: establecimientoId, in: query, schema: { type: integer } }
        - { name: estado, in: query, schema: { $ref: "#/components/schemas/EstadoReporte" } }
        - { $ref: "#/components/parameters/Pagina" }
        - { $ref: "#/components/parameters/PorPagina" }
      responses:
        "200": { description: Lista paginada de reportes }
    post:
      tags: [Producción]
      summary: Crear el reporte mensual de un establecimiento (inicia en BORRADOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [establecimientoId, periodoId]
              properties:
                establecimientoId: { type: integer }
                periodoId: { type: integer }
      responses:
        "201":
          description: Reporte creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reporte" }
        "409": { $ref: "#/components/responses/Conflicto" }

  /reportes/{id}:
    get:
      tags: [Producción]
      summary: Detalle de un reporte
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Reporte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reporte" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /reportes/{id}/formulario:
    get:
      tags: [Producción]
      summary: Formulario dinámico del reporte (esquemas por vacuna y celdas ya guardadas)
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200": { description: Esquemas aplicables y valores capturados }

  /reportes/{id}/vacunas/{vacunaId}:
    put:
      tags: [Producción]
      summary: Guardar las cantidades de una vacuna del reporte
      description: |
        Solo si el reporte está en BORRADOR. Valida dosis, dimensiones y procedencia contra el
        esquema de la vacuna y escribe detalle_produccion y detalle_dimension en una transacción.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: vacunaId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [versionFila, celdas]
              properties:
                versionFila:
                  type: integer
                  description: Versión del reporte que leyó el cliente (control de concurrencia)
                totalDeclarado: { type: integer, minimum: 0 }
                celdas:
                  type: array
                  items: { $ref: "#/components/schemas/Celda" }
      responses:
        "200": { description: Cantidades guardadas }
        "409": { $ref: "#/components/responses/Conflicto" }
        "422": { $ref: "#/components/responses/ReglaNegocio" }

  # ---------------------------------------------------------------- Revisión
  /reportes/{id}/validar:
    post:
      tags: [Revisión]
      summary: Ejecutar las reglas de validación sin cambiar el estado
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Resultados de validación
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ResultadoValidacion" }

  /reportes/{id}/transiciones:
    post:
      tags: [Revisión]
      summary: Cambiar el estado del reporte (enviar, asignar, pedir corrección, aprobar, cerrar)
      description: |
        Única vía para cambiar el estado. La transición se valida contra la tabla transicion_estado
        según el rol del usuario. Pasar a ENVIADO ejecuta antes las reglas y se rechaza si quedan errores.
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estadoDestino]
              properties:
                estadoDestino: { $ref: "#/components/schemas/EstadoReporte" }
                comentario: { type: string }
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reporte" }
        "422": { $ref: "#/components/responses/ReglaNegocio" }

  /reportes/{id}/historial:
    get:
      tags: [Revisión]
      summary: Historial de estados del reporte
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200": { description: "Lista de cambios de estado con usuario, fecha y comentario" }

  /reportes/{id}/observaciones:
    post:
      tags: [Revisión]
      summary: Registrar una observación de revisión (general, por vacuna o por celda)
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                texto: { type: string }
                reporteVacunaId: { type: integer }
                detalleId: { type: integer }
      responses:
        "201": { description: Observación registrada }

  /periodos/{id}/cerrar:
    post:
      tags: [Revisión]
      summary: Cerrar el periodo (cierra los reportes aprobados y dispara el cálculo de indicadores)
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200": { description: Periodo cerrado }
        "422": { $ref: "#/components/responses/ReglaNegocio" }

  /reportes/{id}/rectificaciones:
    post:
      tags: [Revisión]
      summary: Solicitar la rectificación de un reporte CERRADO
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string }
      responses:
        "201": { description: Solicitud creada en estado PENDIENTE }

  # ---------------------------------------------------------------- Indicadores
  /indicadores/corridas:
    post:
      tags: [Indicadores]
      summary: Ejecutar manualmente el cálculo de indicadores
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anio, mesHasta]
              properties:
                anio: { type: integer }
                mesHasta: { type: integer, minimum: 1, maximum: 12 }
      responses:
        "202": { description: Corrida iniciada }

  /indicadores/resultados:
    get:
      tags: [Indicadores]
      summary: Cobertura, brecha, deserción y proyección (de la corrida vigente)
      parameters:
        - { name: indicador, in: query, schema: { type: string, example: COB_PENTA3 } }
        - { name: anio, in: query, schema: { type: integer } }
        - { name: mes, in: query, schema: { type: integer } }
        - { name: municipioId, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Resultados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ResultadoIndicador" }

  # ---------------------------------------------------------------- Alertas y auditoría
  /alertas:
    get:
      tags: [Alertas y auditoría]
      summary: Alertas activas para el rol y alcance del usuario
      parameters:
        - { name: estado, in: query, schema: { type: string, enum: [ACTIVA, ATENDIDA, DESCARTADA] } }
      responses:
        "200": { description: Lista de alertas }

  /auditoria/bitacora:
    get:
      tags: [Alertas y auditoría]
      summary: Consultar la bitácora (solo lectura; no existe endpoint para modificarla)
      parameters:
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: usuarioId, in: query, schema: { type: integer } }
        - { name: modulo, in: query, schema: { type: string } }
        - { name: accion, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Pagina" }
        - { $ref: "#/components/parameters/PorPagina" }
      responses:
        "200": { description: Lista paginada de registros de bitácora }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Pagina:
      name: pagina
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    PorPagina:
      name: porPagina
      in: query
      schema: { type: integer, default: 20, maximum: 100 }

  responses:
    EntradaInvalida:
      description: La solicitud no cumple el formato esperado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoAutenticado:
      description: Falta el token o no es válido (NO_AUTENTICADO), o el token venció (SESION_VENCIDA)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            noAutenticado:
              value:
                error: { codigo: NO_AUTENTICADO, mensaje: Debe iniciar sesión. }
            sesionVencida:
              value:
                error: { codigo: SESION_VENCIDA, mensaje: Su sesión venció; inicie sesión de nuevo. }
    SinPermiso:
      description: El usuario no tiene el permiso de la operación, o su rol es de solo consulta
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { codigo: SIN_PERMISO, mensaje: No tiene permiso para realizar esta acción. }
    NoEncontrado:
      description: No existe o está fuera del alcance del usuario
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { codigo: NO_ENCONTRADO, mensaje: El recurso solicitado no existe. }
    Conflicto:
      description: Duplicado o versionFila desactualizada
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ReglaNegocio:
      description: Se incumple una regla del negocio (transición no permitida, errores de validación, reporte no editable)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            codigo: { type: string, example: TRANSICION_NO_PERMITIDA }
            mensaje: { type: string }
            detalles: { type: array, items: { type: object } }

    EstadoReporte:
      type: string
      enum: [BORRADOR, ENVIADO, EN_REVISION, CORRECCION_SOLICITADA, APROBADO, CERRADO, RECTIFICACION]

    UsuarioSesion:
      type: object
      properties:
        id: { type: integer }
        nombreUsuario: { type: string }
        rol: { type: string, enum: [ESTABLECIMIENTO, REVISOR, EPIDEMIOLOGIA, ADMINISTRADOR, AUTORIDAD] }
        rolNombre:
          type: string
          description: Nombre del rol (`rol.nombre`) para mostrarlo; no va en el JWT
          example: Estadígrafa / revisor DDRISS
        permisos: { type: array, items: { type: string } }
        empleado:
          type: object
          properties:
            nombres: { type: string }
            apellidos: { type: string }
            ddrissId: { type: integer, nullable: true, description: NULL solo para AUTORIDAD de nivel nacional }
            establecimientoId: { type: integer, nullable: true }
            municipioId: { type: integer, nullable: true }

    CierreSesionEntrada:
      type: object
      properties:
        motivo:
          type: string
          enum: [MANUAL, INACTIVIDAD]
          default: MANUAL
          description: MANUAL si el usuario pulsó "Cerrar sesión"; INACTIVIDAD si el frontend la cerró por inactividad

    EmpleadoEntrada:
      type: object
      required: [nombres, apellidos]
      properties:
        nombres: { type: string, minLength: 1, maxLength: 100 }
        apellidos: { type: string, minLength: 1, maxLength: 100 }
        codigoEmpleado: { type: string, maxLength: 20, description: Único si se indica }
        cargo: { type: string, maxLength: 100 }
        correo: { type: string, format: email, maxLength: 150, description: Único si se indica }
        telefono: { type: string, maxLength: 20 }
        establecimientoId:
          type: integer
          description: Activo y de la DDRISS del administrador; el municipio se toma de él
        municipioId:
          type: integer
          description: Solo sin establecimiento; activo y del departamento sede de la DDRISS

    Empleado:
      type: object
      properties:
        id: { type: integer }
        codigoEmpleado: { type: string, nullable: true }
        nombres: { type: string }
        apellidos: { type: string }
        cargo: { type: string, nullable: true }
        correo: { type: string, nullable: true }
        telefono: { type: string, nullable: true }
        establecimientoId: { type: integer, nullable: true }
        municipioId: { type: integer, nullable: true }
        ddrissId: { type: integer }
        activo: { type: boolean }

    UsuarioEntrada:
      type: object
      required: [empleadoId, nombreUsuario, contrasenaTemporal, rolId]
      properties:
        empleadoId: { type: integer }
        nombreUsuario: { type: string, pattern: '^\S{3,50}$', description: 3 a 50 caracteres sin espacios }
        contrasenaTemporal: { type: string, format: password, minLength: 8, maxLength: 72 }
        rolId: { type: integer }

    Usuario:
      type: object
      properties:
        id: { type: integer }
        empleadoId: { type: integer }
        nombreUsuario: { type: string }
        rol: { type: string, enum: [ESTABLECIMIENTO, REVISOR, EPIDEMIOLOGIA, ADMINISTRADOR, AUTORIDAD] }
        rolNombre: { type: string }
        activo: { type: boolean }
        debeCambiarContrasena: { type: boolean }

    EstablecimientoEntrada:
      type: object
      properties:
        codigo: { type: string }
        nombre: { type: string }
        tipoEstablecimientoId: { type: integer }
        distritoSaludId: { type: integer, nullable: true }
        municipioId: { type: integer }
        reportaProduccion: { type: boolean }
        esExterno: { type: boolean }
        direccion: { type: string }
        telefono: { type: string }
        correo: { type: string }
        nombreContacto: { type: string }
        activo: { type: boolean }

    Reporte:
      type: object
      properties:
        id: { type: integer }
        establecimientoId: { type: integer }
        periodoId: { type: integer }
        estado: { $ref: "#/components/schemas/EstadoReporte" }
        revisorId: { type: integer, nullable: true }
        numeroRectificacion: { type: integer }
        versionFila: { type: integer }

    Celda:
      type: object
      description: Una cantidad del formulario. Las dimensiones dependen del esquema de la vacuna.
      required: [dosisCodigo, municipioProcedenciaId, cantidad]
      properties:
        dosisCodigo: { type: string, example: D3 }
        municipioProcedenciaId: { type: integer }
        dimensiones:
          type: object
          additionalProperties: { type: string }
          example: { sexo: F, grupo_edad: MENOR_1 }
        cantidad: { type: integer, minimum: 0, example: 40 }

    ResultadoValidacion:
      type: object
      properties:
        reglaCodigo: { type: string, example: TOTAL_CUADRA }
        reglaVersion: { type: integer }
        severidad: { type: string, enum: [ERROR, ADVERTENCIA] }
        mensaje: { type: string }
        estado: { type: string, enum: [ABIERTO, CORREGIDO, JUSTIFICADO] }

    ResultadoIndicador:
      type: object
      properties:
        indicadorCodigo: { type: string }
        municipioId: { type: integer, nullable: true, description: null = departamental }
        anio: { type: integer }
        mes: { type: integer }
        numerador: { type: number }
        denominador: { type: number }
        valor: { type: number }
        meta: { type: number }
        cumpleMeta: { type: boolean }
        esProyeccion: { type: boolean }
