  /vacunas:
    get:
      tags: [Catálogos]
      summary: Listar las vacunas del catálogo nacional con sus dosis
      description: |
        El catálogo de vacunas es nacional: no se filtra por DDRISS. Activas e inactivas salvo que se filtre por
        `activa`; cada vacuna trae todas sus dosis (también las inactivas), ordenadas por `orden`. Las vacunas se
        ordenan por `ordenInforme` y nombre. Sin paginar. Un parámetro inválido, desconocido o repetido responde
        400 `ENTRADA_INVALIDA`.
      x-permiso: VACUNA_CONSULTAR
      parameters:
        - name: activa
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Lista de vacunas con sus dosis
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Vacuna" }
        "400":
          description: Un parámetro inválido, desconocido o repetido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                activa:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: activa debe ser true o false. }
                desconocido:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Parámetro no permitido: orden." }
                repetido:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: activa no se puede repetir. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
    post:
      tags: [Catálogos]
      summary: Registrar una vacuna con sus dosis
      description: |
        El catálogo es nacional: la vacuna queda para todas las DDRISS. El código de la vacuna lo escribe el
        usuario y no cambia después. El código y el `orden` de cada dosis los genera el sistema según su `tipo`
        y su lugar en la lista (`UNICA`, `D1`, `D2`…, `R1`, `R2`…), y también calcula `completaEsquema`.

        Reglas de la secuencia (422 `SECUENCIA_INVALIDA`): como máximo una dosis `UNICA`, que no se combina con
        dosis `DOSIS` pero sí con refuerzos; los refuerzos van después de las dosis `UNICA` o `DOSIS`.

        El código y el nombre de la vacuna no pueden repetirse (el nombre, sin distinguir mayúsculas ni tildes), ni
        el nombre de una dosis dentro de la lista. Sin `ordenInforme`, la vacuna va al final del informe.

        La vacuna, sus dosis y el cálculo de `completaEsquema` van en una sola transacción, con una sola fila en
        la bitácora. La vacuna queda sin esquema de captura: se crea aparte (HU-16).
      x-permiso: VACUNA_CREAR
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VacunaNueva" }
      responses:
        "201":
          description: Vacuna registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vacuna" }
        "400":
          description: Campo inválido, faltante o no permitido, tipo inválido o vacuna sin dosis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                codigo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El código de la vacuna debe empezar con una letra y solo puede tener letras sin tildes, números y guion bajo. }
                nombre:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El nombre de la vacuna debe tener entre 3 y 120 caracteres. }
                ordenInforme:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: ordenInforme debe ser un número entero entre 0 y 65535. }
                sinDosis:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: Indique al menos una dosis. }
                tipo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El tipo de la dosis debe ser UNICA, DOSIS o REFUERZO. }
                nombreDosis:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: El nombre de la dosis debe tener entre 3 y 60 caracteres. }
                campo:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: activa." }
                campoDosis:
                  value:
                    error: { codigo: ENTRADA_INVALIDA, mensaje: "Campo no permitido: completaEsquema." }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "409":
          description: Código o nombre de vacuna repetido, o dos dosis con el mismo nombre
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                codigo:
                  value:
                    error: { codigo: VACUNA_DUPLICADA, mensaje: Ya hay una vacuna con ese código. }
                nombre:
                  value:
                    error: { codigo: VACUNA_DUPLICADA, mensaje: Ya hay una vacuna con ese nombre. }
                dosis:
                  value:
                    error: { codigo: DOSIS_DUPLICADA, mensaje: La vacuna ya tiene una dosis con ese nombre. }
        "422": { $ref: "#/components/responses/SecuenciaInvalida" }

  /vacunas/{id}:
